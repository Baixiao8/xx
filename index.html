<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechWords · 科技英语闯关</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Primary — Indigo (tech-Duolingo) */
  --p:#4F46E5;--pd:#3730A3;--pl:#EEF2FF;
  /* Success — Duolingo Green */
  --g:#58CC02;--gd:#46A302;--gl:#D7FFB8;
  /* Error — Duolingo Red */
  --r:#FF4B4B;--rd:#EA2B2B;--rl:#FFEAEA;
  /* XP / Streak — Duolingo Orange */
  --y:#FF9600;--yd:#CC7700;--yl:#FEF3C7;
  /* Neutrals */
  --bg:#F7F7F7;--card:#FFFFFF;
  --tx:#3C3C3C;--mu:#777777;--br:#E5E5E5;--brd:#AFAFAF;
  /* Radius */
  --rad:16px;--rads:12px;--radp:99px;
  /* Hard bottom shadows — Duolingo signature */
  --sh:0 4px 0 0 #D5D5D5;
  --shl:0 6px 0 0 #C5C5C5;
  --shp:0 4px 0 0 var(--pd);
  --shg:0 4px 0 0 var(--gd);
  --shr:0 4px 0 0 var(--rd);
  --shy:0 4px 0 0 var(--yd);
}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden}

/* TOPBAR */
.topbar{background:var(--card);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--br);position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:900;color:var(--p);letter-spacing:-.5px}
.logo span{color:var(--y)}
.stats{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:var(--radp);padding:6px 13px;font-size:14px;font-weight:900;border:2px solid var(--br);box-shadow:var(--sh)}

/* SCREENS */
.screen{display:none;padding-bottom:90px;min-height:100vh}
.screen.active{display:block}

/* HOME */
.hero{background:var(--p);padding:28px 20px 36px;color:#fff;text-align:center;border-radius:0 0 24px 24px}
.hero h1{font-size:26px;font-weight:900;margin-bottom:6px}
.hero p{font-size:13px;opacity:.85;margin-bottom:20px;font-weight:700}
.xp-wrap{background:rgba(255,255,255,.25);border-radius:var(--radp);height:14px;margin:0 10px;overflow:hidden;border:2px solid rgba(255,255,255,.3)}
.xp-fill{height:100%;background:var(--y);border-radius:var(--radp);transition:width .6s ease}
.xp-lbl{font-size:12px;opacity:.85;margin-top:7px;font-weight:800}

.sec-title{font-size:12px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin:20px 20px 12px}
.level-card{background:var(--card);border-radius:var(--rad);padding:16px;margin:0 16px 14px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:14px;border:2px solid var(--br);transition:transform .1s,box-shadow .1s}
.level-card:active{transform:translateY(4px);box-shadow:none}
.level-card.locked{opacity:.45;cursor:not-allowed}
.tier2-card{border-style:dashed}
.tier-banner{display:flex;align-items:center;gap:10px;margin:16px 16px 8px;padding:0 2px}
.tier-banner-line{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--br),transparent)}
.tier-banner-label{font-size:12px;font-weight:900;color:var(--mu);white-space:nowrap;padding:4px 12px;border-radius:99px;border:1.5px solid var(--br);background:var(--card)}
.tier-lock-tip{margin:0 16px 10px;font-size:12px;font-weight:700;color:var(--mu);text-align:center}
.level-card.done{border-color:var(--g);box-shadow:0 4px 0 0 var(--gd)}
.level-card.current{border-color:var(--p);box-shadow:var(--shp)}
.lv-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.lv-info{flex:1;min-width:0}
.lv-info h3{font-size:15px;font-weight:900;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-info .sub{font-size:11px;color:var(--mu);margin-bottom:7px;font-weight:800}
.lv-bar{background:var(--br);border-radius:var(--radp);height:10px;overflow:hidden;border:2px solid var(--brd)}
.lv-fill{height:100%;border-radius:var(--radp);transition:width .5s}
.lv-pct{font-size:10px;color:var(--mu);margin-top:4px;font-weight:800}
.lv-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* LEVEL DETAIL */
.lv-hdr{padding:14px 18px;background:var(--card);border-bottom:2px solid var(--br);display:flex;align-items:center;gap:14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--p);cursor:pointer;background:none;border:none;margin-bottom:14px;text-transform:uppercase;letter-spacing:.3px}
.lv-hdr .back{margin-bottom:0;flex-shrink:0}
.lv-hdr-info{flex:1;min-width:0}
.lv-hdr h2{font-size:20px;font-weight:900;margin-bottom:2px;line-height:1.2}
.lv-hdr p{font-size:12px;color:var(--mu);font-weight:800;line-height:1.3}
.word-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wchip{background:var(--card);border-radius:var(--rads);padding:14px 10px;box-shadow:var(--sh);cursor:pointer;text-align:center;border:2px solid var(--br);transition:transform .1s,box-shadow .1s;position:relative}
.wchip:active{transform:translateY(4px);box-shadow:none}
.wchip.learned{border-color:var(--g);box-shadow:0 4px 0 0 var(--gd);background:var(--gl)}
.wchip .wt{font-size:13px;font-weight:900;margin-bottom:3px}
.wchip .wm{font-size:11px;color:var(--mu);font-weight:800}
.wchip .ck{position:absolute;top:6px;right:7px;font-size:11px}
.wchip .phase-dots{display:flex;gap:3px;align-items:center;justify-content:center;margin-top:6px}
.phase-dot{width:6px;height:6px;border-radius:50%;background:var(--br);border:1.5px solid var(--brd);flex-shrink:0}
.phase-dot.filled{background:var(--p);border-color:var(--p)}
.phase-lbl{font-size:9px;font-weight:900;color:var(--p);margin-left:3px;letter-spacing:.3px}
.phase-badge{display:inline-flex;align-items:center;gap:5px;background:var(--pl);border-radius:var(--radp);padding:4px 10px;font-size:11px;font-weight:900;color:var(--p);margin-bottom:8px}
.phase-badge .phase-dots{display:flex;gap:3px;align-items:center}
.qbtn-wrap{padding:12px 16px;position:sticky;bottom:58px;background:var(--card);border-top:2px solid var(--br);z-index:10}

/* BUTTONS */
.btn{width:100%;padding:17px;border-radius:var(--rads);border:2px solid transparent;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s,box-shadow .1s;letter-spacing:.3px;text-transform:uppercase}
.btn-p{background:var(--p);color:#fff;box-shadow:var(--shp);border-color:var(--pd)}
.btn-p:active{transform:translateY(4px);box-shadow:none}
.btn-g{background:var(--g);color:#fff;box-shadow:var(--shg);border-color:var(--gd)}
.btn-g:active{transform:translateY(4px);box-shadow:none}
.btn-d{background:var(--br);color:var(--mu);cursor:not-allowed;border-color:var(--brd)}
.btn-o{background:var(--card);color:var(--p);border-color:var(--p);box-shadow:var(--shp)}
.btn-o:active{transform:translateY(4px);box-shadow:none}
.btn-review{background:var(--y);color:#fff;border:2px solid var(--yd);box-shadow:var(--shy);width:100%;font-size:15px;font-weight:900;font-family:inherit;border-radius:var(--rads);padding:13px;cursor:pointer;letter-spacing:.3px}
.btn-review:active{transform:translateY(4px);box-shadow:none}
.review-badge{background:var(--y);color:#fff;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:6px}
.daily-wrap{padding:4px 16px 14px}
.daily-bar-bg{background:var(--br);border-radius:6px;height:8px;margin:6px 0 4px;overflow:hidden}
.daily-bar-fill{background:linear-gradient(90deg,var(--g),var(--gd));border-radius:6px;height:100%;transition:width .4s ease}
.daily-lbl{font-size:12px;font-weight:700;color:var(--mu)}

/* VOCAB CARD */
.card-nav{padding:14px 18px;display:flex;align-items:center;background:var(--card);border-bottom:2px solid var(--br);gap:10px;position:sticky;top:58px;z-index:99}
.card-ctr{flex:1;text-align:center;font-size:13px;font-weight:800;color:var(--mu)}
.vocab-card{margin:14px 16px;border-radius:var(--rad);overflow:hidden;box-shadow:var(--shl);border:2px solid var(--br);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

/* Card header — colored */
.vc-head{padding:24px 20px 20px;text-align:center;position:relative}
.vc-emoji{font-size:64px;margin-bottom:12px;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.vc-term{font-size:38px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.vc-full{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:12px;line-height:1.4;font-weight:800}
.vc-pron{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:var(--radp);padding:6px 16px;border:2px solid rgba(255,255,255,.3)}
.vc-pron span{font-size:13px;font-weight:800;color:#fff}
.audio-btn{background:rgba(255,255,255,.25);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s;flex-shrink:0}
.audio-btn:active{transform:scale(.9)}
.audio-btn.speaking{animation:audioAnim .5s ease infinite alternate}
@keyframes audioAnim{from{transform:scale(1)}to{transform:scale(1.15)}}

/* Card header — image variant (v2.17.2: contain 完整展示，不再裁切) */
.vc-head-img{position:relative;background:#F4F5F7;overflow:hidden;cursor:zoom-in;display:flex;align-items:center;justify-content:center;min-height:200px;max-height:340px}
.vc-head-img img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block}
.vc-img-expand{position:absolute;top:10px;right:12px;z-index:2;background:rgba(0,0,0,.35);border:none;border-radius:6px;padding:6px 12px;font-size:11px;color:rgba(255,255,255,.9);font-weight:800;cursor:pointer;line-height:1.4;min-height:32px;backdrop-filter:blur(4px)}

/* 词头信息条（图片下方，替代原图片内遮罩文字） */
.vc-word-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--br);background:var(--card)}
.vc-word-bar .audio-btn-lg{width:40px;height:40px;border-radius:50%;background:var(--pl);border:2px solid var(--p);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.vc-word-bar .audio-btn-lg:active{transform:scale(.9);background:var(--p)}
.vc-word-bar-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* v2.18.1: 标题禁截断——行允许 wrap,放不下时音标 chip 落到下一行(右对齐),单词永远完整可见 */
.vc-word-bar-row{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;min-width:0;flex-wrap:wrap}
.vc-word-bar-row.row-end{justify-content:flex-end}
.vc-word-bar-title{font-size:24px;font-weight:900;color:var(--tx);letter-spacing:-.3px;line-height:1.15;overflow-wrap:break-word;flex:1 1 auto;min-width:0}
.vc-word-bar-full{font-size:11px;color:var(--mu);font-weight:700;overflow-wrap:break-word;flex:1 1 auto;min-width:0}
.vc-word-bar-ph{background:#F4F4F6;color:#3a3a44;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:800;white-space:nowrap;flex-shrink:0;border:1px solid var(--br)}
.vc-word-bar-pron{font-size:12px;font-weight:800;color:var(--p);background:var(--pl);border-radius:var(--radp);padding:4px 10px;flex-shrink:0;white-space:nowrap;margin-left:auto}

/* Image fullscreen overlay */
.img-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:300;padding:16px;flex-direction:column;gap:12px}
.img-ov.show{display:flex}
.img-ov img{max-width:100%;max-height:calc(100vh - 80px);border-radius:12px;object-fit:contain;animation:mpop .25s cubic-bezier(.34,1.56,.64,1)}
.img-ov-close{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 20px;color:#fff;font-size:13px;font-weight:900;cursor:pointer}

/* Card body */
.vc-body{background:var(--card)}
.vc-section{padding:16px 20px;border-bottom:2px solid var(--br)}
.vc-section:last-child{border-bottom:none}
.sec-lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin-bottom:8px}

/* Phonetic box (for colored header cards) */
.phonetic-box{background:var(--p);border-radius:var(--rads);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;border:2px solid var(--pd);box-shadow:var(--shp)}
.ph-icon{font-size:22px;flex-shrink:0}
.ph-text .ph-word{font-size:18px;font-weight:900;color:#fff;margin-bottom:3px}
.ph-text .ph-tip{font-size:12px;color:rgba(255,255,255,.85);line-height:1.5;font-weight:700}

/* Meaning hero block */
.vc-meaning{background:var(--p);border-radius:var(--rads);padding:16px 18px;margin:0;border:2px solid var(--pd);box-shadow:var(--shp)}
.vc-meaning-lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.7);margin-bottom:6px}
.vc-meaning-txt{font-size:15px;font-weight:800;color:#fff;line-height:1.65}

/* Chinese work expression chips */
.zh-work-chips{display:flex;flex-wrap:wrap;gap:8px}
.zh-work-chip{background:var(--gl);color:#2d6a00;border:2px solid var(--g);border-radius:var(--radp);padding:7px 16px;font-size:14px;font-weight:900;box-shadow:var(--shg)}

/* MEMORY SECTION — neutral, supporting role */
.mem-section{padding:16px 20px;border-bottom:2px solid var(--br)}
.mem-header{display:flex;align-items:center;margin-bottom:10px}
.mem-visual-card{background:#F7F7F7;border-radius:var(--rads);padding:14px 16px;margin-bottom:10px;border:2px solid var(--br);position:relative;overflow:hidden}
.mem-visual-deco{font-size:56px;color:var(--brd);opacity:.6;position:absolute;top:-10px;left:8px;line-height:1;font-family:Georgia,serif;pointer-events:none}
.mem-visual-txt{font-size:14px;font-weight:800;color:var(--tx);line-height:1.65;position:relative;z-index:1}
.mem-story-card{background:#F7F7F7;border-radius:var(--rads);padding:14px 16px;border:2px solid var(--br)}
.mem-story-lbl{font-size:10px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.mem-story-txt{font-size:13px;font-weight:700;color:var(--tx);line-height:1.8}

/* MISCONCEPTION — 唯一警示黄，更突出 */
.mc-section{padding:0 20px 16px}
.mc-card{background:var(--yl);border-radius:var(--rads);padding:16px;border:2px solid var(--y);box-shadow:var(--shy);display:flex;gap:14px;align-items:flex-start}
.mc-neq{font-size:28px;font-weight:900;color:var(--yd);flex-shrink:0;line-height:1.1;margin-top:1px}
.mc-txt{font-size:13px;font-weight:700;color:var(--tx);line-height:1.75}
/* 例句 — 白底 + 靛蓝左竖线，不再抢绿色 */
.example-box{background:var(--card);border-radius:var(--rads);padding:14px 16px;border:2px solid var(--br);border-left:4px solid var(--p)}
/* v2.17.0 结果页本次错题卡 + 再练一次按钮 */
.session-wrong-card{text-align:left;margin:0 0 16px;border:2px solid var(--r);border-radius:var(--rads);overflow:hidden;background:var(--rl);box-shadow:var(--shr)}
.session-wrong-head{padding:11px 14px;font-size:13px;font-weight:900;color:#b91c1c;display:flex;justify-content:space-between;align-items:center;background:#fff0f0;border-bottom:1.5px solid var(--r)}
.session-wrong-count{background:var(--r);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
.session-wrong-list{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.session-wrong-item{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--r);border-radius:12px;padding:8px 11px;cursor:pointer;transition:transform .1s}
.session-wrong-item:active{transform:scale(.98)}
.swi-emoji{font-size:22px;flex-shrink:0}
.swi-text{flex:1;min-width:0;overflow:hidden}
.swi-title{font-size:14px;font-weight:900;color:var(--tx);line-height:1.2}
.swi-meaning{font-size:11px;color:var(--mu);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-wrong-badge{flex-shrink:0;background:var(--r);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.btn-replay{background:var(--r);color:#fff;border:2px solid var(--rd);box-shadow:0 4px 0 0 var(--rd)}
.btn-replay:active{transform:translateY(2px);box-shadow:0 2px 0 0 var(--rd)}
.ex-en{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.ex-en-txt{font-size:13px;font-weight:900;color:var(--tx);line-height:1.5;flex:1}
.ex-zh{font-size:12px;color:var(--mu);line-height:1.5;font-weight:700}
.related-chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{background:var(--pl);color:var(--p);border-radius:var(--radp);padding:6px 14px;font-size:12px;font-weight:900;cursor:pointer;border:2px solid var(--p);box-shadow:var(--shp);transition:transform .1s,box-shadow .1s}
.rchip:active{background:var(--p);color:#fff;transform:translateY(2px);box-shadow:none}
/* 常见搭配 chip — 中性灰，不与主色竞争 */
.phrases-chips{display:flex;flex-wrap:wrap;gap:8px}
.phrase-chip{background:var(--card);color:var(--tx);border-radius:var(--radp);padding:6px 14px;font-size:12px;font-weight:800;border:2px solid var(--br);box-shadow:var(--sh);user-select:text}
.card-actions{padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:58px;background:var(--card);border-top:2px solid var(--br);z-index:10}
.card-actions .btn{flex:1;padding:14px;font-size:13px}

/* QUIZ — v2.17.0 Duolingo-style sticky header */
.quiz-hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:2px solid var(--br);min-height:48px}
.quiz-hdr .qhdr-close{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--mu);font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.quiz-hdr .qhdr-close:active{background:var(--br)}
.qhdr-mid{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.qprog{flex:1;background:var(--br);border-radius:var(--radp);height:14px;overflow:hidden;border:2px solid var(--brd);display:flex}
.qprog-fill{height:100%;background:var(--g);border-radius:var(--radp);transition:width .4s ease}
.qhdr-num{font-size:12px;font-weight:900;color:var(--mu);white-space:nowrap;flex-shrink:0}
.qhdr-err{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;background:var(--r);color:#fff;border-radius:var(--radp);padding:4px 10px;font-size:12px;font-weight:900;min-width:34px;justify-content:center;transition:background .2s,transform .2s}
.qhdr-err.zero{background:var(--br);color:var(--mu)}
.qhdr-tts{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:none;background:transparent;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.qhdr-tts:active{background:var(--br)}
.qstats{display:none}
.quiz-body{padding:18px 18px 140px}
@media (max-width:400px){.qhdr-num{display:none}}
/* v2.17.0 沉浸式：答题中隐藏全局 topbar+bnav；词卡详情页隐藏 bnav */
body.quiz-active .topbar{display:none}
body.quiz-active .bnav{display:none}
body.card-active .bnav{display:none}
/* v2.17.3 bnav 隐藏时，sticky 元素的 bottom 偏移要归零，避免下方出现"漏内容"的空隙 */
body.card-active .card-actions{bottom:0}
body.quiz-active .chk-wrap{bottom:0}

<script>
// 词库数据已抽离到 words.js(v2.19.0):LEVELS + SCENE_DATA 由上方 <script src="words.js"> 提供,词库增改请编辑 words.js。

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
// ── localStorage 容错（v2.15.0）──────────────────────────────
// Safari 隐私模式 setItem 会 throw，iOS quota 满会 QuotaExceededError
// 失败时 toast 提示用户，并 throttle 30s 避免轰炸
let _storageOk = true;
let _lastStorageWarn = 0;
function _warnStorage(msg){
  const now = Date.now();
  if(now - _lastStorageWarn < 30000) return;
  _lastStorageWarn = now;
  if(typeof toast === 'function') toast(msg);
}
const S  = k => {
  try { return localStorage.getItem('tw_'+k); }
  catch(e){ console.error('[Storage] read failed:', k, e); return null; }
};
const SS = (k,v) => {
  try {
    localStorage.setItem('tw_'+k, v);
  } catch(e){
    console.error('[Storage] write failed:', k, e);
    if(e.name === 'QuotaExceededError'){
      _warnStorage('💾 存储已满，请清理浏览器缓存');
    } else if(e.name === 'SecurityError'){
      _warnStorage('🔒 隐私模式下进度不会保留');
    } else {
      _warnStorage('⚠️ 数据保存失败');
    }
    _storageOk = false;
  }
};
// 启动探测：toast 函数定义在更下方，所以延迟 800ms 触发用户提示
(function probeStorage(){
  try { localStorage.setItem('tw__probe','1'); localStorage.removeItem('tw__probe'); }
  catch(e){
    _storageOk = false;
    setTimeout(()=>{
      if(typeof toast === 'function') toast('🔒 存储不可用，本次进度不会保留');
    }, 800);
  }
})();
// v2.18 白屏修复:localStorage 里 JSON 损坏时不再让顶层 JSON.parse 抛错炸成白屏,降级回默认值
function loadJSON(k, fb){ try{ return JSON.parse(S(k)||fb); }catch(e){ return JSON.parse(fb); } }
function loadInt(k, fb){ const n=parseInt(S(k)); return isNaN(n)?fb:n; }
let learned = loadJSON('learned','{}');
let wrong   = loadJSON('wrong','{}'); // {wordKey: wrongCount}
let phase   = loadJSON('tw_phase','{}'); // {wordKey: 0-3} 词汇学习阶段
let xp      = loadInt('xp',0);
let streak  = loadInt('streak',0);

// ── 词汇学习阶段 helpers ──
// Phase 0=初见(recognition) / 1=识别(recall) / 2=回忆(cloze) / 3=精通(distinction/cloze)
// Migration: 已标记掌握的词默认从 phase 2 开始
const PHASE_LABELS = ['初见','识别','回忆','精通'];
function getPhase(key){
  if(phase[key] !== undefined) return phase[key];
  return learned[key] ? 2 : 0; // migration
}
function advancePhase(key){
  const cur = getPhase(key);
  if(cur < 3){ phase[key] = cur + 1; SS('tw_phase', JSON.stringify(phase)); }
}
function phaseDots(p){
  const dots = [0,1,2,3].map(i=>'<div class="phase-dot'+(i<=p?' filled':'')+'"></div>').join('');
  return '<div class="phase-dots">'+dots+'<span class="phase-lbl">'+PHASE_LABELS[p]+'</span></div>';
}
let curLv   = null;
let curIdx  = 0;

const DAY = 86400000;
const DAILY_GOAL = 3; // 每日完成 3 词维持连签

// ── 测验模式枚举（互斥，取代三个布尔标志）──────────────────────
// 旧：isReviewMode / isWrongMode / isSingleWordMode（3 bool = 8 组合，只有 4 合法）
// 新：quizMode 只能是下列 4 个值之一，null = 未在测验中
const QUIZ_MODE = { LEVEL:'level', REVIEW:'review', WRONG:'wrong', SINGLE:'single' };
let quizMode = null;

// ── 题目列表（合并旧 qWords + qWordKeys 平行数组）──────────────
// 旧：qWords[i] 和 qWordKeys[i] 必须同步，靠人工保证
// 新：qItems[i] = { word:{…}, key:'lv1_ux' }，索引不可能漂移
let qItems = [];

// ── 统一写入入口（不再在各处散写 learned/wrong/xp）────────────
function recordCorrect(key){
  xp+=5; SS('xp',xp); updateTopbar();
  const prevP=getPhase(key); advancePhase(key);
  const nextP=getPhase(key);
  if(wrong[key]>0){ wrong[key]--; if(!wrong[key]) delete wrong[key]; SS('wrong',JSON.stringify(wrong)); }
  return nextP>prevP ? ' · '+PHASE_LABELS[nextP]+' 🆙' : '';
}
function recordWrong(key){
  wrong[key]=(wrong[key]||0)+1; SS('wrong',JSON.stringify(wrong));
  // v2.15.0: 答错降阶（修复"虚假精通"）
  // phase ≥ 2 时降一档（phase 0/1 不动，避免惩罚新词）
  // 同时把 learned 时间戳打回过期状态，让 review queue 立即拾取
  const p = getPhase(key);
  let demoted = '';
  if(p >= 2){
    phase[key] = p - 1;
    SS('tw_phase', JSON.stringify(phase));
    demoted = ' · 🔻 降至「'+PHASE_LABELS[p-1]+'」';
  }
  if(learned[key]){
    learned[key] = Date.now() - getReviewInterval(key) - 1;
    SS('learned', JSON.stringify(learned));
  }
  return demoted;
}

// ── 关卡内错题重现（v2.9.0）──────────────────────────────────
// 答错时将该词追加到队列末尾（最多重现1次，SINGLE模式跳过）
// 返回 true 表示实际追加了，false 表示已有重现或 SINGLE 模式
function requeueItem(item){
  if(quizMode === QUIZ_MODE.SINGLE) return false;
  const alreadyQueued = qItems.slice(qIdx+1).some(i => i.key === item.key && i.reappear);
  if(alreadyQueued) return false;
  qItems.push({...item, reappear: true});
  const total = qItems.length;
  document.getElementById('qNum').textContent = (qIdx+1)+'/'+total;
  // 进度条由 renderQuiz() 统一按原始题数绘制，此处不更新
  return true;
}

// ── 重置所有测验状态（唯一出口，不会漏掉某个标志）────────────
function resetQuizState(){
  quizMode=null; qItems=[]; qIdx=0; qScore=0; qErrN=0; qAnswered=false; qOpts=[];
}

// ── 开发期不变量断言（生产环境自动跳过）──────────────────────
function assertState(){
  if(typeof __DEV__==='undefined') return;
  console.assert(quizMode===null||Object.values(QUIZ_MODE).includes(quizMode),'非法 quizMode:',quizMode);
  console.assert(qItems.length===0||qIdx<qItems.length,'qIdx 越界:',qIdx,'/',qItems.length);
}

// 初始化今日已学词数（每天重置）
let todayLearned = (() => {
  const today = new Date().toDateString();
  if(S('tw_todayDate') !== today){ SS('tw_todayDate', today); SS('tw_todayLearned','0'); return 0; }
  return parseInt(S('tw_todayLearned')||'0');
})();

function todayStr(){ return new Date().toDateString(); }

// 每完成 n 词就累加今日进度，达到目标后更新 Streak
function addTodayLearned(n){
  const today = todayStr();
  if(S('tw_todayDate') !== today){ todayLearned=0; SS('tw_todayDate',today); }
  todayLearned = Math.min(todayLearned + n, DAILY_GOAL * 4); // 上限不影响体验
  SS('tw_todayLearned', todayLearned);
  if(todayLearned >= DAILY_GOAL){
    const last = S('lastStudied');
    if(last !== today){
      const yesterday = new Date(Date.now()-DAY).toDateString();
      if(last === yesterday){
        streak++;
        // 每 7 天奖励一个 Freeze（上限 2）
        if(streak % 7 === 0){
          const fc = parseInt(S('freezeCount')||'0');
          if(fc < 2){ SS('freezeCount', fc+1); toast('❄️ 获得 Streak Freeze × 1！连签奖励'); }
        }
      } else {
        // 断签：检查是否有 Freeze 可用
        const fc = parseInt(S('freezeCount')||'0');
        if(fc > 0){
          SS('freezeCount', fc-1);
          toast('❄️ Streak Freeze 保住了你的连签！（剩余 '+(fc-1)+' 个）');
          // streak 保持不变
        } else {
          streak = 1;
        }
      }
      SS('streak', streak); SS('lastStudied', today);
      updateTopbar();
      if(streak > 1 && last === yesterday) toast('🔥 连签 '+streak+' 天，继续加油！');
    }
  }
  updateDailyProgress();
}

// 更新首页今日进度条
function updateDailyProgress(){
  const el = document.getElementById('dailyProgress');
  if(!el) return;
  const g = Math.min(todayLearned, DAILY_GOAL);
  const done = g >= DAILY_GOAL;
  el.innerHTML = '<div class="daily-wrap">'
    +'<div class="daily-bar-bg"><div class="daily-bar-fill" style="width:'+(g/DAILY_GOAL*100)+'%"></div></div>'
    +'<div class="daily-lbl">今日目标 '+g+'/'+DAILY_GOAL+' 词 '+(done?'🔥 已完成，Streak 保住了！':'🎯 再学 '+(DAILY_GOAL-g)+' 词维持连签')+'</div>'
    +'</div>';
}
// Phase-based SRS intervals: 0-1 → 1d, 2 → 7d, 3 → 16d
function getReviewInterval(key){
  const p = getPhase(key);
  if(p <= 1) return DAY;
  if(p === 2) return 7 * DAY;
  return 16 * DAY;
}
function getReviewQueue(){
  const now = Date.now(), queue = [];
  LEVELS.forEach(lv => lv.words.forEach(w => {
    const key = lv.id+'_'+w.id;
    const t = learned[key];
    if(t && typeof t === 'number' && (now - t > getReviewInterval(key)))
      queue.push({lv, w});
  }));
  return queue.slice(0, 10);
}

  rate = rate||0.88;

  const u = new SpeechSynthesisUtterance(txt);
  u.lang='en-US'; u.rate=rate;
  speechSynthesis.speak(u);
}

function confetti(){
  const cols=['#4F46E5','#58CC02','#FF4B4B','#FF9600','#EC4899'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');
    el.className='conf';
    const sz=6+Math.random()*7;
    el.style.cssText=[
      'left:'+Math.random()*100+'vw',
      'width:'+sz+'px',
      'height:'+sz+'px',
      'background:'+cols[i%5],
      'animation-duration:'+(1.2+Math.random()*1.6)+'s',
      'animation-delay:'+Math.random()*0.5+'s'
    ].join(';');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3500);
  }
}

function renderHome(){
  updateTopbar();
  updateDailyProgress();
  // 错题本模块
  const wrongWords = [];
  LEVELS.forEach(lv => lv.words.forEach(w => {
    if((wrong[lv.id+'_'+w.id]||0) > 0) wrongWords.push({lv, w});
  }));
  const ws = document.getElementById('wrongSection');
  if(wrongWords.length > 0){
    ws.innerHTML = '<div class="sec-title">📌 错题专练 <span class="review-badge" style="background:var(--r)">'+wrongWords.length+' 词</span></div>'
      +'<div style="display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch">'
      +wrongWords.map(({lv,w})=>{
        const cnt = wrong[lv.id+'_'+w.id]||0;
        return '<div onclick="openCard('+lv.id+',\''+w.id+'\')" style="flex-shrink:0;background:#fff;border-radius:14px;padding:12px 14px;min-width:90px;text-align:center;border:1.5px solid var(--r);box-shadow:0 4px 0 0 var(--rd);cursor:pointer">'
          +'<div style="font-size:22px;margin-bottom:5px">'+w.emoji+'</div>'
          +'<div style="font-size:12px;font-weight:800;color:var(--tx)">'+w.title+'</div>'
          +'<div style="font-size:10px;color:var(--r);margin-top:2px;font-weight:800">错 '+cnt+' 次</div>'
          +'</div>';
      }).join('')+'</div>'
      +'<div style="padding:0 16px 16px">'
        +'<button class="btn-review" onclick="startWrongQuiz()" style="background:var(--r);border-color:var(--rd);box-shadow:0 4px 0 0 var(--rd)">📌 专练错题（'+wrongWords.length+' 词）</button>'
      +'</div>';
  } else { ws.innerHTML = ''; }

  const reviewQ = getReviewQueue();
  const totalLearned = Object.keys(learned).length;
  const rs = document.getElementById('reviewSection');
  if(totalLearned > 0){
    const showWords = reviewQ.length > 0 ? reviewQ : [];
    rs.innerHTML = '<div class="sec-title">'
      +(reviewQ.length > 0 ? '🔄 今日复习 <span class="review-badge">'+reviewQ.length+' 词到期</span>' : '🔄 随机练习')
      +'</div>'
      +(showWords.length > 0
        ? '<div style="display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch">'
          +showWords.map(({lv,w})=>
            '<div onclick="openCard('+lv.id+',\''+w.id+'\')" style="flex-shrink:0;background:#fff;border-radius:14px;padding:12px 14px;min-width:90px;text-align:center;border:1.5px solid var(--br);box-shadow:var(--sh);cursor:pointer">'
            +'<div style="font-size:22px;margin-bottom:5px">'+w.emoji+'</div>'
            +'<div style="font-size:12px;font-weight:800;color:var(--tx)">'+w.title+'</div>'
            +'<div style="font-size:10px;color:var(--mu);margin-top:2px">'+w.term+'</div>'
            +'</div>'
          ).join('')+'</div>'
        : '')
      +'<div style="padding:0 16px 16px">'
        +'<button class="btn-review" onclick="startReviewQuiz()">🔄 随机复习练习（共 '+totalLearned+' 词）</button>'
      +'</div>';
  } else { rs.innerHTML = ''; }
  const total = LEVELS.reduce((a,l)=>a+l.words.length,0);
  const done  = Object.keys(learned).length;
  let mastered = 0;  // v2.18: 真正精通(phase 3)才算"精通",与"已学"区分 —— 绿勾不再来太早
  LEVELS.forEach(lv=>lv.words.forEach(w=>{ if(getPhase(lv.id+'_'+w.id)>=3) mastered++; }));
  const pct   = Math.round(done/total*100);
  document.getElementById('heroBar').style.width = pct+'%';
  document.getElementById('heroLbl').textContent = '已学 '+done+' / '+total+' 词 · 精通 '+mastered+' · '+xp+' XP';

  const list = document.getElementById('lvList');
  // Tier 1 全部词汇数 & 已学数（用于 Tier 2/3 解锁判断）
  const tier1Lvs = LEVELS.filter(lv=>!lv.tier||lv.tier===1);
  const tier1Learned = tier1Lvs.reduce((sum,lv)=>sum+lv.words.filter(w=>learned[lv.id+'_'+w.id]).length,0);
  const tier1Total   = tier1Lvs.reduce((sum,lv)=>sum+lv.words.length,0);
  const tier2Unlocked = tier1Learned >= Math.floor(tier1Total * 0.6); // 完成 60% Tier 1 即解锁 Tier 2
  const tier2Lvs = LEVELS.filter(lv=>lv.tier===2);
  const tier2Learned = tier2Lvs.reduce((sum,lv)=>sum+lv.words.filter(w=>learned[lv.id+'_'+w.id]).length,0);
  const tier2Total   = tier2Lvs.reduce((sum,lv)=>sum+lv.words.length,0);
  const tier3Unlocked = tier2Learned >= Math.floor(tier2Total * 0.6); // 完成 60% Tier 2 即解锁 Tier 3
  const tier3FirstIdx = LEVELS.findIndex(lv=>lv.tier===3);

  list.innerHTML = LEVELS.map((lv,i)=>{
    const isTier2 = lv.tier === 2;
    const isTier3 = lv.tier === 3;
    const tier2FirstIdx = LEVELS.findIndex(lv=>lv.tier===2);
    const lvDone = lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
    const lvPct  = Math.round(lvDone/lv.words.length*100);
    const prevLv = LEVELS[i-1];
    // 解锁逻辑：Tier 1 逐关；Tier 2 首关靠 Tier1 进度；Tier 3 首关靠 Tier2 进度；其他关靠前一关完成
    let unlocked;
    if(!isTier2 && !isTier3) {
      unlocked = i===0||lv.alwaysOpen||(prevLv&&prevLv.words.filter(w=>learned[prevLv.id+'_'+w.id]).length===prevLv.words.length);
    } else if(i===tier2FirstIdx) {
      unlocked = tier2Unlocked;
    } else if(i===tier3FirstIdx) {
      unlocked = tier3Unlocked;
    } else {
      const tierUnlocked = isTier3 ? tier3Unlocked : tier2Unlocked;
      unlocked = tierUnlocked&&(prevLv&&prevLv.words.filter(w=>learned[prevLv.id+'_'+w.id]).length===prevLv.words.length);
    }
    const allDone  = lvDone===lv.words.length;
    const cls   = !unlocked?'locked':allDone?'done':lvDone>0?'current':'';
    const badge = !unlocked?'🔒':allDone?'✅':'▶';
    const click = unlocked?'openLevel('+lv.id+')':'';
    // Tier 分隔符
    let tierBanner = '';
    if(isTier2 && i===tier2FirstIdx){
      tierBanner = '<div class="tier-banner"><div class="tier-banner-line"></div><div class="tier-banner-label">✨ 进阶关卡 · Tier 2</div><div class="tier-banner-line"></div></div>'
        +(tier2Unlocked ? '' : '<div class="tier-lock-tip">完成 Tier 1 的 60% 词汇即可解锁（当前 '+tier1Learned+' / '+Math.floor(tier1Total*0.6)+'）</div>');
    } else if(isTier3 && i===tier3FirstIdx){
      tierBanner = '<div class="tier-banner"><div class="tier-banner-line"></div><div class="tier-banner-label">🏆 专家关卡 · Tier 3</div><div class="tier-banner-line"></div></div>'
        +(tier3Unlocked ? '' : '<div class="tier-lock-tip">完成 Tier 2 的 60% 词汇即可解锁（当前 '+tier2Learned+' / '+Math.floor(tier2Total*0.6)+'）</div>');
    }
    return tierBanner + '<div class="level-card '+cls+(isTier3?' tier2-card':(isTier2?' tier2-card':''))+'" onclick="'+click+'">'
      +'<div class="lv-ico" style="background:'+lv.bg+'">'+lv.emoji+'</div>'
      +'<div class="lv-info">'
        +'<h3>Lv.'+(i+1)+' · '+lv.title+'</h3>'
        +'<div class="sub">'+lv.sub+' · '+lv.words.length+'词</div>'
        +'<div class="lv-bar"><div class="lv-fill" style="width:'+lvPct+'%;background:'+lv.color+'"></div></div>'
        +'<div class="lv-pct">'+lvDone+'/'+lv.words.length+' 已学</div>'
      +'</div>'
      +'<div class="lv-badge" style="background:'+lv.bg+';color:'+lv.color+'">'+badge+'</div>'
    +'</div>';
  }).join('');
}

function openLevel(id){
  curLv = LEVELS.find(l=>l.id===id);
  showScreen('level');
  document.getElementById('n-home').classList.add('active');
  const lv=curLv;
  document.getElementById('lvTitle').textContent = lv.emoji+' '+lv.title;
  document.getElementById('lvSub').textContent   = lv.sub+' · '+lv.words.length+' 词';

  const lvDone = lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
  document.getElementById('wordGrid').innerHTML = lv.words.map(w=>{
    const ok = !!learned[lv.id+'_'+w.id];
    const shortMeaning = w.meaning.length>18 ? w.meaning.slice(0,18)+'…' : w.meaning;
    const wKey = lv.id+'_'+w.id;
    const wp = ok ? getPhase(wKey) : -1;
    return '<div class="wchip '+(ok?'learned':'')+'" onclick="openCard('+lv.id+',\''+w.id+'\')">'
      +'<span class="ck">'+(ok?'✅':'')+'</span>'
      +'<div class="wt">'+w.emoji+' '+w.title+'</div>'
      +'<div class="wm">'+shortMeaning+'</div>'
      +(ok ? phaseDots(wp) : '')
    +'</div>';
  }).join('');

  const btn = document.getElementById('quizBtn');
  if(lvDone>=5){
    btn.className='btn btn-p'; btn.textContent='🎯 开始测验'; btn.disabled=false;
  } else {
    btn.className='btn btn-d'; btn.textContent='先学 '+(5-lvDone)+' 个词再测验'; btn.disabled=true;
  }
}

function _esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function _dk(hex,amt){
  try{
    const n=parseInt(hex.slice(1),16);
    return 'rgb('+Math.max(0,((n>>16)&255)-amt)+','+Math.max(0,((n>>8)&255)-amt)+','+Math.max(0,(n&255)-amt)+')';
  }catch(e){return hex;}
}

// v2.17.7: 彻底滚顶（含 iOS Safari momentum + button focus 抵消问题）
function _scrollCardTop(){
  // 1. 主动 blur 当前焦点（避免浏览器 scroll-into-view 把焦点元素拉回视口）
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  // 2. 三重 scrollTop 一次性归零（window + html + body 任何一个生效都行）
  const reset = () => {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  };
  reset();
  // 3. RAF 后再保险一次，覆盖 layout 重排后的 race condition / iOS momentum
  requestAnimationFrame(reset);
}
function prevCard(){

  if(!wrongKeys||!wrongKeys.length){ toast('没有错题可练'); return; }
  const pool=[];
  wrongKeys.forEach(key=>{
    const parts=key.split('_'), lvId=+parts[0], wId=parts.slice(1).join('_');

  quizMode=QUIZ_MODE.WRONG; curLv=null;
  qItems=[...pool].sort(()=>Math.random()-.5);
  showScreen('quiz');
  document.getElementById('n-home').classList.add('active');

function startReviewQuiz(){
  // v2.18: 优先到期词(让 SRS 间隔重复真正起作用),不足 10 再用其它已学词随机补足(保持新鲜感)
  const now=Date.now(), due=[], rest=[];
  LEVELS.forEach(lv=>lv.words.forEach(w=>{
    const key=lv.id+'_'+w.id;
    if(!learned[key]) return;
    const item={word:w, key};
    if(now - learned[key] > getReviewInterval(key)) due.push(item); else rest.push(item);
  }));
  if(!due.length && !rest.length){ toast('还没有已学词汇，先去学几个词吧！'); return; }
  due.sort(()=>Math.random()-.5); rest.sort(()=>Math.random()-.5);
  _quizStartXp=xp; _sessionWrongKeys=new Set();
  resetQuizState();
  quizMode=QUIZ_MODE.REVIEW; curLv=null;
  qItems=[...due, ...rest].slice(0,10);  // 到期词排前,优先复习
  showScreen('quiz');
  document.getElementById('n-home').classList.add('active');
  renderQuiz();
}

// 构建填空题内容（3种变体随机）
function buildClozeContent(w){
  const escT = w.title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const blankStr = '<span class="cloze-blank">'+Array(Math.max(w.title.length,3)+1).join('_')+'</span>';
  const variants = [];

  // 变体A：例句填空
  const blankedEx = w.ex.replace(new RegExp('\\b'+escT+'\\b','gi'), blankStr);
  if(blankedEx !== w.ex){
    variants.push({
      html:'<div class="cloze-sentence">'+blankedEx+'</div>'
          +'<div class="cloze-zh">'+w.exZh+'</div>'
          +'<div class="qquestion">填入正确的英文单词</div>',
      hint:w.pron+' · 共 '+w.title.length+' 个字母'
    });
  }

  // 变体B：短语填空（从 phrases 字段取搭配）
  if(w.phrases){
    const phraseArr = w.phrases.split('/').map(p=>p.trim()).filter(p=>{
      const bl = p.replace(new RegExp('\\b'+escT+'\\b','gi'), blankStr);
      return bl!==p && p.toLowerCase()!==w.title.toLowerCase();
    });
    if(phraseArr.length){
      const phrase = phraseArr[Math.floor(Math.random()*phraseArr.length)];
      const blankedP = phrase.replace(new RegExp('\\b'+escT+'\\b','gi'), blankStr);
      variants.push({
        html:'<div class="cloze-sentence" style="font-size:20px;letter-spacing:.5px">'+blankedP+'</div>'
            +'<div class="cloze-zh">常见搭配，填入缺失的词</div>'
            +'<div class="qquestion">填入正确的英文单词</div>',
        hint:w.pron+' · 共 '+w.title.length+' 个字母'
      });
    }
  }

  // 变体C：看中文释义写英文（最难，无上下文）
  variants.push({
    html:'<div class="cloze-sentence" style="font-size:14px;line-height:1.7;text-align:left">'+w.meaning+'</div>'
        +'<div class="cloze-zh">根据中文释义，写出对应英文单词</div>'
        +'<div class="qquestion">这个词的英文是？</div>',
    hint:'共 '+w.title.length+' 个字母'
  });

  return variants[Math.floor(Math.random()*variants.length)];
}

function renderQuiz(){
  assertState();
  const {word:w, key:curKey}=qItems[qIdx], total=qItems.length;
  // 进度条基于原始题数（不含重现词），防止错题重现时进度视觉倒退
  const _origN=qItems.filter(i=>!i.reappear).length||total;
  document.getElementById('qBar').style.width  = Math.min(qIdx/_origN*100,100)+'%';
  document.getElementById('qNum').textContent  = (qIdx+1)+'/'+total;
  document.getElementById('qOk').textContent   = qScore;
  document.getElementById('qErr').textContent  = qErrN;
  document.getElementById('fb').className      = 'fb';
  document.getElementById('chkBtn').style.display='none';
  document.getElementById('nxtBtn').style.display='none';
  qAnswered=false;

  // 从全关卡取干扰项
  const allWords = LEVELS.flatMap(lv=>lv.words);
  const pool2 = allWords.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
  qOpts=[w,...pool2].sort(()=>Math.random()-.5);
  const letters=['A','B','C','D'];
  const shortM = m => m.length>28 ? m.slice(0,28)+'…' : m;
  const shortT = t => t.length>22 ? t.slice(0,22)+'…' : t;

  // 判断题型（词汇学习阶段系统）：
  // Phase 0=初见 → 认知识别(recognition)
  // Phase 1=识别 → 反向测验(recall)
  // Phase 2=回忆 → 填空练习(cloze)
  // Phase 3=精通 → 辨析(distinction，有misconception) / 填空(cloze)
  const curPhase = getPhase(curKey);
  let qType;
  if(curPhase >= 3){
    qType = w.misconception ? 'distinction' : 'cloze';
  } else if(curPhase === 2){
    qType = 'cloze';
  } else if(curPhase === 1){
    qType = 'recall';
  } else {
    qType = 'recognition'; // phase 0
  }
  const useCloze = qType==='cloze';
  const useActiveRecall = qType==='recall';
  const useDistinction = qType==='distinction';

  if(useCloze){
    // ✏️ 填空练习（3种变体随机）
    const cloze = buildClozeContent(w);
    document.getElementById('qBody').innerHTML =

// 答错强化提示：利用纠错强化窗口，在答错后展示记忆钩子
// 优先级：misconception > visual > story
function buildWrongHint(w){
  if(w.misconception){
    return '<div class="wrong-hint wrong-hint-mis">'
      +'<div class="wh-lbl">⚠️ 记住这个区别</div>'
      +'<div class="wh-txt">'+w.misconception+'</div>'
      +'</div>';
  }
  if(w.visual){
    return '<div class="wrong-hint wrong-hint-mem">'
      +'<div class="wh-lbl">💡 这样联想</div>'
      +'<div class="wh-txt">'+w.visual+'</div>'
      +'</div>';
  }
  if(w.story){
    return '<div class="wrong-hint wrong-hint-mem">'
      +'<div class="wh-lbl">📖 工作场景</div>'
      +'<div class="wh-txt">'+w.story+'</div>'
      +'</div>';
  }
  return '';
}

function selectOpt(i){
  if(qAnswered) return;
  qAnswered=true;
  const {word:w, key}=qItems[qIdx], correct=qOpts[i].id===w.id;
  qOpts.forEach((o,j)=>{
    const el=document.getElementById('opt'+j);
    el.style.pointerEvents='none';
    if(o.id===w.id) el.classList.add('ok');
    else if(j===i&&!correct) el.classList.add('err');
  });
  const fb=document.getElementById('fb');
  if(correct){
    qScore++;
    const phaseUp=recordCorrect(key);
    fb.className='fb ok-fb show';
    fb.innerHTML='<div class="fb-t">✅ 正确！+5 XP'+phaseUp+'</div><div class="fb-b">'+w.meaning+'</div>';
  } else {
    qErrN++;
    const demoted=recordWrong(key);
    _sessionWrongKeys.add(key);
    const requeued = requeueItem(qItems[qIdx]);
    fb.className='fb err-fb show';
    fb.innerHTML='<div class="fb-t">❌ 正确答案：'+w.title+demoted+'</div><div class="fb-b">'+w.meaning+'</div>'+buildWrongHint(w)+(requeued?'<div class="reappear-hint">📌 稍后会再练一次这个词</div>':'');
    setTimeout(()=>showReteachModal(w), 400);
  }
  document.getElementById('qOk').textContent=qScore;
  document.getElementById('qErr').textContent=qErrN;
  document.getElementById('nxtBtn').style.display='block';
  syncQuizHdrTts();
}

function checkAns(){
  if(qAnswered) return;
  const inp=document.getElementById('clozeInput');
  if(!inp||!inp.value.trim()) return;
  qAnswered=true;
  const {word:w, key}=qItems[qIdx];
  const correct=inp.value.trim().toLowerCase()===w.title.toLowerCase();
  inp.disabled=true;
  document.getElementById('chkBtn').style.display='none';
  const fb=document.getElementById('fb');
  if(correct){
    qScore++;
    const phaseUp=recordCorrect(key);
    fb.className='fb ok-fb show';
    fb.innerHTML='<div class="fb-t">✅ 正确！+5 XP'+phaseUp+'</div><div class="fb-b">'+w.meaning+'</div>';
    inp.style.borderColor='var(--g)';inp.style.background='var(--gl)';inp.style.color='#2d6a00';
  } else {
    qErrN++;
    const demoted=recordWrong(key);
    _sessionWrongKeys.add(key);
    const requeued = requeueItem(qItems[qIdx]);
    fb.className='fb err-fb show';
    fb.innerHTML='<div class="fb-t">❌ 正确答案：'+w.title+demoted+'</div><div class="fb-b">'+w.meaning+'</div>'+buildWrongHint(w)+(requeued?'<div class="reappear-hint">📌 稍后会再练一次这个词</div>':'');
    inp.style.borderColor='var(--r)';inp.style.background='var(--rl)';inp.style.color='#b91c1c';
    setTimeout(()=>showReteachModal(w), 400);
  }
  document.getElementById('qOk').textContent=qScore;
  document.getElementById('qErr').textContent=qErrN;
  document.getElementById('nxtBtn').style.display='block';
}

function nextQ(){
  qIdx++;
  if(qIdx>=qItems.length) finishQuiz();
  else {
    renderQuiz();
    // v2.17.1: 改为 instant 避免 smooth scroll 中途被打断导致滚不到顶；document.documentElement + body 双保险
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
}

function finishQuiz(){
  const total=qItems.length;
  const origTotal=qItems.filter(i=>!i.reappear).length; // 原始词数（不含重现题）
  const pct=Math.round(qScore/origTotal*100);
  const passed=pct>=70;

  // ── 数据处理（所有模式共用）──
  if(passed){
    if(quizMode===QUIZ_MODE.REVIEW||quizMode===QUIZ_MODE.WRONG){
      qItems.forEach(({key})=>{ if(learned[key]) learned[key]=Date.now(); });
    } else {
      qItems.forEach(({key})=>{ if(!learned[key]){ learned[key]=Date.now(); xp+=5; } });
      SS('xp',xp);
    }
    SS('learned',JSON.stringify(learned));
    addTodayLearned(qScore);
    updateTopbar();
  }

  // ── 单词模式：modal 反馈，自动进入下一词 ──
  if(quizMode===QUIZ_MODE.SINGLE){
    const wasReview=!!learned[qItems[0].key]; // learned 尚未被本轮覆写，反映测验前状态
    const _passed=passed;
    resetQuizState();
    showSingleWordResult(_passed, wasReview);
    if(_passed) setTimeout(confetti,100);
    return;
  }

  // ── 普通模式：结果页（先缓存需要用到的值，再 reset）──
  const _mode=quizMode, _total=origTotal, _curLvId=curLv?curLv.id:0, _curLvTitle=curLv?curLv.title:'';
  const _qScore=qScore, _qErrN=qErrN;
  const _sessionXp = xp - _quizStartXp; // 本轮获得 XP
  // 本轮答错词单（去重，不含重现题重复项）
  const _wrongItems = qItems.filter(i=>_sessionWrongKeys.has(i.key)&&!i.reappear);
  resetQuizState();

  showScreen('result');
  const emoji=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  const msg=pct>=90?'完美！你是词汇高手！':pct>=70?'太棒了，继续保持！':pct>=50?'不错，再练练更好！':'多练练，加油！';
  const subTitle=_mode===QUIZ_MODE.WRONG?'📌 完成错题专练':_mode===QUIZ_MODE.REVIEW?'🔄 完成随机复习练习':'完成「'+_curLvTitle+'」测验';
  const wrongCount=Object.keys(wrong).filter(k=>wrong[k]>0).length;
  const wrongNote=_qErrN>0
    ?'<div style="background:var(--rl);border:2px solid var(--r);border-radius:var(--rads);padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:800;color:#b91c1c">📌 本轮答错 '+_qErrN+' 题，已记入错题本（共 '+wrongCount+' 词待练）</div>'
    :(wrongCount>0?'<div style="background:var(--gl);border:2px solid var(--g);border-radius:var(--rads);padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:800;color:#2d6a00">✅ 本轮全对！错题本还有 '+wrongCount+' 词待清零</div>':'');
  document.getElementById('resultWrap').innerHTML=
    '<span class="r-emoji">'+emoji+'</span>'
    +'<div class="r-title">'+msg+'</div>'
    +'<div class="r-sub">'+subTitle+'</div>'
    +'<div class="r-stats">'
      +'<div class="r-stat"><div class="num">'+_qScore+'/'+_total+'</div><div class="lbl">答对题数</div></div>'
      +'<div class="r-stat"><div class="num" style="color:'+(pct>=70?'var(--g)':'var(--r)')+'">'+pct+'%</div><div class="lbl">正确率</div></div>'
    +'</div>'
    +wrongNote
    +(_wrongItems.length>0
      ?'<div class="session-wrong-card">'
        +'<div class="session-wrong-head">'
          +'<span>📝 本次答错</span>'
          +'<span class="session-wrong-count">'+_wrongItems.length+' 词</span>'
        +'</div>'
        +'<div class="session-wrong-list">'
          +_wrongItems.map(({word:w,key:k})=>{
            const errN=wrong[k]||1;
            const parts=k.split('_'), lvId=+parts[0], wId=parts.slice(1).join('_');
            return '<div class="session-wrong-item" onclick="openCard('+lvId+',\''+wId+'\')">'
              +'<span class="swi-emoji">'+w.emoji+'</span>'
              +'<div class="swi-text"><div class="swi-title">'+w.title+'</div><div class="swi-meaning">'+(w.meaning||'').slice(0,12)+'</div></div>'
              +'<span class="session-wrong-badge">❌ ×'+errN+'</span>'
            +'</div>';
          }).join('')
        +'</div>'
      +'</div>'
      :'')
    +'<div class="xp-earned"><div class="xi">⚡</div><div>'
      +(_sessionXp>0?'<div class="xn">+'+_sessionXp+' XP</div><div class="xl">本次获得 · 累计 '+xp+' XP</div>':'<div class="xn">'+xp+' XP</div><div class="xl">累计经验值</div>')
    +'</div></div>'
    +(_wrongItems.length>0
      ?'<button class="btn btn-replay" onclick=\'startSessionReplay('+JSON.stringify(_wrongItems.map(i=>i.key))+')\' style="margin-bottom:12px">🔄 再练一次错题（'+_wrongItems.length+' 词）</button>'
      :'')
    +(_mode===QUIZ_MODE.WRONG
      ?'<button class="btn btn-p" onclick="startWrongQuiz()" style="margin-bottom:12px">📌 全局错题专练</button>'
       +'<button class="btn btn-g" onclick="goHome()">🏠 返回主页</button>'
      :_mode===QUIZ_MODE.REVIEW
        ?'<button class="btn btn-p" onclick="startReviewQuiz()" style="margin-bottom:12px">🔄 再来一次</button>'
         +'<button class="btn btn-g" onclick="goHome()">🏠 返回主页</button>'
        :'<button class="btn btn-p" onclick="startQuiz()" style="margin-bottom:12px">🔄 再来一次</button>'
         +'<button class="btn btn-o" onclick="openLevel('+_curLvId+')">← 返回关卡</button>');
  if(pct>=80) setTimeout(confetti,200);
}

      ?(wasReview?'<p style="margin-bottom:4px">复习完成，记忆强化 💪</p>':'<p style="color:var(--g);font-weight:900;margin-bottom:4px">已学会一次 +5 XP 🎉<br><span style="font-size:11px;color:var(--mu);font-weight:600">隔几天复习答对才算真记牢</span></p>')
      :'<p style="color:var(--r);font-weight:700;margin-bottom:4px">已记入错题本'+(wrongCount>0?'（共 '+wrongCount+' 词）':'')+'<br><span style="font-size:11px;color:var(--mu);font-weight:600">稍后在首页错题专练复习</span></p>')

}

let _sT;
function initSearch(){
  document.getElementById('sinput').value='';
  document.getElementById('sResults').innerHTML='<div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div>';
  const hot=['AI','Token','API','Agent','LLM','Prompt','UX','MVP','RAG','MCP'];
  document.getElementById('hotTags').innerHTML=hot.map(t=>'<span class="htag" onclick="searchWord(\''+t+'\')">'+t+'</span>').join('');
}

function doSearch(q){
  clearTimeout(_sT);
  document.getElementById('hotTags').style.display = q.trim() ? 'none' : 'flex';
  _sT=setTimeout(()=>{
    if(!q.trim()){document.getElementById('sResults').innerHTML='<div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div>';return;}
    const ql=q.toLowerCase(),res=[];
    LEVELS.forEach(lv=>lv.words.forEach(w=>{
      if(w.title.toLowerCase().includes(ql)||w.term.toLowerCase().includes(ql)||
         w.meaning.includes(q)||w.ph.includes(q)||w.id.includes(ql)||
         (w.zhExpr&&w.zhExpr.includes(q)))
        res.push({lv,w});
    }));
    document.getElementById('sResults').innerHTML=res.length
      ? res.map(({lv,w})=>'<div class="sr-card" onclick="openCard('+lv.id+',\''+w.id+'\')">'
          +'<div class="sr-term">'+w.emoji+' '+w.title+'</div>'
          +'<div class="sr-zh">'+w.term+'</div>'
          +'<div class="sr-def">'+w.meaning.slice(0,50)+'…</div>'
          +'<div class="sr-lv" style="color:'+lv.color+'">'+lv.emoji+' '+lv.title+'</div>'
        +'</div>').join('')
      : '<div class="s-empty"><div class="ei">😕</div><p>没找到相关词汇</p></div>';
  },300);
}

function searchWord(term){
  goSearch();
  document.getElementById('sinput').value=term;
  doSearch(term);
}

// ══════════════════════════════════════════════
// 进度导出码(v2.20.0)— 与小程序「设置 → 导入进度码」互通
// ══════════════════════════════════════════════
// 码格式: {v:1, learned, phase, xp, streak, wrong} → JSON → Base64(UTF-8)。
// 只导出不导入(导入在小程序端做合并式恢复);只含非零进度。
function exportProgressCode(){
  const data = { v: 1 };
  if(Object.keys(learned).length) data.learned = learned;
  if(Object.keys(phase).length)   data.phase = phase;
  if(Object.keys(wrong).length)   data.wrong = wrong;
  if(xp) data.xp = xp;
  if(streak) data.streak = streak;
  // btoa+encodeURIComponent = 标准 Base64(UTF-8 字节),小程序端 code.js 逐字节兼容
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function showExportCode(){
  const code = exportProgressCode();
  document.getElementById('mContent').innerHTML =
    '<span class="be">📦</span><h3>进度导出码</h3>'
    +'<p style="font-size:12px;color:var(--mu);line-height:1.7;margin-bottom:10px">复制后在小程序「设置 → 导入进度码」粘贴,即可迁移全部学习进度(合并导入,不会覆盖新进度)。</p>'
    +'<textarea id="expCode" readonly style="width:100%;height:110px;box-sizing:border-box;font-size:11px;word-break:break-all;background:#F4F4F8;border:2px solid var(--br);border-radius:var(--rads);padding:10px;font-family:ui-monospace,Menlo,monospace;color:var(--tx)">'+code+'</textarea>'
    +'<button class="btn btn-p" style="margin-top:12px" onclick="copyExportCode()">📋 一键复制</button>'
    +'<button class="btn btn-o" style="margin-top:8px" onclick="renderProgModal()">← 返回进度</button>';
}
function copyExportCode(){
  const ta = document.getElementById('expCode');
  if(!ta) return;
  const done = () => toast('✅ 已复制,去小程序导入吧');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ ta.select(); document.execCommand('copy'); done(); });
  } else { ta.select(); document.execCommand('copy'); done(); } // 旧 Safari 兜底
}

// ══════════════════════════════════════════════
// MODAL CLOSE
// ══════════════════════════════════════════════
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('show');
});

// ══════════════════════════════════════════════
// 词卡滑动手势（左滑下一个，右滑上一个）
// ══════════════════════════════════════════════
(function(){
  let _tx=0, _ty=0;
  const el=document.getElementById('sc-card');
  el.addEventListener('touchstart',e=>{
    _tx=e.touches[0].clientX; _ty=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-_tx;
    const dy=e.changedTouches[0].clientY-_ty;
    // 横向位移 > 60px 且横向幅度明显大于纵向，才触发翻页
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0) nextCard(); else prevCard();
    }
  },{passive:true});
})();

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
updateTopbar();
renderHome();
</script>
