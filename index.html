<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TechWords · 科技英语闯关</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Primary — Indigo (tech-Duolingo) */
  --p:#4F46E5;--pd:#3730A3;--pl:#EEF2FF;
  /* Success — Duolingo Green */
  --g:#58CC02;--gd:#46A302;--gl:#D7FFB8;
  /* Error — Duolingo Red */
  --r:#FF4B4B;--rd:#EA2B2B;--rl:#FFEAEA;
  /* XP / Streak — Duolingo Orange */
  --y:#FF9600;--yd:#CC7700;--yl:#FEF3C7;
  /* Neutrals */
  --bg:#F7F7F7;--card:#FFFFFF;
  --tx:#3C3C3C;--mu:#777777;--br:#E5E5E5;--brd:#AFAFAF;
  /* Radius */
  --rad:16px;--rads:12px;--radp:99px;
  /* Hard bottom shadows — Duolingo signature */
  --sh:0 4px 0 0 #D5D5D5;
  --shl:0 6px 0 0 #C5C5C5;
  --shp:0 4px 0 0 var(--pd);
  --shg:0 4px 0 0 var(--gd);
  --shr:0 4px 0 0 var(--rd);
  --shy:0 4px 0 0 var(--yd);
}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden}

/* TOPBAR */
.topbar{background:var(--card);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--br);position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:900;color:var(--p);letter-spacing:-.5px}
.logo span{color:var(--y)}
.stats{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:var(--radp);padding:6px 13px;font-size:14px;font-weight:900;border:2px solid var(--br);box-shadow:var(--sh)}

/* SCREENS */
.screen{display:none;padding-bottom:90px;min-height:100vh}
.screen.active{display:block}

/* HOME */
.hero{background:var(--p);padding:28px 20px 36px;color:#fff;text-align:center;border-radius:0 0 24px 24px}
.hero h1{font-size:26px;font-weight:900;margin-bottom:6px}
.hero p{font-size:13px;opacity:.85;margin-bottom:20px;font-weight:700}
.xp-wrap{background:rgba(255,255,255,.25);border-radius:var(--radp);height:14px;margin:0 10px;overflow:hidden;border:2px solid rgba(255,255,255,.3)}
.xp-fill{height:100%;background:var(--y);border-radius:var(--radp);transition:width .6s ease}
.xp-lbl{font-size:12px;opacity:.85;margin-top:7px;font-weight:800}

.sec-title{font-size:12px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin:20px 20px 12px}
.level-card{background:var(--card);border-radius:var(--rad);padding:16px;margin:0 16px 14px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:14px;border:2px solid var(--br);transition:transform .1s,box-shadow .1s}
.level-card:active{transform:translateY(4px);box-shadow:none}
.level-card.locked{opacity:.45;cursor:not-allowed}
.level-card.done{border-color:var(--g);box-shadow:0 4px 0 0 var(--gd)}
.level-card.current{border-color:var(--p);box-shadow:var(--shp)}
.lv-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.lv-info{flex:1;min-width:0}
.lv-info h3{font-size:15px;font-weight:900;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-info .sub{font-size:11px;color:var(--mu);margin-bottom:7px;font-weight:800}
.lv-bar{background:var(--br);border-radius:var(--radp);height:10px;overflow:hidden;border:2px solid var(--brd)}
.lv-fill{height:100%;border-radius:var(--radp);transition:width .5s}
.lv-pct{font-size:10px;color:var(--mu);margin-top:4px;font-weight:800}
.lv-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* LEVEL DETAIL */
.lv-hdr{padding:20px;background:var(--card);border-bottom:2px solid var(--br)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--p);cursor:pointer;background:none;border:none;margin-bottom:14px;text-transform:uppercase;letter-spacing:.3px}
.lv-hdr h2{font-size:22px;font-weight:900;margin-bottom:3px}
.lv-hdr p{font-size:12px;color:var(--mu);font-weight:800}
.word-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wchip{background:var(--card);border-radius:var(--rads);padding:14px 10px;box-shadow:var(--sh);cursor:pointer;text-align:center;border:2px solid var(--br);transition:transform .1s,box-shadow .1s;position:relative}
.wchip:active{transform:translateY(4px);box-shadow:none}
.wchip.learned{border-color:var(--g);box-shadow:0 4px 0 0 var(--gd);background:var(--gl)}
.wchip .wt{font-size:13px;font-weight:900;margin-bottom:3px}
.wchip .wm{font-size:10px;color:var(--mu);font-weight:800}
.wchip .ck{position:absolute;top:6px;right:7px;font-size:11px}
.qbtn-wrap{padding:0 16px 16px}

/* BUTTONS */
.btn{width:100%;padding:17px;border-radius:var(--rads);border:2px solid transparent;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s,box-shadow .1s;letter-spacing:.3px;text-transform:uppercase}
.btn-p{background:var(--p);color:#fff;box-shadow:var(--shp);border-color:var(--pd)}
.btn-p:active{transform:translateY(4px);box-shadow:none}
.btn-g{background:var(--g);color:#fff;box-shadow:var(--shg);border-color:var(--gd)}
.btn-g:active{transform:translateY(4px);box-shadow:none}
.btn-d{background:var(--br);color:var(--mu);cursor:not-allowed;border-color:var(--brd)}
.btn-o{background:var(--card);color:var(--p);border-color:var(--p);box-shadow:var(--shp)}
.btn-o:active{transform:translateY(4px);box-shadow:none}
.btn-review{background:var(--y);color:#fff;border:2px solid var(--yd);box-shadow:var(--shy);width:100%;font-size:15px;font-weight:900;font-family:inherit;border-radius:var(--rads);padding:13px;cursor:pointer;letter-spacing:.3px}
.btn-review:active{transform:translateY(4px);box-shadow:none}
.review-badge{background:var(--y);color:#fff;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:6px}
.daily-wrap{padding:4px 16px 14px}
.daily-bar-bg{background:var(--br);border-radius:6px;height:8px;margin:6px 0 4px;overflow:hidden}
.daily-bar-fill{background:linear-gradient(90deg,var(--g),var(--gd));border-radius:6px;height:100%;transition:width .4s ease}
.daily-lbl{font-size:12px;font-weight:700;color:var(--mu)}

/* VOCAB CARD */
.card-nav{padding:14px 18px;display:flex;align-items:center;background:var(--card);border-bottom:2px solid var(--br);gap:10px}
.card-ctr{flex:1;text-align:center;font-size:13px;font-weight:800;color:var(--mu)}
.vocab-card{margin:14px 16px;border-radius:var(--rad);overflow:hidden;box-shadow:var(--shl);border:2px solid var(--br);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

/* Card header — colored */
.vc-head{padding:24px 20px 20px;text-align:center;position:relative}
.vc-emoji{font-size:52px;margin-bottom:12px;display:block}
.vc-term{font-size:38px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.vc-full{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:12px;line-height:1.4;font-weight:800}
.vc-pron{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:var(--radp);padding:6px 16px;border:2px solid rgba(255,255,255,.3)}
.vc-pron span{font-size:13px;font-weight:800;color:#fff}
.audio-btn{background:rgba(255,255,255,.25);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s;flex-shrink:0}
.audio-btn:active{transform:scale(.9)}
.audio-btn.speaking{animation:audioAnim .5s ease infinite alternate}
@keyframes audioAnim{from{transform:scale(1)}to{transform:scale(1.15)}}

/* Card header — image variant */
.vc-head-img{position:relative;height:180px;overflow:hidden}
.vc-head-img img{width:100%;height:100%;object-fit:cover;display:block}
.vc-head-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 55%)}
.vc-head-img .vc-img-overlay{position:absolute;bottom:0;left:0;right:0;padding:14px 18px 18px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.vc-head-img .vc-img-overlay .vc-term{color:#fff;font-size:32px;margin-bottom:0}
.vc-head-img .vc-img-overlay .vc-full{color:rgba(255,255,255,.85);font-size:12px;margin-bottom:0;text-align:left}
.vc-head-img .vc-pron-row{position:absolute;top:12px;left:16px;display:flex;align-items:center;gap:8px;z-index:1}
.vc-head-img .vc-pron-row .vc-pron{background:rgba(0,0,0,.5)}
.vc-head-img .vc-pron-row .audio-btn{background:rgba(0,0,0,.4)}

/* Card body */
.vc-body{background:var(--card)}
.vc-section{padding:16px 20px;border-bottom:2px solid var(--br)}
.vc-section:last-child{border-bottom:none}
.sec-lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin-bottom:8px}

/* Phonetic box (for colored header cards) */
.phonetic-box{background:var(--p);border-radius:var(--rads);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;border:2px solid var(--pd);box-shadow:var(--shp)}
.ph-icon{font-size:22px;flex-shrink:0}
.ph-text .ph-word{font-size:18px;font-weight:900;color:#fff;margin-bottom:3px}
.ph-text .ph-tip{font-size:12px;color:rgba(255,255,255,.85);line-height:1.5;font-weight:700}

/* Meaning hero block */
.vc-meaning{background:var(--p);border-radius:var(--rads);padding:16px 18px;margin:0 20px 0;border:2px solid var(--pd);box-shadow:var(--shp)}
.vc-meaning-lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.7);margin-bottom:6px}
.vc-meaning-txt{font-size:15px;font-weight:800;color:#fff;line-height:1.65}

/* Chinese work expression chips */
.zh-work-chips{display:flex;flex-wrap:wrap;gap:8px}
.zh-work-chip{background:var(--gl);color:#2d6a00;border:2px solid var(--g);border-radius:var(--radp);padding:7px 16px;font-size:14px;font-weight:900;box-shadow:var(--shg)}

/* Misconception warning */
.vc-misconception{background:var(--yl);border-radius:var(--rads);padding:14px 16px;border:2px solid var(--y);box-shadow:var(--shy)}
.vc-misconception-hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:var(--yd);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.vc-misconception-txt{font-size:13px;font-weight:700;color:var(--tx);line-height:1.7}

/* Collapsible toggles */
.vc-toggle{border:2px solid var(--br);border-radius:var(--rads);overflow:hidden;margin:0 20px 14px}
.vc-toggle summary{padding:13px 16px;font-size:13px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;background:var(--card);border-bottom:2px solid transparent;transition:background .15s}
.vc-toggle summary::-webkit-details-marker{display:none}
.vc-toggle[open] summary{border-bottom-color:var(--br);background:var(--bg)}
.vc-toggle-body{padding:14px 16px}
.story-box{background:var(--yl);border-radius:var(--rads);padding:14px 16px;border:2px solid #FFC107}
.story-txt{font-size:13px;line-height:1.8;color:var(--tx);font-weight:700}
.example-box{background:var(--gl);border-radius:var(--rads);padding:14px 16px;border:2px solid #8BC34A}
.ex-en{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.ex-en-txt{font-size:13px;font-weight:900;color:var(--tx);line-height:1.5;flex:1}
.ex-zh{font-size:12px;color:var(--mu);line-height:1.5;font-weight:700}
.related-chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{background:var(--pl);color:var(--p);border-radius:var(--radp);padding:6px 14px;font-size:12px;font-weight:900;cursor:pointer;border:2px solid var(--p);box-shadow:var(--shp);transition:transform .1s,box-shadow .1s}
.rchip:active{background:var(--p);color:#fff;transform:translateY(2px);box-shadow:none}
.phrases-chips{display:flex;flex-wrap:wrap;gap:8px}
.phrase-chip{background:var(--pl);color:var(--p);border-radius:var(--radp);padding:6px 14px;font-size:12px;font-weight:900;border:2px solid var(--p);box-shadow:var(--shp);cursor:pointer;transition:transform .1s,box-shadow .1s}
.phrase-chip:active{background:var(--p);color:#fff;transform:translateY(2px);box-shadow:none}
.card-actions{padding:14px 16px;display:flex;gap:10px}
.card-actions .btn{flex:1;padding:14px;font-size:13px}

/* QUIZ */
.quiz-hdr{padding:14px 18px;background:var(--card);border-bottom:2px solid var(--br)}
.qprog{background:var(--br);border-radius:var(--radp);height:14px;overflow:hidden;margin-bottom:8px;border:2px solid var(--brd)}
.qprog-fill{height:100%;background:var(--p);border-radius:var(--radp);transition:width .4s ease}
.qstats{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-weight:900}
.quiz-body{padding:18px}
.qtype-badge{display:inline-block;padding:5px 14px;border-radius:var(--radp);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;border:2px solid}
.qterm{background:var(--p);color:#fff;border-radius:var(--rads);padding:20px;text-align:center;font-size:26px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shp);border:2px solid var(--pd)}
.qterm .audio-btn{background:rgba(255,255,255,.25)}
.qquestion{font-size:17px;font-weight:900;margin-bottom:6px}
.qsub{font-size:13px;color:var(--mu);margin-bottom:18px;line-height:1.5;font-weight:800}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--br);border-radius:var(--rads);padding:15px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:800;transition:transform .1s,box-shadow .1s;box-shadow:var(--sh)}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.sel{border-color:var(--p);background:var(--pl);color:var(--p);box-shadow:var(--shp)}
.opt.ok{border-color:var(--g);background:var(--gl);color:#2d6a00;box-shadow:0 4px 0 0 var(--gd)}
.opt.err{border-color:var(--r);background:var(--rl);color:#b91c1c;box-shadow:0 4px 0 0 var(--rd)}
.opt-letter{width:30px;height:30px;border-radius:8px;background:var(--br);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;transition:all .1s}
.opt.sel .opt-letter{background:var(--p);color:#fff}
.opt.ok .opt-letter{background:var(--g);color:#fff}
.opt.err .opt-letter{background:var(--r);color:#fff}
.fb{margin:0 18px 16px;border-radius:var(--rads);padding:14px 16px;display:none;animation:slideIn .25s ease;border:2px solid}
.fb.show{display:block}
.fb.ok-fb{background:var(--gl);border-color:var(--g)}
.fb.err-fb{background:var(--rl);border-color:var(--r)}
.fb-t{font-size:15px;font-weight:900;margin-bottom:4px}
.fb.ok-fb .fb-t{color:#2d6a00}
.fb.err-fb .fb-t{color:#b91c1c}
.fb-b{font-size:12px;line-height:1.6;color:var(--tx);font-weight:700}
.chk-wrap{padding:0 18px 14px}

/* RESULT */
.result-wrap{padding:36px 22px;text-align:center}
.r-emoji{font-size:72px;display:block;animation:bounce .6s ease;margin-bottom:16px}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.r-title{font-size:26px;font-weight:900;margin-bottom:8px}
.r-sub{font-size:14px;color:var(--mu);margin-bottom:28px;line-height:1.6;font-weight:800}
.r-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.r-stat{background:var(--card);border-radius:var(--rads);padding:18px;box-shadow:var(--sh);border:2px solid var(--br)}
.r-stat .num{font-size:28px;font-weight:900;color:var(--p)}
.r-stat .lbl{font-size:11px;color:var(--mu);margin-top:3px;font-weight:900;text-transform:uppercase}
.xp-earned{background:var(--y);border-radius:var(--rads);padding:16px 18px;margin-bottom:24px;display:flex;align-items:center;gap:14px;box-shadow:var(--shy);border:2px solid var(--yd)}
.xp-earned .xi{font-size:32px}
.xp-earned .xn{font-size:22px;font-weight:900;color:#fff}
.xp-earned .xl{font-size:11px;color:rgba(255,255,255,.9);font-weight:900;text-transform:uppercase}

/* SEARCH */
.search-wrap{padding:18px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--br);border-radius:var(--rads);padding:13px 15px;margin-bottom:14px;transition:border-color .2s,box-shadow .2s;box-shadow:var(--sh)}
.sbox:focus-within{border-color:var(--p);box-shadow:var(--shp)}
.sbox input{flex:1;border:none;outline:none;font-size:16px;color:var(--tx);background:transparent;font-family:inherit;font-weight:800}
.sbox input::placeholder{color:var(--mu);font-weight:700}
.hot-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.htag{background:var(--card);color:var(--p);border-radius:var(--radp);padding:6px 14px;font-size:12px;font-weight:900;cursor:pointer;border:2px solid var(--p);box-shadow:var(--shp);transition:transform .1s,box-shadow .1s}
.htag:active{background:var(--p);color:#fff;transform:translateY(2px);box-shadow:none}
.sr-card{background:var(--card);border-radius:var(--rads);padding:14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;border:2px solid var(--br);transition:transform .1s,box-shadow .1s}
.sr-card:active{transform:translateY(4px);box-shadow:none}
.sr-term{font-size:18px;font-weight:900;color:var(--p)}
.sr-zh{font-size:14px;font-weight:900;margin-top:2px}
.sr-def{font-size:11px;color:var(--mu);margin-top:3px;line-height:1.5;font-weight:700}
.sr-lv{font-size:10px;color:var(--mu);margin-top:5px;font-weight:900;text-transform:uppercase}
.s-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.s-empty .ei{font-size:52px;margin-bottom:12px}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:2px solid var(--br);display:flex;padding:8px 0 4px;z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;transition:all .1s}
.ni .nicon{font-size:22px}
.ni .nlbl{font-size:10px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
.ni.active .nlbl{color:var(--p)}
.ni.active .nicon{transform:scale(1.15)}

/* TOAST */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--tx);color:#fff;padding:10px 22px;border-radius:var(--radp);font-size:13px;font-weight:900;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFETTI */
.conf{position:fixed;top:-10px;border-radius:3px;animation:confFall linear forwards;z-index:9999;pointer-events:none}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:22px}
.modal-ov.show{display:flex}
.modal{background:var(--card);border-radius:var(--rad);padding:28px 22px;text-align:center;width:100%;max-width:340px;animation:mpop .3s cubic-bezier(.34,1.56,.64,1);border:2px solid var(--br);box-shadow:var(--shl)}
@keyframes mpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal .be{font-size:60px;margin-bottom:10px;display:block}
.modal h3{font-size:22px;font-weight:900;margin-bottom:7px}
.modal p{font-size:13px;color:var(--mu);margin-bottom:22px;line-height:1.6;font-weight:700}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Tech<span>Words</span></div>
  <div class="stats">

// STATE
// ══════════════════════════════════════════════
const S  = k => localStorage.getItem('tw_'+k);
const SS = (k,v) => localStorage.setItem('tw_'+k,v);
let learned = JSON.parse(S('learned')||'{}');
let xp      = parseInt(S('xp')||'0');
let streak  = parseInt(S('streak')||'0');
let curLv   = null;
let curIdx  = 0;

const DAY = 86400000;
const DAILY_GOAL = 3; // 每日完成 3 词维持连签
let isReviewMode = false; // 复习模式标记
let qWordKeys = []; // 配合 qWords 存储每道题的 learned key

// 初始化今日已学词数（每天重置）
let todayLearned = (() => {
  const today = new Date().toDateString();
  if(S('tw_todayDate') !== today){ SS('tw_todayDate', today); SS('tw_todayLearned','0'); return 0; }
  return parseInt(S('tw_todayLearned')||'0');
})();

function todayStr(){ return new Date().toDateString(); }

// 每完成 n 词就累加今日进度，达到目标后更新 Streak
function addTodayLearned(n){
  const today = todayStr();
  if(S('tw_todayDate') !== today){ todayLearned=0; SS('tw_todayDate',today); }
  todayLearned = Math.min(todayLearned + n, DAILY_GOAL * 4); // 上限不影响体验
  SS('tw_todayLearned', todayLearned);
  if(todayLearned >= DAILY_GOAL){
    const last = S('lastStudied');
    if(last !== today){
      const yesterday = new Date(Date.now()-DAY).toDateString();
      streak = (last === yesterday) ? streak+1 : 1;
      SS('streak', streak); SS('lastStudied', today);
      updateTopbar();
      if(streak > 1) toast('🔥 连签 '+streak+' 天，继续加油！');
    }
  }
  updateDailyProgress();
}

// 更新首页今日进度条
function updateDailyProgress(){
  const el = document.getElementById('dailyProgress');
  if(!el) return;
  const g = Math.min(todayLearned, DAILY_GOAL);
  const done = g >= DAILY_GOAL;
  el.innerHTML = '<div class="daily-wrap">'
    +'<div class="daily-bar-bg"><div class="daily-bar-fill" style="width:'+(g/DAILY_GOAL*100)+'%"></div></div>'
    +'<div class="daily-lbl">今日目标 '+g+'/'+DAILY_GOAL+' 词 '+(done?'🔥 已完成，Streak 保住了！':'🎯 再学 '+(DAILY_GOAL-g)+' 词维持连签')+'</div>'
    +'</div>';
}
function getReviewQueue(){
  const now = Date.now(), queue = [];
  LEVELS.forEach(lv => lv.words.forEach(w => {
    const t = learned[lv.id+'_'+w.id];
    if(t && typeof t === 'number' && (now - t > 3*DAY)) queue.push({lv, w});
  }));
  return queue.slice(0, 10);
}

// AUDIO
// ══════════════════════════════════════════════
function speak(txt, rate){
  if(!window.speechSynthesis) return;
  rate = rate||0.88;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='en-US'; u.rate=rate;
  speechSynthesis.speak(u);
}

// TOAST
// ══════════════════════════════════════════════
function toast(msg, dur){
  dur = dur||2000;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), dur);
}

// CONFETTI
// ══════════════════════════════════════════════
function confetti(){
  const cols=['#4F46E5','#58CC02','#FF4B4B','#FF9600','#EC4899'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');
    el.className='conf';
    const sz=6+Math.random()*7;
    el.style.cssText=[
      'left:'+Math.random()*100+'vw',
      'width:'+sz+'px',
      'height:'+sz+'px',
      'background:'+cols[i%5],
      'animation-duration:'+(1.2+Math.random()*1.6)+'s',
      'animation-delay:'+Math.random()*0.5+'s'
    ].join(';');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3500);
  }
}

function renderHome(){
  updateTopbar();
  updateDailyProgress();
  const reviewQ = getReviewQueue();
  const rs = document.getElementById('reviewSection');
  if(reviewQ.length > 0){
    rs.innerHTML = '<div class="sec-title">🔄 今日复习 <span class="review-badge">'+reviewQ.length+' 词到期</span></div>'
      +'<div style="display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch">'
      +reviewQ.map(({lv,w})=>
        '<div onclick="openCard('+lv.id+',\''+w.id+'\')" style="flex-shrink:0;background:#fff;border-radius:14px;padding:12px 14px;min-width:90px;text-align:center;border:1.5px solid var(--br);box-shadow:var(--sh);cursor:pointer">'
        +'<div style="font-size:22px;margin-bottom:5px">'+w.emoji+'</div>'
        +'<div style="font-size:12px;font-weight:800;color:var(--tx)">'+w.title+'</div>'
        +'<div style="font-size:10px;color:var(--mu);margin-top:2px">'+w.term+'</div>'
        +'</div>'
      ).join('')+'</div>'
      +'<div style="padding:0 16px 16px">'
        +'<button class="btn-review" onclick="startReviewQuiz()">🔄 开始复习测验（'+reviewQ.length+' 词）</button>'
      +'</div>';
  } else { rs.innerHTML = ''; }
  const total = LEVELS.reduce((a,l)=>a+l.words.length,0);
  const done  = Object.keys(learned).length;
  const pct   = Math.round(done/total*100);
  document.getElementById('heroBar').style.width = pct+'%';
  document.getElementById('heroLbl').textContent = '已掌握 '+done+' / '+total+' 词 · '+xp+' XP';

  const list = document.getElementById('lvList');
  list.innerHTML = LEVELS.map((lv,i)=>{
    const lvDone = lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
    const lvPct  = Math.round(lvDone/lv.words.length*100);
    const prevLv = LEVELS[i-1];
    const unlocked = i===0||(prevLv&&prevLv.words.filter(w=>learned[prevLv.id+'_'+w.id]).length===prevLv.words.length);
    const allDone  = lvDone===lv.words.length;
    const cls   = !unlocked?'locked':allDone?'done':lvDone>0?'current':'';
    const badge = !unlocked?'🔒':allDone?'✅':'▶';
    const click = unlocked?'openLevel('+lv.id+')':'';
    return '<div class="level-card '+cls+'" onclick="'+click+'">'
      +'<div class="lv-ico" style="background:'+lv.bg+'">'+lv.emoji+'</div>'
      +'<div class="lv-info">'
        +'<h3>Lv.'+(i+1)+' · '+lv.title+'</h3>'
        +'<div class="sub">'+lv.sub+' · '+lv.words.length+'词</div>'
        +'<div class="lv-bar"><div class="lv-fill" style="width:'+lvPct+'%;background:'+lv.color+'"></div></div>'
        +'<div class="lv-pct">'+lvDone+'/'+lv.words.length+' 已掌握</div>'
      +'</div>'
      +'<div class="lv-badge" style="background:'+lv.bg+';color:'+lv.color+'">'+badge+'</div>'
    +'</div>';
  }).join('');
}

function openLevel(id){
  curLv = LEVELS.find(l=>l.id===id);
  showScreen('level');
  document.getElementById('n-home').classList.add('active');
  const lv=curLv;
  document.getElementById('lvTitle').textContent = lv.emoji+' '+lv.title;
  document.getElementById('lvSub').textContent   = lv.sub+' · '+lv.words.length+' 词';

  const lvDone = lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
  document.getElementById('wordGrid').innerHTML = lv.words.map(w=>{
    const ok = !!learned[lv.id+'_'+w.id];
    const shortMeaning = w.meaning.length>18 ? w.meaning.slice(0,18)+'…' : w.meaning;
    return '<div class="wchip '+(ok?'learned':'')+'" onclick="openCard('+lv.id+',\''+w.id+'\')">'
      +'<span class="ck">'+(ok?'✅':'')+'</span>'
      +'<div class="wt">'+w.emoji+' '+w.title+'</div>'
      +'<div class="wm">'+shortMeaning+'</div>'
    +'</div>';
  }).join('');

  const btn = document.getElementById('quizBtn');
  if(lvDone>=5){
    btn.className='btn btn-p'; btn.textContent='🎯 开始测验'; btn.disabled=false;
  } else {
    btn.className='btn btn-d'; btn.textContent='先学 '+(5-lvDone)+' 个词再测验'; btn.disabled=true;
  }
}

function _esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function _dk(hex,amt){
  try{
    const n=parseInt(hex.slice(1),16);
    return 'rgb('+Math.max(0,((n>>16)&255)-amt)+','+Math.max(0,((n>>8)&255)-amt)+','+Math.max(0,(n&255)-amt)+')';
  }catch(e){return hex;}
}

function copyPhrase(el){
  if(navigator.clipboard) navigator.clipboard.writeText(el.textContent);
  toast('已复制：'+el.textContent);
}

function renderCard(){
  const lv=curLv, w=lv.words[curIdx];
  const isLearned=!!learned[lv.id+'_'+w.id];
  document.getElementById('cardCtr').textContent = (curIdx+1)+' / '+lv.words.length;
  document.getElementById('prevBtn').style.opacity = curIdx===0?'0.35':'1';
  document.getElementById('nextBtn').textContent   = curIdx===lv.words.length-1?'完成 ✓':'下一个 →';

  // Build header — image or colored
  let headerHtml;
  if(w.img){
    headerHtml =
      '<div class="vc-head-img">'
        +'<img src="'+w.img+'" alt="'+w.title+'" onerror="this.parentElement.style.background=\''+lv.color+'\'">'
        +'<div class="vc-pron-row">'
          +'<div class="vc-pron"><button class="audio-btn" onclick="speak(\''+_esc(w.title)+'\')">🔊</button><span>'+w.pron+'</span></div>'
        +'</div>'
        +'<div class="vc-img-overlay">'
          +'<div>'
            +'<div class="vc-term">'+w.title+'</div>'
            +'<div class="vc-full">'+w.term+'</div>'
          +'</div>'
          +(w.ph?'<div style="background:rgba(0,0,0,.5);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800;color:rgba(255,255,255,.9);flex-shrink:0">'+w.ph+'</div>':'')
        +'</div>'
      +'</div>';
  } else {
    headerHtml =
      '<div class="vc-head" style="background:linear-gradient(135deg,'+lv.color+','+_dk(lv.color,45)+')">'
        +'<span class="vc-emoji">'+w.emoji+'</span>'
        +'<div class="vc-term">'+w.title+'</div>'
        +'<div class="vc-full">'+w.term+'</div>'
        +'<div class="vc-pron"><button class="audio-btn" onclick="speak(\''+_esc(w.title)+'\')">🔊</button><span>'+w.pron+'</span></div>'
      +'</div>';
  }

  // Phonetic section (for non-image cards)
  const phoneticSec = w.ph && !w.img ?
    '<div class="vc-section"><div class="sec-lbl">🗣 谐音记忆</div>'
      +'<div class="phonetic-box"><div class="ph-icon">💡</div><div class="ph-text">'
        +'<div class="ph-word">'+w.ph+'</div>'
      +'</div></div></div>' : '';

  // Meaning hero
  const meaningSec =
    '<div class="vc-section">'
      +'<div class="vc-meaning">'
        +'<div class="vc-meaning-lbl">核心含义</div>'
        +'<div class="vc-meaning-txt">'+w.meaning+'</div>'
      +'</div>'
    +'</div>';

  // Origin
  const originSec = w.origin ?
    '<div class="vc-section"><div class="sec-lbl">📐 词源拆解</div>'
      +'<div style="font-size:13px;font-weight:700;color:var(--tx);line-height:1.7">'+w.origin+'</div>'
    +'</div>' : '';

  // Chinese work expression
  const zhExprChips = w.zhExpr ? w.zhExpr.split(' / ').map(e=>
    '<span class="zh-work-chip">'+e+'</span>'
  ).join('') : '';
  const zhExprSec = zhExprChips ?
    '<div class="vc-section"><div class="sec-lbl">💼 中文怎么说</div>'
      +'<div class="zh-work-chips">'+zhExprChips+'</div>'
    +'</div>' : '';

  // Common phrases
  const phraseChips = w.phrases ? w.phrases.split(' / ').map(p=>
    '<span class="phrase-chip" onclick="copyPhrase(this)">'+p+'</span>'
  ).join('') : '';
  const phrasesSec = phraseChips ?
    '<div class="vc-section"><div class="sec-lbl">💬 常见搭配 <span style="font-size:9px;color:var(--mu);font-weight:700;text-transform:none">点击复制</span></div>'
      +'<div class="phrases-chips">'+phraseChips+'</div>'
    +'</div>' : '';

  // Example
  const exampleSec =
    '<div class="vc-section"><div class="sec-lbl">🌏 例句</div>'
      +'<div class="example-box">'
        +'<div class="ex-en"><div class="ex-en-txt">'+w.ex+'</div>'
          +'<button class="audio-btn" style="background:rgba(0,0,0,.08);flex-shrink:0" onclick="speak(\''+_esc(w.ex)+'\',0.8)">🔊</button>'
        +'</div><div class="ex-zh">'+w.exZh+'</div>'
      +'</div></div>';

  // Memory toggle (visual + story)
  const memoryToggle = (w.visual || w.story) ?
    '<div class="vc-toggle"><details>'
      +'<summary>💡 记忆技巧</summary>'
      +'<div class="vc-toggle-body">'
        +(w.visual ? '<div style="font-size:13px;font-weight:700;color:var(--mu);margin-bottom:10px;font-style:italic">'+w.visual+'</div>' : '')
        +(w.story ? '<div class="story-box"><div class="story-txt">'+w.story+'</div></div>' : '')
      +'</div>'
    +'</details></div>' : '';

  // Misconception toggle
  const misconceptionToggle = w.misconception ?
    '<div class="vc-toggle"><details>'
      +'<summary>⚠️ 别搞混</summary>'
      +'<div class="vc-toggle-body">'
        +'<div class="vc-misconception">'
          +'<div class="vc-misconception-hd">⚠️ 别搞混</div>'
          +'<div class="vc-misconception-txt">'+w.misconception+'</div>'
        +'</div>'
      +'</div>'
    +'</details></div>' : '';

  // Related chips
  const relSec = w.rel && w.rel.length ?
    '<div class="vc-section"><div class="sec-lbl">🔗 相关词</div>'
      +'<div class="related-chips">'+w.rel.map(r=>'<span class="rchip" onclick="searchWord(\''+_esc(r)+'\')">'+r+'</span>').join('')+'</div>'
    +'</div>' : '';

  document.getElementById('cardContent').innerHTML =
    '<div class="vocab-card">'
      +headerHtml
      +'<div class="vc-body">'
        +phoneticSec
        +meaningSec
        +originSec
        +zhExprSec
        +phrasesSec
        +exampleSec
        +relSec
      +'</div>'
      +memoryToggle
      +misconceptionToggle
      +'<div style="padding:0 16px 16px">'
        +'<button class="btn '+(isLearned?'btn-g':'btn-p')+'" onclick="markLearned()">'+(isLearned?'✅ 已掌握':'👍 标记已掌握')+'</button>'
      +'</div>'
    +'</div>';

  setTimeout(()=>speak(w.title), 400);
}

function prevCard(){
  if(curIdx>0){curIdx--;renderCard();}
}
function nextCard(){
  if(curIdx<curLv.words.length-1){curIdx++;renderCard();}
  else{toast('🎉 本关词汇全部浏览完毕！');openLevel(curLv.id);}
}
function markLearned(){
  const w=curLv.words[curIdx], key=curLv.id+'_'+w.id;
  if(!learned[key]){
    learned[key]=Date.now(); SS('learned',JSON.stringify(learned));
    xp+=10; SS('xp',xp); updateTopbar();
    addTodayLearned(1);
    toast('🎉 +10 XP · 已掌握！'); confetti();
  } else { toast('已经掌握了 ✅'); }
  renderCard();
}

// ══════════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════════
let qWords=[],qIdx=0,qScore=0,qErrN=0,qAnswered=false,qOpts=[];

function startQuiz(){
  if(!curLv) return;
  isReviewMode = false;
  const pool=[...curLv.words].sort(()=>Math.random()-.5);
  qWords=pool.slice(0,Math.min(10,pool.length));
  qWordKeys=qWords.map(w=>curLv.id+'_'+w.id);
  qIdx=0;qScore=0;qErrN=0;qAnswered=false;
  showScreen('quiz');
  document.getElementById('n-home').classList.add('active');
  renderQuiz();
}

function startReviewQuiz(){
  const queue = getReviewQueue();
  if(!queue.length){ toast('暂无到期词汇，再学一些词汇吧！'); return; }
  isReviewMode = true;
  curLv = null;
  const pool = [...queue].sort(()=>Math.random()-.5).slice(0,10);
  qWords = pool.map(({w})=>w);
  qWordKeys = pool.map(({lv,w})=>lv.id+'_'+w.id);
  qIdx=0;qScore=0;qErrN=0;qAnswered=false;
  showScreen('quiz');
  document.getElementById('n-home').classList.add('active');
  renderQuiz();
}

function renderQuiz(){
  const w=qWords[qIdx], total=qWords.length;
  document.getElementById('qBar').style.width  = (qIdx/total*100)+'%';
  document.getElementById('qNum').textContent  = (qIdx+1)+'/'+total;
  document.getElementById('qOk').textContent   = qScore;
  document.getElementById('qErr').textContent  = qErrN;
  document.getElementById('fb').className      = 'fb';
  document.getElementById('chkBtn').style.display='none';
  document.getElementById('nxtBtn').style.display='none';
  qAnswered=false;

  // 从全关卡取干扰项
  const allWords = LEVELS.flatMap(lv=>lv.words);
  const pool2 = allWords.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
  qOpts=[w,...pool2].sort(()=>Math.random()-.5);
  const letters=['A','B','C','D'];
  const shortM = m => m.length>28 ? m.slice(0,28)+'…' : m;
  const shortT = t => t.length>22 ? t.slice(0,22)+'…' : t;

  // 判断题型：复习模式 or 已学词 → 主动回忆（看中文选英文）；否则 → 认知识别
  const useActiveRecall = isReviewMode || !!learned[qWordKeys[qIdx]];

  if(useActiveRecall){
    // ✍️ 反向测验：展示中文含义，选英文词
    document.getElementById('qBody').innerHTML =
      '<div class="qtype-badge" style="background:var(--yl);color:#92400e">✍️ 反向测验</div>'
      +'<div class="qterm" style="font-size:15px;line-height:1.6;color:var(--tx)">'+w.meaning+'</div>'
      +'<div class="qquestion">这个词的英文是？</div>'
      +'<div class="qsub" style="margin-bottom:4px">提示：'+w.pron+'</div>'
      +'<div class="opts" id="opts">'
        +qOpts.map((o,i)=>'<div class="opt" id="opt'+i+'" onclick="selectOpt('+i+')">'
          +'<div class="opt-letter">'+letters[i]+'</div>'
          +'<div style="display:flex;flex-direction:column;gap:1px;min-width:0">'
            +'<span style="font-weight:900;font-size:15px;letter-spacing:.3px">'+o.emoji+' '+o.title+'</span>'
            +'<span style="font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+shortT(o.term)+'</span>'
          +'</div></div>').join('')
      +'</div>';
  } else {
    // 📖 认知识别：展示英文词，选中文含义（原有逻辑）
    document.getElementById('qBody').innerHTML =
      '<div class="qtype-badge" style="background:var(--pl);color:var(--p)">📖 选择含义</div>'
      +'<div class="qterm">'+w.emoji+' '+w.title
        +'<button class="audio-btn" onclick="speak(\''+_esc(w.title)+'\')">🔊</button></div>'
      +'<div class="qquestion">这个词的中文含义是？</div>'
      +'<div class="qsub">'+w.pron+'</div>'
      +'<div class="opts" id="opts">'
        +qOpts.map((o,i)=>'<div class="opt" id="opt'+i+'" onclick="selectOpt('+i+')">'
          +'<div class="opt-letter">'+letters[i]+'</div><span>'+shortM(o.meaning)+'</span></div>').join('')
      +'</div>';
  }
}

function selectOpt(i){
  if(qAnswered) return;
  qAnswered=true;
  const w=qWords[qIdx], correct=qOpts[i].id===w.id;
  qOpts.forEach((o,j)=>{
    const el=document.getElementById('opt'+j);
    el.style.pointerEvents='none';
    if(o.id===w.id) el.classList.add('ok');
    else if(j===i&&!correct) el.classList.add('err');
  });
  const fb=document.getElementById('fb');
  if(correct){
    qScore++;xp+=5;SS('xp',xp);updateTopbar();
    fb.className='fb ok-fb show';
    fb.innerHTML='<div class="fb-t">✅ 正确！+5 XP</div><div class="fb-b">'+w.meaning+'</div>';
  } else {
    qErrN++;
    fb.className='fb err-fb show';
    fb.innerHTML='<div class="fb-t">❌ 正确答案：'+w.title+'</div><div class="fb-b">'+w.meaning+'</div>';
  }
  document.getElementById('qOk').textContent=qScore;
  document.getElementById('qErr').textContent=qErrN;
  document.getElementById('nxtBtn').style.display='block';
}

function nextQ(){
  qIdx++;
  if(qIdx>=qWords.length) finishQuiz();
  else renderQuiz();
}

function finishQuiz(){
  showScreen('result');
  const pct=Math.round(qScore/qWords.length*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  const msg=pct>=90?'完美！你是词汇高手！':pct>=70?'太棒了，继续保持！':pct>=50?'不错，再练练更好！':'多练练，加油！';
  if(pct>=70){
    if(isReviewMode){
      // 复习完成：重置时间戳，3 天后再次出现
      qWordKeys.forEach(key=>{ if(learned[key]) learned[key]=Date.now(); });
    } else {
      // 普通测验：新词标记为已学
      qWordKeys.forEach((key,i)=>{
        if(!learned[key]){ learned[key]=Date.now(); xp+=5; }
      });
      SS('xp',xp);
    }
    SS('learned',JSON.stringify(learned));
    addTodayLearned(qScore); // 答对数计入今日进度
    updateTopbar();
  }
  const subTitle = isReviewMode ? '🔄 完成今日复习测验' : '完成「'+(curLv?curLv.title:'')+'」测验';
  document.getElementById('resultWrap').innerHTML =
    '<span class="r-emoji">'+emoji+'</span>'
    +'<div class="r-title">'+msg+'</div>'
    +'<div class="r-sub">'+subTitle+'</div>'
    +'<div class="r-stats">'
      +'<div class="r-stat"><div class="num">'+qScore+'/'+qWords.length+'</div><div class="lbl">答对题数</div></div>'
      +'<div class="r-stat"><div class="num" style="color:'+(pct>=70?'var(--g)':'var(--r)')+'">'+pct+'%</div><div class="lbl">正确率</div></div>'
    +'</div>'
    +'<div class="xp-earned"><div class="xi">⚡</div><div><div class="xn">'+xp+' XP</div><div class="xl">累计经验值</div></div></div>'
    +(isReviewMode
      ? '<button class="btn btn-g" onclick="goHome()" style="margin-bottom:12px">🏠 返回主页</button>'
      : '<button class="btn btn-p" onclick="startQuiz()" style="margin-bottom:12px">🔄 再来一次</button>'
       +'<button class="btn btn-o" onclick="openLevel('+(curLv?curLv.id:0)+')">← 返回关卡</button>');
  if(pct>=80) setTimeout(confetti,200);
}

// ══════════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════════
let _sT;
function initSearch(){
  document.getElementById('sinput').value='';
  document.getElementById('sResults').innerHTML='<div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div>';
  const hot=['AI','Token','API','Agent','LLM','Prompt','UX','MVP','RAG','MCP'];
  document.getElementById('hotTags').innerHTML=hot.map(t=>'<span class="htag" onclick="searchWord(\''+t+'\')">'+t+'</span>').join('');
}

function doSearch(q){
  clearTimeout(_sT);
  _sT=setTimeout(()=>{
    if(!q.trim()){document.getElementById('sResults').innerHTML='<div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div>';return;}
    const ql=q.toLowerCase(),res=[];
    LEVELS.forEach(lv=>lv.words.forEach(w=>{
      if(w.title.toLowerCase().includes(ql)||w.term.toLowerCase().includes(ql)||
         w.meaning.includes(q)||w.ph.includes(q)||w.id.includes(ql)||
         (w.zhExpr&&w.zhExpr.includes(q)))
        res.push({lv,w});
    }));
    document.getElementById('sResults').innerHTML=res.length
      ? res.map(({lv,w})=>'<div class="sr-card" onclick="openCard('+lv.id+',\''+w.id+'\')">'
          +'<div class="sr-term">'+w.emoji+' '+w.title+'</div>'
          +'<div class="sr-zh">'+w.term+'</div>'
          +'<div class="sr-def">'+w.meaning.slice(0,50)+'…</div>'
          +'<div class="sr-lv" style="color:'+lv.color+'">'+lv.emoji+' '+lv.title+'</div>'
        +'</div>').join('')
      : '<div class="s-empty"><div class="ei">😕</div><p>没找到相关词汇</p></div>';
  },300);
}

function searchWord(term){
  goSearch();
  document.getElementById('sinput').value=term;
  doSearch(term);
}

// ══════════════════════════════════════════════
// PROGRESS (modal)
// ══════════════════════════════════════════════
function renderProgModal(){
  const total=LEVELS.reduce((a,l)=>a+l.words.length,0);
  const done=Object.keys(learned).length;
  document.getElementById('mContent').innerHTML =
    '<span class="be">📊</span><h3>我的进度</h3>'
    +'<p style="font-size:15px;font-weight:800;color:var(--p)">'+xp+' XP · '+done+'/'+total+' 词</p>'
    +LEVELS.map(lv=>{
      const lvD=lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
      const pct=Math.round(lvD/lv.words.length*100);
      return '<div style="text-align:left;margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px">'
          +'<span>'+lv.emoji+' '+lv.title+'</span><span style="color:'+lv.color+'">'+pct+'%</span></div>'
        +'<div style="background:var(--br);border-radius:6px;height:7px;overflow:hidden">'
          +'<div style="height:100%;width:'+pct+'%;background:'+lv.color+';border-radius:6px;transition:width .5s"></div></div>'
        +'<div style="font-size:11px;color:var(--mu);margin-top:3px">'+lvD+'/'+lv.words.length+' 词</div>'
      +'</div>';
    }).join('')
    +'<button class="btn btn-p" style="margin-top:8px" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">关闭</button>';
  document.getElementById('modal').classList.add('show');
}

// ══════════════════════════════════════════════
// MODAL CLOSE
// ══════════════════════════════════════════════
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('show');
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
updateTopbar();
renderHome();
</script>
