{id:'semsearch',term:'Semantic Search',full:'语义搜索',pron:'/sɪˈmæntɪk sɜːrtʃ/',emoji:'🔍',ph:'西-满-提克 搜-奇',phTip:'搜"意思"，不只搜"字面"',zh:'语义搜索',def:'基于语义相似度而非关键词匹配来检索相关内容的搜索技术，能理解查询的真实意图',story:'🔎 传统搜索："苹果手机" → 只返回含"苹果手机"字样的结果。语义搜索："苹果手机" → 还能返回"iPhone"、"Apple设备"、"乔布斯发布的手机"——因为它理解"意思"而非"字符"。RAG系统的核心组件，让AI能找到真正相关的内容而非字面匹配的内容。',ex:'Semantic search finds relevant documents even when users use different words than the author.',exZh:'语义搜索即使用户用词与作者不同，也能找到相关文档。',rel:['Embedding','Vector Database','RAG','NLP']},
{id:'diffusion',term:'Diffusion Model',full:'扩散模型',pron:'/dɪˈfjuːʒən ˈmɒdəl/',emoji:'🎨',ph:'滴-佛-日-恩 莫-抖',phTip:'从"噪声"中逐步"去噪"生成图像的AI',zh:'扩散模型',def:'通过学习从噪声逐步去噪的过程来生成高质量图像、音频或视频的生成式AI模型',story:'📸 想象往白纸上泼墨水，画面变成噪点（加噪过程）。扩散模型反过来：学会从噪点一步步"擦"出清晰图像（去噪过程）。Stable Diffusion、Midjourney、DALL-E都是扩散模型。你输入"油画风格的猫在宇宙中漫步"，AI从随机噪声开始，逐步生成这张图。',ex:'Diffusion models can generate photorealistic images from just a text description.',exZh:'扩散模型仅凭文字描述就能生成照片级真实图像。',rel:['Generative AI','Image Generation','Stable Diffusion','Latent Space']},
{id:'latent',term:'Latent Space',full:'潜空间',pron:'/ˈleɪtənt speɪs/',emoji:'🌌',ph:'勒-腾特 斯-佩斯',phTip:'AI世界里"概念"存在的高维空间',zh:'潜空间',def:'AI模型内部用于表示数据压缩特征的高维向量空间，相似概念在其中距离更近',story:'🗺️ 现实世界的"猫"有无数像素；潜空间里，"猫"是一个坐标点，旁边是"虎"、"豹"、"狗"。扩散模型在潜空间里操作：图像先压缩成潜空间坐标，在里面加噪/去噪，最后再展开成真实图像。这就是为什么Stable Diffusion能做到"把猫变成虎"——在潜空间里微调坐标。',ex:'Image editing in latent space allows smooth transitions between different visual concepts.',exZh:'在潜空间中进行图像编辑可以实现不同视觉概念之间的平滑过渡。',rel:['Diffusion Model','Embedding','VAE','Representation']},
{id:'moe',term:'Mixture of Experts',full:'专家混合',pron:'/ˈmɪkstʃər əv ˈɛkspɜːrts/',emoji:'🧑‍🤝‍🧑',ph:'迷克斯-切 额夫 艾克-斯-铂茨',phTip:'不是一个全能AI，而是很多"专科AI"按需调用',zh:'MoE（专家混合）',def:'将神经网络分为多个专门化的"专家"子网络，每次推理只激活部分专家，大幅提升效率',story:'🏥 综合医院里有各科室专家——你咳嗽找呼吸科，骨折找骨科，不会让每个医生都参与你的诊断。MoE同理：把大模型拆成很多"专家子网络"，每次推理路由器决定激活哪几个专家。GPT-4据传就是MoE架构——有8个专家，每次激活2个。参数量大但计算量不大。',ex:'GPT-4\'s MoE architecture activates only a subset of its parameters for each token.',exZh:'GPT-4的MoE架构对每个token只激活其部分参数。',rel:['Efficiency','Architecture','Routing','Scale']},
{id:'lora',term:'LoRA',full:'低秩适应',pron:'/ˈloʊrə/',emoji:'🪡',ph:'洛-拉',phTip:'"Low-Rank Adaptation"，穷人也能微调大模型的技术',zh:'LoRA（低秩适应）',def:'一种参数高效的微调方法，通过在模型权重旁插入低秩矩阵来实现微调，大幅减少训练参数量',story:'💡 微调GPT-4需要调整1万亿个参数，普通团队负担不起。LoRA是妙招：不动原始权重，只在旁边插入两个"小矩阵"（低秩），训练这两个小矩阵来学习新知识——参数量从千亿降到几百万。Stable Diffusion的各种风格化模型（anime风、写实风）大多是LoRA做的。',ex:'LoRA lets hobbyists fine-tune image models on a single GPU in hours, not weeks.',exZh:'LoRA让爱好者能在单块GPU上几小时内完成图像模型微调，而非几周。',rel:['Fine-tuning','Parameter Efficient','Adapter','PEFT']},
{id:'quant',term:'Quantization',full:'量化',pron:'/ˌkwɒntɪˈzeɪʃən/',emoji:'🗜️',ph:'昆-提-泽-讯',phTip:'把AI模型"压缩"，体积更小、速度更快',zh:'量化',def:'将神经网络权重从高精度（如32位浮点数）转换为低精度格式（如8位、4位整数），减小模型体积和加速推理',story:'📷 RAW格式照片清晰但很大，JPG稍有损但体积小10倍。Quantization是AI版本的JPG：把权重从32位压缩到8位甚至4位，模型体积缩小4-8倍，速度提升，精度损失很小。这让原本只能在数据中心跑的大模型，能在你的Mac或手机上本地运行。',ex:'4-bit quantization reduced the 7B model size from 14GB to 4GB with minimal quality loss.',exZh:'4位量化将7B模型大小从14GB降到4GB，质量损失极小。',rel:['Efficiency','Model Compression','LoRA','Edge Computing']},
{id:'cai',term:'Constitutional AI',full:'宪法AI',pron:'/ˌkɒnstɪˈtjuːʃənəl eɪ aɪ/',emoji:'📜',ph:'肯斯-提-图-讯 诶爱',phTip:'Anthropic的AI对齐技术：用"宪法"约束AI行为',zh:'Constitutional AI',def:'Anthropic提出的AI训练方法，通过明确的原则（"宪法"）来引导AI的自我评估和改进，使其更安全有益',story:'📋 普通RLHF：让人类标注员给输出打分（慢且昂贵）。Constitutional AI：先写一套"宪法"（价值原则），让AI对照宪法自我批评自己的输出，自我修正——再用修正后的输出做强化学习。Claude的安全性和帮助性正是通过CAI训练的。用AI监督AI，比纯人工更可扩展。',ex:'Constitutional AI allows Claude to evaluate its own responses against safety principles.',exZh:'Constitutional AI 使Claude能够对照安全原则评估自身的回应。',rel:['Alignment','RLHF','AI Safety','Anthropic']},
{id:'kg',term:'Knowledge Graph',full:'知识图谱',pron:'/ˈnɒlɪdʒ ɡræf/',emoji:'🕸️',ph:'挪-里-基 格拉-夫',phTip:'把世界上的知识组织成"实体+关系"的网络图',zh:'知识图谱',def:'以图结构表示实体及其关系的知识库，帮助AI理解概念之间的结构化关联',story:'🗺️ "北京"是实体，"是中国首都"是关系，"中国"也是实体。知识图谱把世界上所有知识组织成这样的网络：人→工作于→公司，公司→位于→城市……Google知识图谱让搜索能直接回答"爱因斯坦出生在哪里"。与LLM结合，知识图谱提供结构化事实，减少幻觉。',ex:'Knowledge graphs help AI understand that "Apple" the company and "apple" the fruit are different.',exZh:'知识图谱帮助AI理解公司"Apple"和水果"苹果"是不同的。',rel:['RAG','Grounding','Structured Data','NLP']},
{id:'autoagent',term:'Autonomous Agent',full:'自主智能体',pron:'/ɔːˈtɒnəməs ˈeɪdʒənt/',emoji:'🤖',ph:'奥-探-诺-墨斯 诶-剑特',phTip:'完全自主运行、无需人类介入的AI',zh:'自主智能体',def:'能够设定目标、自主规划、连续执行多步骤操作并自我纠错的AI系统，运行过程中不需要人类干预',story:'🚀 普通Agent：用户下指令→AI执行一步→等下一个指令。Autonomous Agent：用户给目标→AI自己拆解任务、搜索信息、写代码、测试、修Bug、部署——全程不需要你介入。AutoGPT、Devin、Manus都是尝试。这是AI从"工具"变成"同事"的关键一步，也是最大的风险所在。',ex:'The autonomous agent completed the entire research project without human intervention.',exZh:'自主智能体在没有人类干预的情况下完成了整个研究项目。',rel:['Agent','Multi-agent','Planning','Tool Use']},
{id:'retrieval',term:'Retrieval',full:'检索',pron:'/rɪˈtriːvəl/',emoji:'🔎',ph:'瑞-垂-威',phTip:'从知识库中"找"出相关信息的过程',zh:'检索',def:'从大型数据集或文档库中根据查询找出最相关内容的过程，是RAG系统的核心组件',story:'📚 图书馆员工根据你的问题，在数万本书中找到最相关的3本递给你——这就是Retrieval。AI系统的Retrieval：把用户问题转成向量，在向量数据库里找余弦相似度最高的文档块，取出来给LLM参考。检索质量直接决定RAG系统答案的准确率——"找对参考书"比"会做题"更重要。',ex:'The retrieval step found the three most relevant paragraphs from 10,000 documents in milliseconds.',exZh:'检索步骤在毫秒内从一万个文档中找到三个最相关的段落。',rel:['RAG','Vector Database','Semantic Search','Embedding']}
]},
{id:5,emoji:'🌐',color:'#2ECC71',bg:'#E8F8F0',title:'前沿科技',sub:'Emerging Tech',words:[
{id:'saas',term:'SaaS',full:'软件即服务',pron:'/sæs/',emoji:'☁️',ph:'萨斯',phTip:'"Software as a Service"，软件不买，按月租',zh:'SaaS（软件即服务）',def:'通过互联网按订阅方式提供软件的商业模式，用户无需安装或维护，直接在线使用',story:'📦 过去买软件：花几千元买光盘，5年不更新，换电脑得重装。现在SaaS：每月付费订阅，浏览器里就能用，自动更新，换设备登录即用。Notion、Slack、Figma、Zoom——这些都是SaaS。SaaS让创业公司能用上企业级工具，也让软件公司告别"卖断"进入"持续收费"时代。',ex:'Our company moved from installed software to SaaS tools, saving 60% on IT costs.',exZh:'我们公司从安装软件转向SaaS工具，节省了60%的IT成本。',rel:['Cloud','Subscription','API','PaaS']},
{id:'edge',term:'Edge Computing',full:'边缘计算',pron:'/ɛdʒ kəmˈpjuːtɪŋ/',emoji:'📡',ph:'艾基 肯-皮-丁',phTip:'把计算搬到"边缘"设备上，不用上云',zh:'边缘计算',def:'在靠近数据产生地（设备端）进行计算，而非将所有数据发送到云端处理，降低延迟',story:'🏎️ 自动驾驶汽车识别到前方有人——如果把图像传到云端处理再发回指令，可能要0.5秒，撞上去了。边缘计算：在车内芯片直接处理，0.01秒决策，紧急制动。IoT设备、工厂传感器、手机上的Face ID——都是边缘计算。"让计算离数据更近"。',ex:'Edge computing processes video from security cameras locally, reducing bandwidth and latency.',exZh:'边缘计算在本地处理安全摄像头的视频，减少了带宽占用和延迟。',rel:['IoT','Cloud','Latency','AI on Device']},
{id:'iot',term:'IoT',full:'物联网',pron:'/ˌaɪ oʊ ˈtiː/',emoji:'🌐',ph:'爱-哦-提',phTip:'"Internet of Things"，万物皆联网',zh:'IoT（物联网）',def:'将日常物理设备（冰箱、汽车、传感器）通过互联网连接，使其能够收集和交换数据的网络',story:'🏠 智能家居：早上闹钟响，自动调节咖啡机开始煮咖啡；出门时，门锁告诉空调自动关闭；回家前，手机一键预热房间。这就是IoT：每个物体都有传感器和网络连接，万物互联、自动协作。工业IoT更厉害：工厂里数千个传感器实时监控设备，预测性维护，零停机。',ex:'IoT sensors in the factory predict machine failures before they happen, saving millions.',exZh:'工厂中的IoT传感器在机器故障发生前就能预测，节省数百万成本。',rel:['Edge Computing','Sensor','Cloud','Smart Device']},
{id:'ws',term:'WebSocket',full:'WebSocket协议',pron:'/ˈwɛbsɒkɪt/',emoji:'⚡',ph:'唯-波-搜-kit',phTip:'让网页和服务器"保持实时通话"的技术',zh:'WebSocket',def:'在浏览器和服务器之间建立持久双向通信连接的协议，实现真正的实时数据传输',story:'📞 普通HTTP像发短信：你发一条，对方回一条，然后挂断。WebSocket像打电话：连接一次，双方随时互发消息，不用每次重新"打电话"。在线聊天、实时协作（Google Docs多人编辑）、股票实时行情、在线游戏——都靠WebSocket实现真正的实时体验。',ex:'The stock trading app uses WebSocket to push live price updates without page refresh.',exZh:'股票交易应用使用WebSocket推送实时价格更新，无需刷新页面。',rel:['HTTP','Real-time','API','Protocol']},
{id:'nocode',term:'No-code',full:'无代码开发',pron:'/noʊ koʊd/',emoji:'🧩',ph:'哦-柯德',phTip:'不写代码也能做软件，拖拽就搞定',zh:'No-code（无代码）',def:'让非技术人员通过可视化界面（拖拽、配置）而非编写代码来构建应用和自动化流程的工具',story:'🎨 过去做APP需要工程师；现在用Webflow做网站，用Bubble做应用，用Zapier做自动化——不写一行代码。No-code工具让产品经理、市场人员、创业者也能"开发软件"。AI加持的No-code更厉害：告诉AI你想要什么，它生成整个应用。"软件将吃掉世界"，No-code让更多人有资格参与这场盛宴。',ex:'Our marketing team built a customer onboarding flow in Webflow without any engineering help.',exZh:'我们的市场团队在没有任何工程师帮助的情况下，在Webflow中构建了客户引导流程。',rel:['Low-code','SaaS','Automation','Visual Development']},
{id:'blockchain',term:'Blockchain',full:'区块链',pron:'/ˈblɒktʃeɪn/',emoji:'⛓️',ph:'布-洛克-切恩',phTip:'不可篡改的分布式账本，去中心化的信任机制',zh:'区块链',def:'由多个节点共同维护、数据不可篡改的分布式账本技术，是比特币和以太坊的底层基础',story:'📖 想象一本账本，不是银行保管，而是全球数百万台电脑同时持有一份。每新增一条记录，全网验证并永久存入——没有任何单一机构能篡改。这就是区块链：去中心化信任。比特币用它记录转账，以太坊用它运行智能合约，NFT用它记录所有权。区块链的价值在于"无需信任任何人即可相信记录"。',ex:'Blockchain records every supply chain transaction, making product origins transparent and tamper-proof.',exZh:'区块链记录每笔供应链交易，使产品溯源透明且防篡改。',rel:['Cryptocurrency','Web3','Smart Contract','Decentralized']},
{id:'web3',term:'Web3',full:'Web3/去中心化互联网',pron:'/wɛb θriː/',emoji:'🔮',ph:'唯-伯 斯瑞',phTip:'用区块链重建互联网，让用户拥有自己的数据',zh:'Web3',def:'基于区块链技术构建的去中心化互联网愿景，强调用户拥有数字资产和数据的所有权',story:'🌐 Web1（只读）→Web2（可读写，但数据在Facebook/Google手里）→Web3（可读写拥有，你的数据是你的）。Web3的理想：你的社交图谱、数字资产、身份——都存在区块链上，你完全控制，平台倒闭也不影响你。现实是2021-2022年Web3泡沫破裂，很多项目烂尾，但去中心化技术本身在持续演进。',ex:'Web3 applications give users ownership of their digital assets without relying on a central authority.',exZh:'Web3应用让用户拥有自己的数字资产，无需依赖中央机构。',rel:['Blockchain','Cryptocurrency','NFT','Decentralized']},
{id:'arvr',term:'AR/VR',full:'增强/虚拟现实',pron:'/ˌeɪ ˈɑːr viː ˈɑːr/',emoji:'🥽',ph:'诶-阿 维-阿',phTip:'AR叠加虚拟信息到现实，VR完全进入虚拟世界',zh:'AR/VR（增强/虚拟现实）',def:'AR在现实视图上叠加数字信息；VR创造完全沉浸的虚拟环境。两者统称XR（扩展现实）',story:'🎮 VR：戴上头显，你"在"太空站漫步，全程身临其境。AR：用手机扫一下宜家家具，3D模型摆在你家里看效果。Apple Vision Pro、Meta Quest、微软HoloLens——都是这个赛道的玩家。AI让AR更智能：实时识别场景、实时翻译、实时导航叠加……空间计算是下一个平台。',ex:'Surgeons use AR overlays during operations to see real-time imaging data without looking away.',exZh:'外科医生在手术中使用AR叠加层来查看实时影像数据而无需移开视线。',rel:['Spatial Computing','XR','Metaverse','3D']},
{id:'quantum',term:'Quantum Computing',full:'量子计算',pron:'/ˈkwɒntəm kəmˈpjuːtɪŋ/',emoji:'⚛️',ph:'昆-腾 肯-皮-丁',phTip:'用量子力学原理让计算机"同时计算所有可能"',zh:'量子计算',def:'利用量子力学中叠加态和纠缠效应进行计算，在特定问题上比传统计算机快指数倍',story:'🎲 普通计算机：每次只能测试一条路径找迷宫出口。量子计算机：同时测试所有路径（叠加态），瞬间找到出口。对于破解加密、药物分子模拟、优化问题——量子计算机理论上快到无法想象。Google宣称实现"量子霸权"；实际应用仍在早期，但它对现有加密体系的威胁已经让各国政府开始行动。',ex:'Quantum computers could break current encryption algorithms, driving a new era of cryptography.',exZh:'量子计算机可能破解现有加密算法，推动密码学进入新纪元。',rel:['Cryptography','Computing','IBM Quantum','Post-quantum']},
{id:'copilot',term:'Copilot',full:'副驾驶（AI辅助）',pron:'/ˈkoʊpaɪlət/',emoji:'🤝',ph:'扣-派-乐特',phTip:'AI作为"副驾驶"，和人类并肩完成工作',zh:'Copilot（AI副驾驶）',def:'嵌入到专业工具中、辅助人类完成任务的AI助手，以GitHub Copilot为代表的AI辅助工作模式',story:'✈️ 飞机有正副驾驶——飞行员负责决策，副驾驶辅助。AI Copilot同理：你写代码，GitHub Copilot实时补全；你写文档，Microsoft Copilot提供建议；你做设计，Figma AI辅助。Copilot不替代你，而是让你工作快3倍。这是AI落地最成功的模式：人类主导，AI辅助。',ex:'GitHub Copilot writes 40% of code for developers who use it, doubling their productivity.',exZh:'GitHub Copilot为使用它的开发者编写了40%的代码，使生产力翻倍。',rel:['AI Assistant','Code Generation','Tool Use','Human-AI']},
{id:'llmops',term:'LLMOps',full:'大模型运维',pron:'/ˌɛl ɛl ɛm ɒps/',emoji:'🔧',ph:'艾-艾-艾姆-奥普斯',phTip:'让LLM从实验室稳定跑进生产环境的工程实践',zh:'LLMOps',def:'管理、部署、监控和优化大型语言模型在生产环境中运行的工程实践体系',story:'🏭 训练好一个AI模型容易，让它在生产环境稳定运行难。LLMOps解决这些问题：怎么监控模型输出质量？Prompt版本怎么管理？成本怎么控制？幻觉怎么检测？A/B测试怎么做？用户反馈怎么收集改进模型？这是MLOps（机器学习运维）在LLM时代的进化版，是AI落地的隐形基础设施。',ex:'LLMOps tools track prompt performance, cost per query, and hallucination rates in production.',exZh:'LLMOps工具在生产环境中追踪提示词性能、每次查询成本和幻觉率。',rel:['DevOps','MLOps','Monitoring','Production AI']},
{id:'orch',term:'Orchestration',full:'编排',pron:'/ˌɔːrkɪˈstreɪʃən/',emoji:'🎼',ph:'奥-克-斯-垂-讯',phTip:'协调多个AI工具/Agent按顺序完成复杂任务',zh:'编排（AI编排）',def:'协调多个AI模型、工具或Agent按照特定逻辑顺序协同工作，完成复杂多步骤任务的系统',story:'🎻 乐队指挥不演奏，而是协调小提琴、大提琴、管乐，按乐谱配合——这是编排。AI编排同理：一个任务需要搜索→分析→写作→审核，编排系统分配给不同Agent或工具，控制顺序和数据传递。LangChain、LlamaIndex、Dify都是流行的AI编排框架。',ex:'The orchestration layer coordinates search, analysis, and writing agents to produce research reports.',exZh:'编排层协调搜索、分析和写作代理，共同生成研究报告。',rel:['Multi-agent','Agent','Workflow','LangChain']},
{id:'emergent',term:'Emergent Ability',full:'涌现能力',pron:'/ɪˈmɜːrdʒənt əˈbɪlɪti/',emoji:'💥',ph:'伊-么-剑特 阿-比-里-提',phTip:'模型规模够大时，突然"涌现"出没人教过它的能力',zh:'涌现能力',def:'当AI模型规模超过某个阈值时，突然出现的在较小模型中完全不存在的新能力',story:'🌊 水温升到100度时，液体突然变成气态——性质发生质变，而非量变。AI的涌现能力也是如此：GPT-3达到某个参数量，突然能做多步骤推理；GPT-4出现了之前从未见过的代码理解能力。这让AI研究者又兴奋又恐惧：谁也不知道下一个涌现能力是什么，什么时候出现。',ex:'Chain-of-thought reasoning emerged unexpectedly when models reached 100B+ parameters.',exZh:'当模型达到1000亿+参数时，思维链推理能力意外地涌现了。',rel:['Scale','LLM','Capability','Phase Transition']},
{id:'scaling',term:'Scaling Law',full:'规模定律',pron:'/ˈskeɪlɪŋ lɔː/',emoji:'📈',ph:'斯-凯-灵 劳',phTip:'"模型越大+数据越多+算力越多=越聪明"的规律',zh:'Scaling Law（规模定律）',def:'描述AI模型性能随模型参数量、训练数据量和计算量增长而可预测提升的经验规律',story:'🏔️ 科学家们发现了一个惊人规律：AI能力不是随机的，而是随规模增长高度可预测——参数多10倍，能力提升多少；数据多10倍，提升多少——都有公式。这意味着：只要有足够的计算资源，AI就一定会变更强。Scaling Law是过去几年AI军备竞赛的理论基础，也是为什么科技巨头疯狂买GPU的原因。',ex:'Scaling laws predict that doubling compute will yield a predictable improvement in model performance.',exZh:'规模定律预测，将算力翻倍将带来模型性能的可预测提升。',rel:['Compute','Parameter','Emergent Ability','Training']},
{id:'aisafety',term:'AI Safety',full:'AI安全',pron:'/eɪ aɪ ˈseɪfti/',emoji:'🛡️',ph:'诶爱 赛-夫-提',phTip:'确保AI不会伤害人类的研究领域',zh:'AI安全',def:'研究如何开发不会对人类造成伤害的AI系统，包括对齐、可解释性、鲁棒性等方向',story:'⚠️ AI越来越强大，风险也随之增加。AI Safety研究的问题：如何防止AI被滥用（生物武器、网络攻击）？如何确保超级AI不会"误解"人类指令而造成灾难性后果？如何让AI的决策对人类可解释？Anthropic、OpenAI、DeepMind都有专门的Safety团队，这也是AI领域最紧迫的研究之一。',ex:'AI safety researchers study how to prevent powerful AI from pursuing goals misaligned with human values.',exZh:'AI安全研究者研究如何防止强大AI追求与人类价值观不一致的目标。',rel:['Alignment','Constitutional AI','Interpretability','Risk']},
{id:'synthdata',term:'Synthetic Data',full:'合成数据',pron:'/sɪnˈθɛtɪk ˈdeɪtə/',emoji:'🧪',ph:'辛-赛-提克 戴-特',phTip:'AI自己生成的训练数据，解决真实数据不足的问题',zh:'合成数据',def:'由计算机程序或AI模型人工生成的训练数据，用于补充真实数据不足或保护隐私',story:'🏭 训练自动驾驶需要百万次危险场景数据——但真实事故不能造。解法：用3D引擎模拟各种极端场景，生成合成数据。医疗AI缺乏罕见病例？用生成模型合成。合成数据正在成为AI训练的主流补充方式——Meta、Google都在用AI生成数据来训练更好的AI（AI training AI的闭环）。',ex:'The medical AI was trained on synthetic patient data to protect real patients\'s privacy.',exZh:'医疗AI使用合成患者数据进行训练，以保护真实患者的隐私。',rel:['Data Augmentation','Privacy','Training','Generative AI']},
{id:'collapse',term:'Model Collapse',full:'模型崩塌',pron:'/ˈmɒdəl kəˈlæps/',emoji:'🌀',ph:'莫-抖 克-拉普斯',phTip:'AI学AI生成的数据，越学越退化的问题',zh:'模型崩塌',def:'当AI模型在AI生成的数据上训练时，逐渐丧失多样性和准确性，输出质量不断退化的现象',story:'📉 AI生成文章→这些文章进入训练数据→下一代AI学习这些文章→输出越来越像"AI腔"……互联网充满AI生成内容后，训练数据质量不断退化，导致新模型越来越差。这是"互联网污染"带来的新挑战。解法是保护高质量人类创作数据，标记AI生成内容，建立数据溯源机制。',ex:'Researchers warn that training on AI-generated data leads to progressive model collapse over generations.',exZh:'研究人员警告，在AI生成的数据上训练会导致模型性能逐代退化。',rel:['Synthetic Data','Data Quality','Training','AI Generated Content']},
{id:'agentic',term:'Agentic AI',full:'自主型AI',pron:'/eɪˈdʒɛntɪk eɪ aɪ/',emoji:'🤖',ph:'诶-剑-提克 诶爱',phTip:'能主动规划、行动的AI，而非被动等待指令',zh:'Agentic AI（自主型AI）',def:'具备自主目标设定、规划、行动和反思能力的AI系统，能够独立完成复杂任务而无需持续的人工指导',story:'🚀 被动AI：你说一句，它回一句。Agentic AI：你给它一个目标，它自己分析情况、制定计划、调用工具、执行步骤、反思结果、纠正错误——全程自主。2025年是Agentic AI的爆发年：各种"AI员工"、"AI软件工程师"概念产品涌现。最大挑战：如何确保自主AI不做出意料之外的危险决定。',ex:'Agentic AI can plan a business trip, book flights, hotels, and meetings without human input.',exZh:'Agentic AI可以在没有人工输入的情况下规划商务旅行、预订机票、酒店和会议。',rel:['Agent','Autonomous Agent','Multi-agent','Planning']},
{id:'ainative',term:'AI Native',full:'AI原生',pron:'/eɪ aɪ ˈneɪtɪv/',emoji:'🌱',ph:'诶爱 内-提夫',phTip:'从设计之初就以AI为核心构建的产品',zh:'AI Native（AI原生）',def:'从产品设计之初就将AI能力作为核心而非附加功能构建的应用或公司',story:'📱 移动互联网时代：Uber、微信是"Mobile Native"，从一开始就为手机设计，不是网页版移植。AI时代同理：AI Native产品不是在传统软件上加个AI按钮，而是整个产品逻辑就建立在AI之上。Cursor（AI原生代码编辑器）、Perplexity（AI原生搜索）——用传统眼光看它们，会错过革命性的本质。',ex:'Cursor is an AI-native code editor where AI is central to every feature, not an add-on.',exZh:'Cursor是一个AI原生代码编辑器，AI是每个功能的核心，而非附加功能。',rel:['AI First','Product Strategy','LLM','Copilot']},
{id:'flywheel',term:'Data Flywheel',full:'数据飞轮',pron:'/ˈdeɪtə ˈflaɪwiːl/',emoji:'🌀',ph:'戴-特 弗莱-威尔',phTip:'用户越多→数据越多→AI越好→用户更多的正向循环',zh:'数据飞轮',def:'用户使用产生数据→数据改善AI模型→AI更好吸引更多用户→产生更多数据的正向反馈循环',story:'⚙️ Tesla的数据飞轮：卖出更多车→收集更多行驶数据→自动驾驶AI更准→Tesla车更受欢迎→卖出更多车……Uber也是：更多司机→等待时间短→更多乘客→更多司机。数据飞轮是AI时代最强大的护城河——先发者积累的数据优势，后来者极难追赶。',ex:'Spotify\'s data flywheel: more listeners create better recommendations, attracting even more listeners.',exZh:'Spotify的数据飞轮：更多听众产生更好的推荐，吸引更多听众。',rel:['Network Effect','Competitive Moat','Training','Data']},
{id:'twin',term:'Digital Twin',full:'数字孪生',pron:'/ˈdɪdʒɪtəl twɪn/',emoji:'🪞',ph:'滴-基-特 推因',phTip:'现实物体在数字世界的精确镜像',zh:'数字孪生',def:'物理实体（工厂、城市、人体器官）在数字空间中的精确实时虚拟副本，用于监控、模拟和优化',story:'🏭 波音为每架飞机创建数字孪生：实体飞机飞行时，数字孪生实时同步所有传感器数据，模拟每个零件的磨损状态，预测何时需要维修。医疗数字孪生：为患者创建器官的数字副本，在虚拟环境中测试手术方案再执行真实手术。工业AI的核心概念，"在数字世界预演，在物理世界执行"。',ex:'A digital twin of the power grid lets engineers simulate outages before they happen.',exZh:'电网的数字孪生让工程师能在停电发生前模拟故障。',rel:['IoT','Simulation','Edge Computing','Industrial AI']},
{id:'ctxeng',term:'Context Engineering',full:'上下文工程',pron:'/ˈkɒntɛkst ˌɛndʒɪˈnɪərɪŋ/',emoji:'🏗️',ph:'肯-文斯特 恩-基-尼-瑞',phTip:'精心设计AI的"工作记忆"，让Agent更聪明',story:'🎯 Prompt Engineering是问好一个问题；Context Engineering是设计整个"工作环境"。给AI的不只是当前问题，还有：相关历史记录、用户画像、工具说明、约束条件、输出格式……把所有这些精心塞进Context Window，让AI在最优信息环境下工作。这是2025年Agent工程的核心技能——不是提问技巧，而是信息架构。',zh:'上下文工程',def:'设计和优化AI模型输入信息（包括指令、历史、工具描述、示例等）以最大化Agent系统性能的工程实践',ex:'Context engineering involves carefully crafting what information goes into the AI\'s context window.',exZh:'上下文工程涉及精心设计进入AI上下文窗口的信息。',rel:['Prompt Engineering','Agent','Context Window','RAG']},
{id:'responsibleai',term:'Responsible AI',full:'负责任的AI',pron:'/rɪˈspɒnsɪbəl eɪ aɪ/',emoji:'⚖️',ph:'瑞-斯-盆-西-伯 诶爱',phTip:'以道德和对社会负责的方式开发和使用AI',zh:'负责任的AI',def:'在AI系统的设计、开发和部署中遵循公平性、透明度、隐私保护和问责制等原则的实践框架',story:'🏛️ 招聘AI筛选简历，却因训练数据偏见系统性地歧视女性——这是AI不负责任的后果。负责任的AI要求：算法公平（不歧视）、决策透明（可解释）、数据隐私（不滥用）、问责机制（出错谁负责）。欧盟《AI法案》是全球首个AI监管法规，把负责任的AI从道德要求变成了法律义务。',ex:'The EU\'s AI Act requires high-risk AI systems to be transparent, fair, and human-overseen.',exZh:'欧盟《AI法案》要求高风险AI系统透明、公平并受人类监督。',rel:['AI Safety','Alignment','Fairness','EU AI Act']},

const S  = k => localStorage.getItem('tw_'+k);
const SS = (k,v) => localStorage.setItem('tw_'+k,v);
let learned = JSON.parse(S('learned')||'{}');
let xp      = parseInt(S('xp')||'0');
let streak  = parseInt(S('streak')||'0');
let curLv   = null;
let curIdx  = 0;

// ══════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════
function speak(txt, rate){
  if(!window.speechSynthesis) return;
  rate = rate||0.88;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='en-US'; u.rate=rate;
  speechSynthesis.speak(u);
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function toast(msg, dur){
  dur = dur||2000;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), dur);
}

// ══════════════════════════════════════════════
// CONFETTI  (CSS-based)
// ══════════════════════════════════════════════
function confetti(){
  const cols=['#6C63FF','#FF6B6B','#FFD93D','#6BCB77','#FF9F43'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');
    el.className='conf';
    const sz=6+Math.random()*7;
    el.style.cssText=[
      'left:'+Math.random()*100+'vw',
      'width:'+sz+'px',
      'height:'+sz+'px',
      'background:'+cols[i%5],
      'animation-duration:'+(1.2+Math.random()*1.6)+'s',
      'animation-delay:'+Math.random()*0.5+'s'
    ].join(';');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3500);
  }
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

  document.getElementById('sc-'+id).classList.add('active');

  document.getElementById('n-home').classList.add('active');
  renderHome();
}
function goSearch(){
  showScreen('search');
  document.getElementById('n-search').classList.add('active');
  initSearch();
}
function showProg(){

}

  else goHome();
}

function updateTopbar(){
  document.getElementById('sXP').textContent = xp;
  document.getElementById('sStreak').textContent = streak;
}

// HOME
// ══════════════════════════════════════════════
function renderHome(){
  updateTopbar();
  const total = LEVELS.reduce((a,l)=>a+l.words.length,0);
  const done  = Object.keys(learned).length;
  const pct   = Math.round(done/total*100);
  document.getElementById('heroBar').style.width = pct+'%';
  document.getElementById('heroLbl').textContent = '已掌握 '+done+' / '+total+' 词 · '+xp+' XP';

  const list = document.getElementById('lvList');
  list.innerHTML = LEVELS.map((lv,i)=>{
    const lvDone = lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
    const lvPct  = Math.round(lvDone/lv.words.length*100);
    const prevLv = LEVELS[i-1];
    const unlocked = i===0||(prevLv&&prevLv.words.filter(w=>learned[prevLv.id+'_'+w.id]).length===prevLv.words.length);
    const allDone  = lvDone===lv.words.length;
    const cls   = !unlocked?'locked':allDone?'done':lvDone>0?'current':'';
    const badge = !unlocked?'🔒':allDone?'✅':'▶';
    const click = unlocked?'openLevel('+lv.id+')':'';
    return '<div class="level-card '+cls+'" onclick="'+click+'">'
      +'<div class="lv-ico" style="background:'+lv.bg+'">'+lv.emoji+'</div>'
      +'<div class="lv-info">'
        +'<h3>Lv.'+(i+1)+' · '+lv.title+'</h3>'
        +'<div class="sub">'+lv.sub+' · '+lv.words.length+'词</div>'
        +'<div class="lv-bar"><div class="lv-fill" style="width:'+lvPct+'%;background:'+lv.color+'"></div></div>'
        +'<div class="lv-pct">'+lvDone+'/'+lv.words.length+' 已掌握</div>'
      +'</div>'
      +'<div class="lv-badge" style="background:'+lv.bg+';color:'+lv.color+'">'+badge+'</div>'
    +'</div>';
  }).join('');
}

function openLevel(id){
  curLv = LEVELS.find(l=>l.id===id);
  showScreen('level');
  document.getElementById('n-home').classList.add('active');
  const lv=curLv;
  document.getElementById('lvTitle').textContent = lv.emoji+' '+lv.title;
  document.getElementById('lvSub').textContent   = lv.sub+' · '+lv.words.length+' 词';

  const lvDone = lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
  document.getElementById('wordGrid').innerHTML = lv.words.map(w=>{
    const ok = !!learned[lv.id+'_'+w.id];
    return '<div class="wchip '+(ok?'learned':'')+'" onclick="openCard('+lv.id+',\''+w.id+'\')">'
      +'<span class="ck">'+(ok?'✅':'')+'</span>'
      +'<div class="wt">'+w.emoji+' '+w.term+'</div>'
      +'<div class="wm">'+w.zh+'</div>'
    +'</div>';
  }).join('');

  const btn = document.getElementById('quizBtn');
  if(lvDone>=5){
    btn.className='btn btn-p'; btn.textContent='🎯 开始测验'; btn.disabled=false;
  } else {
    btn.className='btn btn-d'; btn.textContent='先学 '+(5-lvDone)+' 个词再测验'; btn.disabled=true;
  }
}

// VOCAB CARD
// ══════════════════════════════════════════════
function openCard(lvId, wId){
  curLv  = LEVELS.find(l=>l.id===lvId);
  curIdx = curLv.words.findIndex(w=>w.id===wId);
  showScreen('card');
  document.getElementById('n-home').classList.add('active');
  renderCard();
}

function _esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function _dk(hex,amt){
  try{
    const n=parseInt(hex.slice(1),16);
    return 'rgb('+Math.max(0,((n>>16)&255)-amt)+','+Math.max(0,((n>>8)&255)-amt)+','+Math.max(0,(n&255)-amt)+')';
  }catch(e){return hex;}
}

function renderCard(){
  const lv=curLv, w=lv.words[curIdx];
  const isLearned=!!learned[lv.id+'_'+w.id];
  document.getElementById('cardCtr').textContent = (curIdx+1)+' / '+lv.words.length;
  document.getElementById('prevBtn').style.opacity = curIdx===0?'0.35':'1';
  document.getElementById('nextBtn').textContent   = curIdx===lv.words.length-1?'完成 ✓':'下一个 →';

  document.getElementById('cardContent').innerHTML =
    '<div class="vocab-card">'
    +'<div class="vc-head" style="background:linear-gradient(135deg,'+lv.color+','+_dk(lv.color,45)+')">'
      +'<span class="vc-emoji">'+w.emoji+'</span>'
      +'<div class="vc-term">'+w.term+'</div>'
      +'<div class="vc-full">'+w.full+'</div>'
      +'<div class="vc-pron"><button class="audio-btn" onclick="speak(\''+_esc(w.term)+'\')">🔊</button><span>'+w.pron+'</span></div>'
    +'</div>'
    +'<div class="vc-body">'
      +'<div class="vc-section"><div class="sec-lbl">🗣 谐音记忆</div>'
        +'<div class="phonetic-box"><div class="ph-icon">💡</div><div class="ph-text">'
          +'<div class="ph-word">'+w.ph+'</div><div class="ph-tip">'+w.phTip+'</div>'
        +'</div></div></div>'
      +'<div class="vc-section"><div class="sec-lbl">📖 释义</div>'
        +'<div class="vc-zh">'+w.zh+'</div><div class="vc-def">'+w.def+'</div></div>'
      +'<div class="vc-section"><div class="sec-lbl">🎭 故事记忆</div>'
        +'<div class="story-box"><div class="story-txt">'+w.story+'</div></div></div>'
      +'<div class="vc-section"><div class="sec-lbl">💬 例句</div>'
        +'<div class="example-box">'
          +'<div class="ex-en"><div class="ex-en-txt">'+w.ex+'</div>'
            +'<button class="audio-btn" style="background:rgba(0,0,0,.08);flex-shrink:0" onclick="speak(\''+_esc(w.ex)+'\',0.8)">🔊</button>'
          +'</div><div class="ex-zh">'+w.exZh+'</div>'
        +'</div></div>'
      +'<div class="vc-section"><div class="sec-lbl">🔗 相关词</div>'
        +'<div class="related-chips">'+w.rel.map(r=>'<span class="rchip" onclick="searchWord(\''+_esc(r)+'\')">'+r+'</span>').join('')+'</div>'
      +'</div>'
    +'</div>'
    +'<div style="padding:0 16px 16px">'
      +'<button class="btn '+(isLearned?'btn-g':'btn-p')+'" onclick="markLearned()">'+(isLearned?'✅ 已掌握':'👍 标记已掌握')+'</button>'
    +'</div>'
  +'</div>';

  setTimeout(()=>speak(w.term), 400);
}

function prevCard(){
  if(curIdx>0){curIdx--;renderCard();}
}
function nextCard(){
  if(curIdx<curLv.words.length-1){curIdx++;renderCard();}
  else{toast('🎉 本关词汇全部浏览完毕！');openLevel(curLv.id);}
}
function markLearned(){
  const w=curLv.words[curIdx], key=curLv.id+'_'+w.id;
  if(!learned[key]){
    learned[key]=true; SS('learned',JSON.stringify(learned));
    xp+=10; SS('xp',xp); updateTopbar();
    toast('🎉 +10 XP · 已掌握！'); confetti();
  } else { toast('已经掌握了 ✅'); }
  renderCard();
}

// ══════════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════════
let qWords=[],qIdx=0,qScore=0,qErrN=0,qAnswered=false,qOpts=[];

function startQuiz(){
  if(!curLv) return;
  const pool=[...curLv.words].sort(()=>Math.random()-.5);
  qWords=pool.slice(0,Math.min(10,pool.length));
  qIdx=0;qScore=0;qErrN=0;qAnswered=false;
  showScreen('quiz');
  document.getElementById('n-home').classList.add('active');
  renderQuiz();
}

function renderQuiz(){
  const w=qWords[qIdx], total=qWords.length;
  document.getElementById('qBar').style.width  = (qIdx/total*100)+'%';
  document.getElementById('qNum').textContent  = (qIdx+1)+'/'+total;
  document.getElementById('qOk').textContent   = qScore;
  document.getElementById('qErr').textContent  = qErrN;
  document.getElementById('fb').className      = 'fb';
  document.getElementById('chkBtn').style.display='none';
  document.getElementById('nxtBtn').style.display='none';
  qAnswered=false;

  const pool2=curLv.words.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
  qOpts=[w,...pool2].sort(()=>Math.random()-.5);
  const letters=['A','B','C','D'];

  document.getElementById('qBody').innerHTML =
    '<div class="qtype-badge" style="background:var(--pl);color:var(--p)">📖 选择含义</div>'
    +'<div class="qterm">'+w.emoji+' '+w.term
      +'<button class="audio-btn" onclick="speak(\''+_esc(w.term)+'\')">🔊</button></div>'
    +'<div class="qquestion">这个词的中文含义是？</div>'
    +'<div class="qsub">'+w.pron+'</div>'
    +'<div class="opts" id="opts">'
      +qOpts.map((o,i)=>'<div class="opt" id="opt'+i+'" onclick="selectOpt('+i+')">'
        +'<div class="opt-letter">'+letters[i]+'</div><span>'+o.zh+'</span></div>').join('')
    +'</div>';
}

function selectOpt(i){
  if(qAnswered) return;
  qAnswered=true;
  const w=qWords[qIdx], correct=qOpts[i].id===w.id;
  qOpts.forEach((o,j)=>{
    const el=document.getElementById('opt'+j);
    el.style.pointerEvents='none';
    if(o.id===w.id) el.classList.add('ok');
    else if(j===i&&!correct) el.classList.add('err');
  });
  const fb=document.getElementById('fb');
  if(correct){
    qScore++;xp+=5;SS('xp',xp);updateTopbar();
    fb.className='fb ok-fb show';
    fb.innerHTML='<div class="fb-t">✅ 正确！+5 XP</div><div class="fb-b">'+w.def+'</div>';
  } else {
    qErrN++;
    fb.className='fb err-fb show';
    fb.innerHTML='<div class="fb-t">❌ 正确答案：'+w.zh+'</div><div class="fb-b">'+w.def+'</div>';
  }
  document.getElementById('qOk').textContent=qScore;
  document.getElementById('qErr').textContent=qErrN;
  document.getElementById('nxtBtn').style.display='block';
}

function nextQ(){
  qIdx++;
  if(qIdx>=qWords.length) finishQuiz();
  else renderQuiz();
}

function finishQuiz(){
  showScreen('result');
  const pct=Math.round(qScore/qWords.length*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'💪':'📚';
  const msg=pct>=90?'完美！你是词汇高手！':pct>=70?'太棒了，继续保持！':pct>=50?'不错，再练练更好！':'多练练，加油！';
  if(pct>=70){
    qWords.forEach(w=>{const key=curLv.id+'_'+w.id;if(!learned[key]){learned[key]=true;xp+=5;}});
    SS('learned',JSON.stringify(learned));SS('xp',xp);updateTopbar();
  }
  document.getElementById('resultWrap').innerHTML =
    '<span class="r-emoji">'+emoji+'</span>'
    +'<div class="r-title">'+msg+'</div>'
    +'<div class="r-sub">完成「'+curLv.title+'」测验</div>'
    +'<div class="r-stats">'
      +'<div class="r-stat"><div class="num">'+qScore+'/'+qWords.length+'</div><div class="lbl">答对题数</div></div>'
      +'<div class="r-stat"><div class="num" style="color:'+(pct>=70?'var(--g)':'var(--r)')+'">'+pct+'%</div><div class="lbl">正确率</div></div>'
    +'</div>'
    +'<div class="xp-earned"><div class="xi">⚡</div><div><div class="xn">'+xp+' XP</div><div class="xl">累计经验值</div></div></div>'
    +'<button class="btn btn-p" onclick="startQuiz()" style="margin-bottom:12px">🔄 再来一次</button>'
    +'<button class="btn btn-o" onclick="openLevel('+curLv.id+')">← 返回关卡</button>';
  if(pct>=80) setTimeout(confetti,200);
}

let _sT;
function initSearch(){
  document.getElementById('sinput').value='';
  document.getElementById('sResults').innerHTML='<div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div>';
  const hot=['AI','Token','API','Agent','LLM','Prompt','Cache','UX','Bug','OAuth'];
  document.getElementById('hotTags').innerHTML=hot.map(t=>'<span class="htag" onclick="searchWord(\''+t+'\')">'+t+'</span>').join('');
}

function doSearch(q){
  clearTimeout(_sT);
  _sT=setTimeout(()=>{
    if(!q.trim()){document.getElementById('sResults').innerHTML='<div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div>';return;}
    const ql=q.toLowerCase(),res=[];
    LEVELS.forEach(lv=>lv.words.forEach(w=>{
      if(w.term.toLowerCase().includes(ql)||w.zh.includes(q)||w.def.includes(q)||w.ph.includes(q)||w.id.includes(ql))
        res.push({lv,w});
    }));
    document.getElementById('sResults').innerHTML=res.length
      ? res.map(({lv,w})=>'<div class="sr-card" onclick="openCard('+lv.id+',\''+w.id+'\')">'
          +'<div class="sr-term">'+w.emoji+' '+w.term+'</div>'
          +'<div class="sr-zh">'+w.zh+'</div>'
          +'<div class="sr-def">'+w.def.slice(0,50)+'…</div>'
          +'<div class="sr-lv" style="color:'+lv.color+'">'+lv.emoji+' '+lv.title+'</div>'
        +'</div>').join('')
      : '<div class="s-empty"><div class="ei">😕</div><p>没找到相关词汇</p></div>';
  },300);
}

function searchWord(term){
  goSearch();
  document.getElementById('sinput').value=term;
  doSearch(term);
}

// ══════════════════════════════════════════════
// PROGRESS  (modal)
// ══════════════════════════════════════════════
function renderProgModal(){
  const total=LEVELS.reduce((a,l)=>a+l.words.length,0);
  const done=Object.keys(learned).length;
  document.getElementById('mContent').innerHTML =
    '<span class="be">📊</span><h3>我的进度</h3>'
    +'<p style="font-size:15px;font-weight:800;color:var(--p)">'+xp+' XP · '+done+'/'+total+' 词</p>'
    +LEVELS.map(lv=>{
      const lvD=lv.words.filter(w=>learned[lv.id+'_'+w.id]).length;
      const pct=Math.round(lvD/lv.words.length*100);
      return '<div style="text-align:left;margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px">'
          +'<span>'+lv.emoji+' '+lv.title+'</span><span style="color:'+lv.color+'">'+pct+'%</span></div>'
        +'<div style="background:var(--br);border-radius:6px;height:7px;overflow:hidden">'
          +'<div style="height:100%;width:'+pct+'%;background:'+lv.color+';border-radius:6px;transition:width .5s"></div></div>'
        +'<div style="font-size:11px;color:var(--mu);margin-top:3px">'+lvD+'/'+lv.words.length+' 词</div>'
      +'</div>';
    }).join('')
    +'<button class="btn btn-p" style="margin-top:8px" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">关闭</button>';
  document.getElementById('modal').classList.add('show');
}

// ══════════════════════════════════════════════
// MODAL CLOSE
// ══════════════════════════════════════════════
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('show');
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
updateTopbar();
renderHome();
</script>
