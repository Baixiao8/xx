<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TechWords · 科技英语闯关</title>
<style>
:root {
  --p:#6C63FF;--pd:#5A52D5;--pl:#EAE8FF;
  --r:#FF6B6B;--rl:#FFE8E8;
  --y:#FFD93D;--yl:#FFF8DC;
  --g:#6BCB77;--gl:#E8F8EA;
  --t:#3AAFA9;--tl:#E0F7F6;
  --o:#FF9F43;--ol:#FFF3E0;
  --bg:#F7F8FF;--card:#fff;
  --tx:#2D2D3A;--mu:#8B8B9E;--br:#E8E8F0;
  --rad:18px;--rads:12px;
  --sh:0 4px 20px rgba(108,99,255,.12);
  --shl:0 8px 40px rgba(108,99,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden}

/* TOPBAR */
.topbar{background:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--br);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(108,99,255,.08)}
.logo{font-size:20px;font-weight:900;color:var(--p);letter-spacing:-.5px}.logo span{color:var(--r)}
.stats{display:flex;gap:10px;align-items:center}
.chip{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:20px;padding:5px 10px;font-size:13px;font-weight:700}

/* SCREENS */
.screen{display:none;padding-bottom:80px;min-height:100vh}
.screen.active{display:block}

/* HOME */
.hero{background:linear-gradient(135deg,var(--p) 0%,#9B59B6 100%);padding:24px 20px 32px;color:#fff;text-align:center;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero::after{content:'';position:absolute;bottom:-40px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero h1{font-size:24px;font-weight:900;margin-bottom:6px}
.hero p{font-size:13px;opacity:.85;margin-bottom:18px}
.xp-wrap{background:rgba(255,255,255,.2);border-radius:20px;height:10px;margin:0 10px;overflow:hidden}
.xp-fill{height:100%;background:var(--y);border-radius:20px;transition:width .6s ease}
.xp-lbl{font-size:11px;opacity:.75;margin-top:5px}

.sec-title{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin:20px 20px 12px}
.level-card{background:#fff;border-radius:var(--rad);padding:16px;margin:0 16px 12px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:14px;border:2.5px solid transparent;transition:transform .15s,box-shadow .15s}
.level-card:active{transform:scale(.97)}
.level-card.locked{opacity:.45;cursor:not-allowed}
.level-card.done{border-color:var(--g)}
.level-card.current{border-color:var(--p)}
.lv-ico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.lv-info{flex:1;min-width:0}
.lv-info h3{font-size:15px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-info .sub{font-size:11px;color:var(--mu);margin-bottom:6px}
.lv-bar{background:var(--br);border-radius:8px;height:5px;overflow:hidden}
.lv-fill{height:100%;border-radius:8px;transition:width .5s}
.lv-pct{font-size:10px;color:var(--mu);margin-top:3px}
.lv-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}

/* LEVEL DETAIL */
.lv-hdr{padding:20px;background:#fff;border-bottom:2px solid var(--br)}
.back{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--p);cursor:pointer;background:none;border:none;margin-bottom:12px}
.lv-hdr h2{font-size:20px;font-weight:900;margin-bottom:3px}
.lv-hdr p{font-size:12px;color:var(--mu)}
.word-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wchip{background:#fff;border-radius:var(--rads);padding:13px 10px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;text-align:center;border:2px solid var(--br);transition:transform .15s;position:relative}
.wchip:active{transform:scale(.96)}
.wchip.learned{border-color:var(--g);background:var(--gl)}
.wchip .wt{font-size:13px;font-weight:800;margin-bottom:3px}
.wchip .wm{font-size:10px;color:var(--mu)}
.wchip .ck{position:absolute;top:6px;right:7px;font-size:11px}
.qbtn-wrap{padding:0 16px 16px}
.btn{width:100%;padding:15px;border-radius:var(--rads);border:none;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .18s}
.btn-p{background:var(--p);color:#fff;box-shadow:0 4px 16px rgba(108,99,255,.35)}
.btn-p:active{transform:translateY(2px);box-shadow:0 2px 8px rgba(108,99,255,.3)}
.btn-g{background:var(--g);color:#fff;box-shadow:0 4px 16px rgba(107,203,119,.35)}
.btn-d{background:var(--br);color:var(--mu);cursor:not-allowed}
.btn-o{background:#fff;color:var(--p);border:2.5px solid var(--p)}

/* VOCAB CARD */
.card-nav{padding:14px 18px;display:flex;align-items:center;background:#fff;border-bottom:2px solid var(--br);gap:10px}
.card-ctr{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--mu)}
.vocab-card{margin:14px 16px;border-radius:var(--rad);overflow:hidden;box-shadow:var(--shl);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

.vc-head{padding:22px 20px 18px;text-align:center;position:relative}
.vc-emoji{font-size:44px;margin-bottom:10px;display:block}
.vc-term{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:3px}
.vc-full{font-size:11px;color:rgba(255,255,255,.75);margin-bottom:10px;line-height:1.4}
.vc-pron{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:20px;padding:5px 14px}
.vc-pron span{font-size:13px;font-weight:600;color:#fff}
.audio-btn{background:rgba(255,255,255,.25);border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s;flex-shrink:0}
.audio-btn:active{transform:scale(.9)}
.audio-btn.speaking{animation:audioAnim .5s ease infinite alternate}
@keyframes audioAnim{from{transform:scale(1);background:rgba(255,255,255,.25)}to{transform:scale(1.15);background:rgba(255,255,255,.4)}}

.vc-body{background:#fff}
.vc-section{padding:16px 20px;border-bottom:1.5px solid var(--br)}
.vc-section:last-child{border-bottom:none}
.sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin-bottom:8px}

/* phonetic section */
.phonetic-box{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--rads);padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.ph-icon{font-size:22px;flex-shrink:0}
.ph-text .ph-word{font-size:18px;font-weight:900;color:#fff;margin-bottom:3px}
.ph-text .ph-tip{font-size:12px;color:rgba(255,255,255,.8);line-height:1.5}

/* meaning */
.vc-zh{font-size:20px;font-weight:900;margin-bottom:4px}
.vc-def{font-size:13px;color:var(--mu);line-height:1.6}

/* story */
.story-box{background:linear-gradient(135deg,#fff9f0,#fff3e0);border-radius:var(--rads);padding:14px 16px;border-left:4px solid var(--o)}
.story-txt{font-size:13px;line-height:1.75;color:var(--tx)}

/* example */
.example-box{background:var(--yl);border-radius:var(--rads);padding:14px 16px}
.ex-en{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.ex-en-txt{font-size:13px;font-weight:600;color:var(--tx);line-height:1.5;flex:1}
.ex-zh{font-size:12px;color:var(--mu);line-height:1.5}

/* related */
.related-chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{background:var(--pl);color:var(--p);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.rchip:active{background:var(--p);color:#fff}

/* card actions */
.card-actions{padding:14px 16px;display:flex;gap:10px}
.card-actions .btn{flex:1;padding:13px;font-size:14px}

/* QUIZ */
.quiz-hdr{padding:14px 18px;background:#fff;border-bottom:2px solid var(--br)}
.qprog{background:var(--br);border-radius:10px;height:8px;overflow:hidden;margin-bottom:7px}
.qprog-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--r));border-radius:10px;transition:width .4s ease}
.qstats{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-weight:600}
.quiz-body{padding:18px}
.qtype-badge{display:inline-block;padding:4px 13px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.qterm{background:linear-gradient(135deg,var(--p),#9B59B6);color:#fff;border-radius:var(--rads);padding:18px;text-align:center;font-size:24px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.qterm .audio-btn{background:rgba(255,255,255,.25)}
.qquestion{font-size:16px;font-weight:800;margin-bottom:6px}
.qsub{font-size:13px;color:var(--mu);margin-bottom:18px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2.5px solid var(--br);border-radius:var(--rads);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:600;transition:all .18s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--p);background:var(--pl);color:var(--p)}
.opt.ok{border-color:var(--g);background:var(--gl);color:#2d7a3a}
.opt.err{border-color:var(--r);background:var(--rl);color:#c0392b}
.opt-letter{width:28px;height:28px;border-radius:8px;background:var(--br);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;transition:all .18s}
.opt.sel .opt-letter{background:var(--p);color:#fff}
.opt.ok .opt-letter{background:var(--g);color:#fff}
.opt.err .opt-letter{background:var(--r);color:#fff}
.fb{margin:0 18px 16px;border-radius:var(--rads);padding:14px 16px;display:none;animation:slideIn .25s ease}
.fb.show{display:block}
.fb.ok-fb{background:var(--gl);border-left:4px solid var(--g)}
.fb.err-fb{background:var(--rl);border-left:4px solid var(--r)}
.fb-t{font-size:15px;font-weight:800;margin-bottom:4px}
.fb.ok-fb .fb-t{color:#2d7a3a}
.fb.err-fb .fb-t{color:#c0392b}
.fb-b{font-size:12px;line-height:1.6;color:var(--tx)}
.chk-wrap{padding:0 18px 14px}

/* RESULT */
.result-wrap{padding:36px 22px;text-align:center}
.r-emoji{font-size:68px;display:block;animation:bounce .6s ease;margin-bottom:14px}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.r-title{font-size:24px;font-weight:900;margin-bottom:7px}
.r-sub{font-size:14px;color:var(--mu);margin-bottom:28px;line-height:1.6}
.r-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.r-stat{background:#fff;border-radius:var(--rads);padding:18px;box-shadow:var(--sh)}
.r-stat .num{font-size:26px;font-weight:900;color:var(--p)}
.r-stat .lbl{font-size:11px;color:var(--mu);margin-top:3px}
.xp-earned{background:linear-gradient(135deg,var(--y),#FFB300);border-radius:var(--rads);padding:16px 18px;margin-bottom:24px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(255,193,7,.3)}
.xp-earned .xi{font-size:30px}
.xp-earned .xn{font-size:20px;font-weight:900;color:#fff}
.xp-earned .xl{font-size:11px;color:rgba(255,255,255,.8)}

/* SEARCH */
.search-wrap{padding:18px}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--br);border-radius:var(--rads);padding:13px 15px;margin-bottom:14px;transition:border-color .2s}
.sbox:focus-within{border-color:var(--p)}
.sbox input{flex:1;border:none;outline:none;font-size:16px;color:var(--tx);background:transparent}
.sbox input::placeholder{color:var(--mu)}
.hot-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.htag{background:var(--pl);color:var(--p);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer}
.htag:active{background:var(--p);color:#fff}
.sr-card{background:#fff;border-radius:var(--rads);padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent;transition:all .15s}
.sr-card:hover{border-color:var(--pl)}
.sr-term{font-size:17px;font-weight:900;color:var(--p)}
.sr-zh{font-size:14px;font-weight:700;margin-top:2px}
.sr-def{font-size:11px;color:var(--mu);margin-top:3px;line-height:1.5}
.sr-lv{font-size:10px;color:var(--mu);margin-top:5px}
.s-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.s-empty .ei{font-size:44px;margin-bottom:10px}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:2px solid var(--br);display:flex;padding:6px 0;z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 0;transition:all .18s}
.ni .nicon{font-size:21px}
.ni .nlbl{font-size:10px;font-weight:700;color:var(--mu)}
.ni.active .nlbl{color:var(--p)}
.ni.active .nicon{transform:scale(1.1)}

/* TOAST */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--tx);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFETTI */
.conf{position:fixed;top:-10px;border-radius:3px;animation:confFall linear forwards;z-index:9999;pointer-events:none}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:22px}
.modal-ov.show{display:flex}
.modal{background:#fff;border-radius:var(--rad);padding:28px 22px;text-align:center;width:100%;max-width:340px;animation:mpop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes mpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal .be{font-size:58px;margin-bottom:10px;display:block}
.modal h3{font-size:20px;font-weight:900;margin-bottom:7px}
.modal p{font-size:13px;color:var(--mu);margin-bottom:22px;line-height:1.6}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Tech<span>Words</span></div>
  <div class="stats">
    <div class="chip">🔥<span id="sStreak">0</span></div>
    <div class="chip">⚡<span id="sXP">0</span></div>
  </div>
</div>

<!-- HOME -->
<div class="screen active" id="sc-home">
  <div class="hero">
    <h1>🚀 科技英语闯关</h1>
    <p>掌握 AI 与互联网时代的专业术语</p>
    <div class="xp-wrap"><div class="xp-fill" id="heroBar" style="width:0%"></div></div>
    <div class="xp-lbl" id="heroLbl">0 XP · 开始你的第一关吧！</div>
  </div>
  <div class="sec-title">📚 学习路径</div>
  <div id="lvList"></div>
</div>

<!-- LEVEL DETAIL -->
<div class="screen" id="sc-level">
  <div class="lv-hdr">
    <button class="back" onclick="goHome()">← 返回</button>
    <h2 id="lvTitle"></h2>
    <p id="lvSub"></p>
  </div>
  <div class="word-grid" id="wordGrid"></div>
  <div class="qbtn-wrap">
    <button class="btn btn-p" id="quizBtn" onclick="startQuiz()">🎯 开始测验</button>
  </div>
</div>

<!-- CARD -->
<div class="screen" id="sc-card">
  <div class="card-nav">
    <button class="back" onclick="goLevel()" style="margin-bottom:0">← 返回</button>
    <div class="card-ctr" id="cardCtr"></div>
    <div style="width:60px"></div>
  </div>
  <div id="cardContent"></div>
  <div class="card-actions">
    <button class="btn btn-o" id="prevBtn" onclick="prevCard()">← 上一个</button>
    <button class="btn btn-p" id="nextBtn" onclick="nextCard()">下一个 →</button>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="sc-quiz">
  <div class="quiz-hdr">
    <button class="back" onclick="goLevel()" style="margin-bottom:7px">← 退出</button>
    <div class="qprog"><div class="qprog-fill" id="qBar" style="width:0%"></div></div>
    <div class="qstats"><span id="qNum">1/8</span><span>✅<span id="qOk">0</span> ❌<span id="qErr">0</span></span></div>
  </div>
  <div class="quiz-body" id="qBody"></div>
  <div class="fb" id="fb"></div>
  <div class="chk-wrap">
    <button class="btn btn-p" id="chkBtn" onclick="checkAns()" style="display:none">确认答案</button>
    <button class="btn btn-p" id="nxtBtn" onclick="nextQ()" style="display:none">继续 →</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="sc-result">
  <div class="result-wrap" id="resultWrap"></div>
</div>

<!-- SEARCH -->
<div class="screen" id="sc-search">
  <div class="search-wrap">
    <div class="sbox">
      <span>🔍</span>
      <input type="text" id="sinput" placeholder="搜索术语… API, Token, Agent" oninput="doSearch(this.value)">
    </div>
    <div style="font-size:11px;font-weight:800;color:var(--mu);margin-bottom:8px">🔥 热门</div>
    <div class="hot-tags" id="hotTags"></div>
    <div id="sResults"><div class="s-empty"><div class="ei">🔭</div><p>输入词汇开始搜索</p></div></div>
  </div>
</div>

<div class="bnav">
  <div class="ni active" id="n-home" onclick="goHome()"><span class="nicon">🏠</span><span class="nlbl">主页</span></div>
  <div class="ni" id="n-search" onclick="goSearch()"><span class="nicon">🔍</span><span class="nlbl">查词</span></div>
  <div class="ni" id="n-prog" onclick="showProg()"><span class="nicon">📊</span><span class="nlbl">进度</span></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-ov" id="modal"><div class="modal" id="mContent"></div></div>

<script>
// ══════════════════════════════════════════════
// VOCABULARY — 180 words, 6 levels × 30
// ══════════════════════════════════════════════
const LEVELS = [
{id:0,emoji:'🌐',color:'#6C63FF',bg:'#EAE8FF',title:'互联网基础',sub:'Internet Basics',words:[
{id:'server',term:'Server',full:'服务器',pron:'/ˈsɜːrvər/',emoji:'🖥️',ph:'塞儿-哇',phTip:'像个永远在"塞满活儿"的伙计，随叫随到',zh:'服务器',def:'存储数据并向其他设备提供服务的计算机程序或硬件',story:'🏪 想象你开了一家 24 小时便利店，你就是 Server。顾客（Client）随时推门进来要东西，你永远不能关门说"我先睡会儿"。Server 就是这个永不下班、专门给别人提供服务的机器。',ex:'The website is hosted on a server in Singapore.',exZh:'这个网站托管在新加坡的服务器上。',rel:['Client','Cloud','Database','Host']},
{id:'client',term:'Client',full:'客户端',pron:'/ˈklaɪənt/',emoji:'📱',ph:'克-莱-恩特',phTip:'像个挑剔的"客人"，只管提需求',zh:'客户端',def:'向服务器发出请求并接收结果的设备或程序，如手机App、浏览器',story:'🍽️ 还是餐厅比喻：Client 是点菜的食客，Server 是厨师。食客只需开口说"我要一份数据"，不需要知道厨房怎么运作。你的手机、浏览器都是 Client，向服务器索要内容。',ex:'The mobile app is the client that talks to the backend server.',exZh:'手机App是与后端服务器通信的客户端。',rel:['Server','Browser','Frontend','App']},
{id:'api',term:'API',full:'Application Programming Interface',pron:'/ˌeɪ piː ˈaɪ/',emoji:'🔌',ph:'诶-批-爱',phTip:'诶，批量地让两个程序互相爱上对方',zh:'应用程序接口',def:'让不同软件之间能互相通信的一套规则和约定',story:'🍽️ 你去餐厅（网络服务）吃饭，不会跑进厨房自己炒菜。服务员（API）是传话的人——你说"给我天气数据"，服务员转身告诉厨房，再把结果端出来。API 就是这套"如何点餐、如何上菜"的规范。',ex:'The weather app uses an API to get real-time forecast data.',exZh:'天气应用通过 API 获取实时预报数据。',rel:['SDK','Endpoint','REST','Request']},
{id:'database',term:'Database',full:'数据库',pron:'/ˈdeɪtəbeɪs/',emoji:'🗄️',ph:'得-它-贝斯',phTip:'得到它的"贝斯"（基础），数据的地基',zh:'数据库',def:'有组织地存储大量数据，支持快速查询和更新的系统',story:'📚 想象一个巨大的图书馆，每本书（数据）都有编号，管理员（数据库系统）能在几毫秒内找到任意一本。没有数据库，网站登录时就没法知道"这个密码是否正确"，购物车也没法记住你选了什么。',ex:'All user accounts and passwords are stored in a secure database.',exZh:'所有用户账号和密码存储在安全的数据库中。',rel:['SQL','Query','Backend','Storage']},
{id:'frontend',term:'Frontend',full:'前端',pron:'/ˈfrɒntɛnd/',emoji:'🎨',ph:'弗朗-特-恩德',phTip:'在"前面"能看到的那一端',zh:'前端',def:'用户直接看到和操作的部分——界面、按钮、颜色、动画',story:'🏠 盖房子时，前端是装修和外立面——用户走进来看到的一切：墙色、家具、灯光。后端是水电管道，埋在墙里看不见。前端开发者负责让产品好看好用，用户感受到的体验都是前端的功劳。',ex:'The frontend developer redesigned the homepage to be more intuitive.',exZh:'前端开发者重新设计了主页，让它更直观易用。',rel:['Backend','UI','HTML','CSS','React']},
{id:'backend',term:'Backend',full:'后端',pron:'/ˈbækɛnd/',emoji:'⚙️',ph:'拜-克-恩德',phTip:'"背后"那一端，幕后英雄',zh:'后端',def:'用户看不到的部分，负责业务逻辑、数据存储和计算',story:'🎭 剧院舞台上演员光彩夺目（前端），后台的灯光师、音响师、道具组（后端）决定演出能否顺利进行。当你在网站下单，后端悄悄完成了：验证你的身份、检查库存、扣款、通知仓库——全部发生在你看不到的地方。',ex:'The backend handles all the payment processing and order management.',exZh:'后端处理所有支付流程和订单管理。',rel:['Frontend','Server','API','Database']},
{id:'cloud',term:'Cloud',full:'云计算',pron:'/klaʊd/',emoji:'☁️',ph:'克-劳-德',phTip:'像云一样飘在天上，随时可取',zh:'云计算',def:'通过网络租用计算资源（服务器、存储、软件），不用自己买硬件',story:'💡 过去开公司要自己买服务器放机房，像买发电机自己发电。云计算像接通了电网——你不用买发电机，按用量付费，随时增减。AWS、阿里云就是这样的"电网公司"，你的App跑在它们的机器上。',ex:'We moved all our data storage to the cloud to save costs.',exZh:'我们把所有数据存储迁移到云端以节省成本。',rel:['AWS','SaaS','Server','Storage']},
{id:'protocol',term:'Protocol',full:'协议',pron:'/ˈprəʊtəkɒl/',emoji:'📋',ph:'扑-柔-托-科',phTip:'扑上去柔和地"托"着数据传输',zh:'协议',def:'计算机之间通信时必须共同遵守的规则和标准',story:'🌍 想象两个不同国家的人通话：如果一个说中文一个说英文，什么都传不了。协议就是双方提前约定"我们用英文，按这个格式说话"。HTTP 是网页协议，TCP/IP 是互联网基础协议——没有它们，数据发出去对方根本听不懂。',ex:'HTTP is the protocol used to transfer web pages between servers and browsers.',exZh:'HTTP 是服务器和浏览器之间传输网页所用的协议。',rel:['HTTP','HTTPS','TCP/IP','API']},
{id:'cache',term:'Cache',full:'缓存',pron:'/kæʃ/',emoji:'⚡',ph:'凯什',phTip:'读音像"cash"（现金），把常用数据"存现"备用',zh:'缓存',def:'把常用数据临时保存在快速存储中，下次访问不用重新加载',story:'🧠 你每天上班走同一条路，不需要每次都掏出地图重新导航——这条路已经"缓存"在你脑子里了。网页缓存同理：第一次加载图片需要从服务器下载，之后浏览器把它存在本地，下次秒开。',ex:'Clear your browser cache if the website looks broken or outdated.',exZh:'如果网站显示异常或过时，清除浏览器缓存试试。',rel:['Browser','Performance','CDN','Memory']},
{id:'dns',term:'DNS',full:'Domain Name System',pron:'/ˌdiː ɛn ˈɛs/',emoji:'📖',ph:'迪-恩-艾斯',phTip:'互联网的"电话簿"',zh:'域名系统',def:'把人能记住的域名（google.com）翻译成机器能识别的 IP 地址',story:'📞 手机联系人里你存的是"妈妈"，不是"138xxxxxxxx"。DNS 就是互联网的联系人簿——你输入 google.com，DNS 悄悄把它翻译成 142.250.80.46（真实 IP），浏览器才知道该敲哪扇门。',ex:'A DNS error means your device cannot find the website\'s IP address.',exZh:'DNS 错误意味着你的设备找不到该网站的 IP 地址。',rel:['Domain','IP Address','URL','Server']},
{id:'ip',term:'IP Address',full:'Internet Protocol Address',pron:'/ˌaɪ ˈpiː ˈædrɛs/',emoji:'📍',ph:'爱-批 地址',phTip:'互联网上每台设备的"门牌号"',zh:'IP 地址',def:'网络中每台设备的唯一数字标识，如 192.168.1.1',story:'🏘️ 城市里每栋楼都有门牌号，快递员才能准确送货。IP 地址就是网络世界的门牌号——服务器有 IP，你的手机有 IP，数据包按照这个"门牌"找到正确的目的地。IPv4 是四段数字，IPv6 是新一代更长的格式。',ex:'Your device gets a new IP address every time you connect to a different Wi-Fi.',exZh:'每次连接不同 Wi-Fi，你的设备会获得一个新的 IP 地址。',rel:['DNS','Protocol','Router','Network']},
{id:'cdn',term:'CDN',full:'Content Delivery Network',pron:'/ˌsiː diː ˈɛn/',emoji:'🌍',ph:'си-迪-恩',phTip:'内容的"全球快递网络"',zh:'内容分发网络',def:'在全球多地部署服务器节点，让用户从最近的节点获取内容，加快速度',story:'🍕 一家只在北京有厨房的披萨店，送货到广州要3小时。CDN 就是在全国开分店——广州用户从广州节点取数据，北京用户从北京取。YouTube、Netflix 都靠 CDN 让全球用户都能流畅播放视频。',ex:'CDN ensures users around the world get fast loading speeds.',exZh:'CDN 确保全球用户都能获得快速的加载速度。',rel:['Server','Cache','Latency','Cloud']},
{id:'firewall',term:'Firewall',full:'防火墙',pron:'/ˈfaɪərwɔːl/',emoji:'🛡️',ph:'法-儿-沃',phTip:'像一堵"火墙"，挡住危险流量',zh:'防火墙',def:'监控并过滤网络流量，阻止未授权或有害的连接',story:'🚧 小区门口的保安亭——住户和快递可以进，陌生人要登记，可疑人员直接拦截。防火墙就是网络的"保安"，设置规则决定哪些流量能进，哪些必须滚开。公司防火墙能阻止黑客入侵也能屏蔽员工上某些网站。',ex:'The corporate firewall blocks access to social media during work hours.',exZh:'公司防火墙在工作时间屏蔽对社交媒体的访问。',rel:['Security','Network','Proxy','Encryption']},
{id:'https',term:'HTTPS',full:'HyperText Transfer Protocol Secure',pron:'/ˌeɪtʃ tiː tiː piː ɛs/',emoji:'🔒',ph:'H-T-T-P-S',phTip:'比 HTTP 多了个"S"——Safe，安全版本',zh:'安全超文本传输协议',def:'HTTP 的加密版本，用 SSL/TLS 加密传输数据，防止被截听',story:'💌 普通 HTTP 像发明信片——邮递员（中间人）能看到内容。HTTPS 像把信装进密封信封——即使被人截走，也看不到里面写什么。浏览器地址栏的🔒小锁就代表用了 HTTPS。网购、登录一定要认准它。',ex:'Always check for HTTPS before entering your password on a website.',exZh:'在网站输入密码前，务必确认地址栏有 HTTPS。',rel:['HTTP','SSL','Encryption','Security']},
{id:'encryption',term:'Encryption',full:'加密',pron:'/ɪnˈkrɪpʃən/',emoji:'🔐',ph:'英-克-瑞-普-申',phTip:'"把内容扭曲成只有持钥匙的人才能看懂的形态"',zh:'加密',def:'将数据转换为只有授权方才能解读的格式，保护信息安全',story:'🔏 古代间谍用密码本把"明天进攻"写成一串乱码，只有拿到同款密码本的人才能解读。现代加密用数学算法做同样的事——你的微信消息、银行交易都经过加密，即使被截获也是一堆乱码。',ex:'All messages in this app are protected with end-to-end encryption.',exZh:'该应用中所有消息均受端对端加密保护。',rel:['HTTPS','SSL','Security','Privacy']},
{id:'latency',term:'Latency',full:'延迟',pron:'/ˈleɪtənsi/',emoji:'⏱️',ph:'雷-腾-си',phTip:'"雷声"传到你耳边需要时间，延迟就是这段时间',zh:'延迟',def:'从发出请求到收到响应所用的时间，单位通常是毫秒（ms）',story:'🎮 打网游时你按下攻击键，角色过0.5秒才出手——这0.5秒就是延迟（Latency）。延迟越低，体验越流畅。实时通话、直播、游戏对延迟要求极高；下载大文件则更在乎带宽。',ex:'High latency makes video calls feel laggy and unresponsive.',exZh:'高延迟会让视频通话感觉卡顿、反应迟钝。',rel:['Bandwidth','Performance','CDN','Network']},
{id:'bandwidth',term:'Bandwidth',full:'带宽',pron:'/ˈbændwɪdθ/',emoji:'🚰',ph:'班-德-威斯',phTip:'"管道的宽度"——越宽，流量越大',zh:'带宽',def:'单位时间内网络能传输的最大数据量，决定网速上限',story:'🚰 带宽像水管的粗细——细管子（低带宽）一次只能流一点水，就算水压够（低延迟）也很慢。粗管子（高带宽）能同时冲满多个水桶。视频会议吃带宽，游戏更在乎延迟——两者不是一回事。',ex:'Streaming 4K video requires significantly more bandwidth than HD.',exZh:'播放 4K 视频所需的带宽远超 HD 视频。',rel:['Latency','Network','Speed','Data']},
{id:'proxy',term:'Proxy',full:'代理服务器',pron:'/ˈprɒksi/',emoji:'🕵️',ph:'扑-乐-克-西',phTip:'"替我出面"的那个人',zh:'代理',def:'在用户和目标服务器之间中转请求的中间服务器',story:'🕵️ 你不想直接去谈判，派一个代理人替你出面——对方不知道真正的买家是谁。网络代理同理：你的请求先到代理服务器，代理再帮你转发，目标网站只看到代理的地址，不知道你是谁。VPN 本质上也是一种代理。',ex:'The company uses a proxy server to filter employee internet traffic.',exZh:'公司使用代理服务器过滤员工的网络流量。',rel:['VPN','Firewall','Privacy','Network']},
{id:'port',term:'Port',full:'端口',pron:'/pɔːrt/',emoji:'🚪',ph:'破-特',phTip:'像建筑里的一扇扇"门"，各有专属编号',zh:'端口',def:'网络通信中用于区分不同服务的数字标识（0-65535）',story:'🏢 一栋大楼（服务器）有一个地址（IP），但里面有很多办公室（服务）。端口就是各办公室的房间号——80号是网页服务，443是HTTPS，22是远程登录。敲门时要说清楚找哪个房间，数据才能找到正确的服务。',ex:'Web servers typically listen on port 80 for HTTP and port 443 for HTTPS.',exZh:'Web 服务器通常在 80 端口监听 HTTP，在 443 端口监听 HTTPS。',rel:['Server','Network','Protocol','Firewall']},
{id:'auth',term:'Authentication',full:'身份验证',pron:'/ɔːˌθɛntɪˈkeɪʃən/',emoji:'🪪',ph:'奥-然-提-凯-申',phTip:'"你是谁"的验证',zh:'身份验证（认证）',def:'验证用户是否是其声称的那个人，常见方式：密码、指纹、验证码',story:'🏦 银行柜台：取款要出示身份证证明你是账户持有人——这就是认证（Authentication）。网站登录时输入密码，就是在向系统证明"我就是这个账号的主人"。',ex:'Two-factor authentication adds an extra layer of security to your account.',exZh:'双因素认证为你的账户增加了额外的安全层。',rel:['Authorization','Password','OAuth','Security']},
{id:'authz',term:'Authorization',full:'授权',pron:'/ˌɔːθərɪˈzeɪʃən/',emoji:'🔑',ph:'奥-撒-瑞-泽-申',phTip:'"你能干什么"的许可',zh:'授权',def:'确定已验证身份的用户有权执行哪些操作或访问哪些资源',story:'🏦 认证（Authentication）是"你是谁"，授权（Authorization）是"你能干什么"。进公司大门要刷工卡（认证）；进了大门，普通员工能去自己工位，但不能进服务器机房（授权）。两个概念经常混用，其实截然不同。',ex:'Even authenticated users need proper authorization to access admin features.',exZh:'即使通过身份验证的用户，也需要相应授权才能访问管理功能。',rel:['Authentication','Permissions','OAuth','Access Control']},
{id:'session',term:'Session',full:'会话',pron:'/ˈsɛʃən/',emoji:'⏳',ph:'塞-申',phTip:'"一次完整的来往"',zh:'会话',def:'用户与服务器之间一段时间内的持续交互，用于记住登录状态',story:'☕ 你走进咖啡馆，服务员认出你（登录），整个下午你点了三次咖啡，服务员都记得你（Session 保持）。你离开（退出登录），下次来服务员要重新认你。Session 就是这段"被记住"的时间窗口。',ex:'Your login session expires after 30 minutes of inactivity for security.',exZh:'出于安全考虑，无操作 30 分钟后登录会话将过期。',rel:['Cookie','Authentication','Token','State']},
{id:'cookie',term:'Cookie',full:'网络 Cookie',pron:'/ˈkʊki/',emoji:'🍪',ph:'曲-奇',phTip:'就是字面意思的"曲奇饼干"——网站留在你这的小纸条',zh:'Cookie（网络小文件）',def:'网站存在你浏览器里的小段数据，用来记住你的状态和偏好',story:'🍪 你去咖啡馆，第二次进门服务员递给你一张小卡片——上面写着"这位客人喜欢无糖拿铁，上次买过会员卡"。Cookie 就是网站放在你浏览器里的这张"小卡片"，记住你的登录状态、购物车、语言偏好等。',ex:'Accepting cookies allows websites to remember your preferences and login.',exZh:'接受 Cookie 允许网站记住你的偏好和登录状态。',rel:['Session','Storage','Browser','Privacy']},
{id:'request',term:'Request',full:'请求',pron:'/rɪˈkwɛst/',emoji:'📤',ph:'瑞-奎斯特',phTip:'"请求"就是字面意思，向服务器开口要东西',zh:'请求',def:'客户端向服务器发出的数据获取或操作指令',story:'📞 你打电话问"有没有A型血"——这就是一个 Request（请求）。服务器收到请求，处理后把结果发回给你（Response）。每次你刷新网页、提交表单、点击按钮，背后都在发出一个或多个 Request。',ex:'The app sends a request to the server every time you pull to refresh.',exZh:'每次下拉刷新时，应用都向服务器发送一个请求。',rel:['Response','API','HTTP','Client']},
{id:'response',term:'Response',full:'响应',pron:'/rɪˈspɒns/',emoji:'📥',ph:'瑞-斯-庞斯',phTip:'对请求的"回应"',zh:'响应',def:'服务器收到请求后返回的数据或结果',story:'📞 接上 Request 的例子：医院接到你的问询，告诉你"有，O型也有"——这就是 Response（响应）。Response 里包含状态码（200表示成功，404表示找不到，500表示服务器出错）和实际数据。',ex:'A 404 response means the server could not find the requested page.',exZh:'404 响应意味着服务器找不到请求的页面。',rel:['Request','HTTP','API','Status Code']},
{id:'url',term:'URL',full:'Uniform Resource Locator',pron:'/ˌjuː ɑːr ˈɛl/',emoji:'🔗',ph:'优-阿-艾',phTip:'互联网上每个页面的"家庭住址"',zh:'统一资源定位符（网址）',def:'互联网上每个资源的唯一地址，告诉浏览器去哪里找内容',story:'🏠 寄快递要写完整地址：省市区街道门牌号。URL 就是网络世界的完整地址：协议（https://）+ 域名（google.com）+ 路径（/search）+ 参数（?q=hello）。少了任何一部分，快递就送不到了。',ex:'Copy and paste the URL into your browser to open the shared page.',exZh:'把 URL 复制粘贴到浏览器即可打开分享的页面。',rel:['Domain','HTTP','Link','DNS']},
{id:'http',term:'HTTP',full:'HyperText Transfer Protocol',pron:'/ˌeɪtʃ tiː tiː ˈpiː/',emoji:'🌐',ph:'H-T-T-P',phTip:'四个字母，互联网最基础的"语言"',zh:'超文本传输协议',def:'浏览器和服务器之间传输网页内容的标准协议',story:'📬 你写了一封信（请求），按照一定格式投入邮筒，邮政系统（HTTP）负责传输，收件方按同样格式读信（响应）。HTTP 定义了信封格式、邮递规则，让全球数十亿设备能用同一套方式交换网页内容。',ex:'HTTP was created by Tim Berners-Lee to share documents between researchers.',exZh:'HTTP 由蒂姆·伯纳斯-李创建，最初用于研究人员之间共享文档。',rel:['HTTPS','URL','Protocol','Browser']},
{id:'json',term:'JSON',full:'JavaScript Object Notation',pron:'/ˈdʒeɪsɒn/',emoji:'📄',ph:'杰-森',phTip:'就是人名"Jason"的读法！一种数据格式',zh:'JSON',def:'一种轻量级的数据交换格式，人可读，机器也容易解析',story:'📋 API 返回数据时总要用一种双方都认识的"语言"。JSON 就是最通用的那种——用花括号和键值对组织信息，像这样：{"name":"张三","age":25}。前端后端都懂，几乎所有编程语言都支持。',ex:'The API returns user data in JSON format, which the app then displays.',exZh:'API 以 JSON 格式返回用户数据，应用再将其展示出来。',rel:['API','Data','Format','XML']},
{id:'loadbalancer',term:'Load Balancer',full:'负载均衡器',pron:'/loʊd ˈbælənsr/',emoji:'⚖️',ph:'楼-德 芭-兰-色',phTip:'像收银台调度员，"这边三号收银台请过来"',zh:'负载均衡器',def:'将大量网络请求分发到多台服务器，防止单台过载',story:'🏪 超市收银台：一个收银员排了100人的长队，旁边3个收银员却闲着。调度员（Load Balancer）出现了："3号、4号、5号也开始收！"大型网站同时面对千万用户，负载均衡器把请求分散给多台服务器，没有一台会被压垮。',ex:'The load balancer distributes traffic across five servers to ensure reliability.',exZh:'负载均衡器将流量分布到五台服务器，确保系统可靠运行。',rel:['Server','Scalability','Cloud','Traffic']},
{id:'router',term:'Router',full:'路由器',pron:'/ˈruːtər/',emoji:'📡',ph:'如-特',phTip:'像交通警察，指挥数据包走哪条路',zh:'路由器',def:'网络中负责将数据包转发到正确目的地的设备',story:'🚦 数据包在网络里旅行，每到一个岔路口就遇到一个路由器——路由器检查数据包的目的地址，决定"应该走左边这条路还是右边"。你家里的 WiFi 路由器把家庭网络和互联网连接起来，同时充当这个"交通指挥员"。',ex:'Your home router connects all your devices to the internet.',exZh:'你家的路由器将所有设备连接到互联网。',rel:['Network','IP Address','Protocol','Firewall']},
{id:'domain',term:'Domain',full:'域名',pron:'/dəˈmeɪn/',emoji:'🏷️',ph:'多-梅-因',phTip:'互联网上你的"品牌名"',zh:'域名',def:'人类可读的网站地址名称，如 google.com，背后对应服务器的 IP 地址',story:'🏢 公司名字（域名）和公司地址（IP）是两回事。你说"去腾讯总部"，导航帮你找到具体地址——DNS 帮域名翻译成 IP。好域名就像好店名，易记、易传播；差域名让人根本记不住你在哪里。',ex:'The company paid $5 million to buy the premium domain name.',exZh:'该公司花了500万美元购买这个高价值域名。',rel:['DNS','URL','HTTPS','IP Address']},
{id:'browser',term:'Browser',full:'浏览器',pron:'/ˈbraʊzər/',emoji:'🌐',ph:'布-劳-泽',phTip:'像在网络世界"浏览"的眼睛',zh:'浏览器',def:'用于访问和显示网页的软件，如 Chrome、Safari、Firefox',story:'🖼️ 浏览器是你探索互联网世界的"窗户"。它懂得把服务器返回的 HTML、CSS、JavaScript 代码解读成你看到的彩色网页。Chrome、Safari、Firefox 本质都是干这件事的，只是各有不同的解读细节和速度优化。',ex:'Chrome is the world\'s most widely used web browser.',exZh:'Chrome 是全球使用最广泛的网络浏览器。',rel:['HTML','HTTP','Cache','Cookie']}
]},

{id:1,emoji:'📱',color:'#FF6B6B',bg:'#FFE8E8',title:'产品与运营',sub:'Product & Growth',words:[
{id:'ux',term:'UX',full:'User Experience',pron:'/ˌjuː ˈɛks/',emoji:'✨',ph:'优-艾克斯',phTip:'"用户体验"的英文缩写，X代表体验（Experience）',zh:'用户体验',def:'用户在使用产品过程中的整体感受，包括易用性、情感和效率',story:'🛒 在超市购物的全程感受就是 UX：入口好不好找、货架标识清不清楚、结账是否顺畅、推车顺不顺手。产品的 UX 包括第一次打开App时是否困惑、完成一个任务要点几下、出错时有没有清晰提示。',ex:'Good UX design makes complex features feel simple and intuitive.',exZh:'好的 UX 设计让复杂功能感觉简单直观。',rel:['UI','Design','Research','Usability']},
{id:'ui',term:'UI',full:'User Interface',pron:'/ˌjuː ˈaɪ/',emoji:'🎨',ph:'优-爱',phTip:'"用户界面"，你眼睛看到的那一层',zh:'用户界面',def:'用户能看到和操作的所有视觉元素：按钮、图标、颜色、字体、布局',story:'🎨 UI 是穿在 UX 身上的衣服——衣服好不好看是 UI，穿着舒不舒适是 UX。同一个功能，用难看的灰色方块实现和用精心设计的彩色卡片实现，UX 可能一样，UI 天差地别。设计师常说"不要只追求好看的 UI，忽略了 UX"。',ex:'The UI was completely redesigned to feel modern and fresh.',exZh:'UI 被彻底重新设计，呈现出现代清新的感觉。',rel:['UX','Design','Frontend','Wireframe']},
{id:'mvp',term:'MVP',full:'Minimum Viable Product',pron:'/ˌɛm viː ˈpiː/',emoji:'🚀',ph:'M-V-P',phTip:'最小可行产品，不是"最有价值球员"！',zh:'最小可行产品',def:'用最少功能快速推出的产品版本，用来验证市场需求是否存在',story:'🚗 想造一辆车，MVP 不是先造"一个残缺的车轮"，而是先做一辆"能用的滑板车"——它能解决核心问题（代步），拿到真实用户反馈后再逐步升级。Dropbox 最初只是一个演示视频，用来验证"有没有人需要云同步"——这就是 MVP 思维。',ex:'We launched the MVP in three weeks to test if users actually needed this feature.',exZh:'我们在三周内推出了 MVP，测试用户是否真的需要这个功能。',rel:['Prototype','Iteration','Lean','Startup']},
{id:'abtest',term:'A/B Test',full:'A/B 测试',pron:'/ˌeɪ biː tɛst/',emoji:'🔬',ph:'A-B 测试',phTip:'A 组看版本A，B 组看版本B，数据说话',zh:'A/B 测试',def:'同时向不同用户展示两个版本，通过数据对比找出效果更好的方案',story:'🧪 大家争论按钮应该用蓝色还是红色，产品经理说"不争了，都上！"——50%用户看蓝按钮，50%看红按钮，两周后数据说红色点击率高20%。这就是 A/B 测试：用实验替代猜测，让数据做决策。',ex:'We ran an A/B test and found the shorter headline increased sign-ups by 15%.',exZh:'我们做了 A/B 测试，发现较短的标题让注册量提升了 15%。',rel:['Conversion','Analytics','Experiment','Data']},
{id:'conversion',term:'Conversion',full:'转化',pron:'/kənˈvɜːrʒən/',emoji:'🎯',ph:'肯-佛-日-恩',phTip:'把"看客"转化成"买家"',zh:'转化（率）',def:'用户完成目标行为（注册/购买/点击）的比例。转化率=完成人数÷总访问人数',story:'🏪 100人走进店里，最终3人掏钱买东西——转化率就是3%。电商对话率哪怕提升1%，年收入可能差百万。"提高转化率"是产品最重要的目标之一：减少步骤、降低门槛、消除顾虑，每一个细节都影响这个数字。',ex:'Simplifying the checkout process increased our conversion rate from 2% to 5%.',exZh:'简化结账流程让我们的转化率从 2% 提升到了 5%。',rel:['Funnel','CTA','Analytics','Revenue']},
{id:'funnel',term:'Funnel',full:'用户漏斗',pron:'/ˈfʌnəl/',emoji:'📊',ph:'法-奈',phTip:'像漏斗，进口大出口小，每层都在流失人',zh:'用户漏斗',def:'描述用户从接触产品到最终转化，每个环节都会流失一部分人的过程',story:'💧 漏斗最宽处：100万人看到广告；中间层：10万人点进来；再窄：1万人注册；最细处：1000人真正付费。每层都有"漏洞"，运营要做的就是找到哪层漏得最厉害，补上那个洞。',ex:'We identified a major drop-off in the second step of our sign-up funnel.',exZh:'我们发现注册漏斗第二步有大量用户流失。',rel:['Conversion','Retention','Analytics','Acquisition']},
{id:'retention',term:'Retention',full:'留存率',pron:'/rɪˈtɛnʃən/',emoji:'🧲',ph:'瑞-腾-申',phTip:'"留住"用户不流失的能力',zh:'留存率',def:'在特定时间后（如7天、30天）仍继续使用产品的用户比例',story:'🪣 一个漏底的桶，你不断往里加水（获取新用户），但水也在不断漏出去（用户流失）。留存率就是桶底有多"严"。次日留存40%意味着今天来了100个新用户，明天还剩40个在用。留存率是衡量产品是否有真实价值的核心指标。',ex:'Our 30-day retention rate improved significantly after we redesigned onboarding.',exZh:'重新设计新手引导后，我们的 30 日留存率显著提升。',rel:['Churn','DAU','Engagement','Funnel']},
{id:'dau',term:'DAU/MAU',full:'Daily/Monthly Active Users',pron:'/diː eɪ juː/',emoji:'👥',ph:'D-A-U',phTip:'日活/月活，衡量"真正在用"的人数',zh:'日/月活跃用户',def:'DAU=每天使用产品的独立用户数；MAU=每月使用的独立用户数',story:'📈 注册用户100万，听起来很多——但如果 DAU 只有1000，说明99.9%的用户注册后就再也没回来。DAU/MAU 的比值（粘性）才是真正的健康指标。微信的 DAU/MAU 接近100%，说明用户每天都在用；有些App的比值不到5%。',ex:'Our DAU grew from 10,000 to 50,000 in three months after the new feature launch.',exZh:'新功能上线后三个月，我们的日活从 1 万增长到 5 万。',rel:['Retention','MAU','Analytics','KPI']},
{id:'onboarding',term:'Onboarding',full:'新手引导',pron:'/ˈɒnbɔːrdɪŋ/',emoji:'👋',ph:'昂-鲍-丁',phTip:'"上船"——帮新乘客顺利登船不迷路',zh:'新手引导',def:'帮助新用户快速了解产品、完成首次关键操作的引导流程',story:'✈️ 坐飞机，空乘会在起飞前演示安全须知——这就是 Onboarding。好的 App Onboarding 在用户第一次打开时，用最少步骤帮他们完成一件"有价值的事"：发第一条消息、导入第一个联系人、看到第一条内容。让用户立刻感受到产品价值，他才会留下来。',ex:'A well-designed onboarding experience can double your day-one retention.',exZh:'精心设计的新手引导可以让次日留存率翻倍。',rel:['UX','Retention','Tutorial','Activation']},
{id:'kpi',term:'KPI',full:'Key Performance Indicator',pron:'/ˌkeɪ piː ˈaɪ/',emoji:'🎯',ph:'K-P-I',phTip:'关键绩效指标，团队最重要的那几个数字',zh:'关键绩效指标',def:'衡量目标达成情况的关键数据指标',story:'⚽ 足球教练说"本赛季目标：进球数30+，失球数少于15，联赛排名前三"——这三个就是 KPI。好的 KPI 必须是可量化、有时限、与目标直接相关的。模糊的"提高用户体验"不是 KPI，具体的"次日留存率达到40%"才是。',ex:'Our team\'s KPI this quarter is to reach 100,000 registered users.',exZh:'我们团队本季度的 KPI 是达到 10 万注册用户。',rel:['OKR','Metric','Analytics','Goal']},
{id:'okr',term:'OKR',full:'Objectives and Key Results',pron:'/ˌoʊ keɪ ˈɑːr/',emoji:'🏔️',ph:'O-K-R',phTip:'目标+关键结果，Google 推广的管理方法',zh:'目标与关键结果',def:'设定雄心勃勃的目标（Objective），并定义可量化的关键结果（Key Results）来衡量是否达成',story:'🧭 OKR 格式：O（目标）= 成为用户最喜爱的笔记应用；KR1 = App Store 评分达到4.8；KR2 = 月活增长50%；KR3 = NPS分数超过60。Google、Intel 都用这套方法对齐团队方向，OKR 不考核绩效，而是帮团队聚焦方向。',ex:'Our Q3 OKRs focus on improving product quality and reducing churn.',exZh:'我们 Q3 的 OKR 聚焦于提升产品质量和降低流失率。',rel:['KPI','Goal','Strategy','Management']},
{id:'sprint',term:'Sprint',full:'冲刺',pron:'/sprɪnt/',emoji:'🏃',ph:'斯-普-林特',phTip:'短跑冲刺，固定时间段内全力开发',zh:'Sprint（冲刺）',def:'敏捷开发中固定时长（通常1-2周）的迭代开发周期',story:'🏃 马拉松运动员不会从头跑到尾保持全速，但短跑运动员在100米内全力冲刺。软件开发的 Sprint 就是设定一个短期目标（2周内完成登录功能），全力冲刺，结束时展示成果，然后开始下一个 Sprint。',ex:'We completed the payment feature in the last two-week sprint.',exZh:'我们在上一个两周 Sprint 中完成了支付功能。',rel:['Agile','Backlog','Iteration','Scrum']},
{id:'backlog',term:'Backlog',full:'待办列表',pron:'/ˈbæklɒɡ/',emoji:'📝',ph:'拜-克-劳格',phTip:'"堆在背后的一堆事"',zh:'产品待办列表',def:'所有待开发功能和任务的优先级列表，按重要性排序',story:'📦 仓库里堆着各种待处理的货物——有些紧急（用户一直抱怨的Bug），有些重要但不紧急（新功能），有些可以等等（界面微调）。Backlog 就是这个"仓库清单"，产品经理的工作之一就是不断给清单里的项目重新排序和清理。',ex:'The engineering team has a backlog of 40 features waiting to be built.',exZh:'工程团队有 40 个功能等待开发的待办列表。',rel:['Sprint','Roadmap','Priority','Agile']},
{id:'wireframe',term:'Wireframe',full:'线框图',pron:'/ˈwaɪərfreɪm/',emoji:'📐',ph:'外-儿-弗-雷姆',phTip:'"线"组成的"框架"，设计草图',zh:'线框图',def:'只用线条和方块展示页面布局和功能结构的低保真原型，不含颜色和图片',story:'🏗️ 建筑师画蓝图时，先用简单的线条标出墙在哪、门在哪、窗在哪——不管颜色材质。Wireframe 就是产品的"建筑蓝图"：这里放标题、这里是按钮、这里显示列表。它快速、易改，用来确认功能逻辑而非视觉设计。',ex:'We showed the wireframe to users for feedback before starting visual design.',exZh:'在开始视觉设计之前，我们向用户展示线框图收集反馈。',rel:['Prototype','UI','UX','Design']},
{id:'prototype',term:'Prototype',full:'原型',pron:'/ˈprəʊtətaɪp/',emoji:'🔧',ph:'扑-柔-托-太普',phTip:'"原始版本"，可交互的演示',zh:'原型',def:'可交互的产品演示版本，用于测试设计方案和收集反馈，不含真实代码',story:'🎬 电影正式开拍前，导演会先拍"样片"——用低成本验证剧情方向、演员表现、镜头风格。原型就是产品的"样片"：可以点击、跳转、模拟交互，但背后没有真实数据和代码。用原型找问题，比写完代码再改要便宜得多。',ex:'We built a clickable prototype in Figma and tested it with 10 users.',exZh:'我们在 Figma 中制作了可点击的原型，并与 10 名用户进行了测试。',rel:['Wireframe','MVP','UX','Design']},
{id:'persona',term:'Persona',full:'用户画像',pron:'/pəˈsoʊnə/',emoji:'👤',ph:'坡-索-纳',phTip:'代表典型用户的"角色卡"',zh:'用户画像',def:'基于调研数据创建的典型用户虚构角色，帮助团队理解目标用户',story:'👤 产品团队说"我们为谁做这个产品？"——"小王，28岁，职场新人，每天通勤1小时，想用碎片时间学英语，手机是安卓，不太懂技术……"这就是一个 Persona。它帮团队做决策时保持一致：这个功能小王会用吗？这个流程小王能看懂吗？',ex:'We created three user personas based on interviews with 50 real customers.',exZh:'我们基于对 50 位真实客户的访谈，创建了三个用户画像。',rel:['UX','Research','Target User','Design']},
{id:'cta',term:'CTA',full:'Call to Action',pron:'/ˌsiː tiː ˈeɪ/',emoji:'👆',ph:'С-T-A',phTip:'"号召行动"，引导用户点击的那个按钮',zh:'行动号召',def:'引导用户执行特定行为的按钮、链接或文案，如"立即注册"、"免费试用"',story:'📣 街上的传单上写"扫码领取免费咖啡"——"扫码"就是 CTA。网页上的"立即注册"、"免费下载"、"开始体验"，App里的"发布"、"购买"、"关注"——每一个引导用户行动的元素都是 CTA。CTA 的措辞和颜色直接影响转化率。',ex:'Changing the CTA from "Submit" to "Get My Free Trial" doubled our sign-ups.',exZh:'将 CTA 从"提交"改成"获取免费试用"让注册量翻了一倍。',rel:['Conversion','UI','Marketing','Button']},
{id:'seo',term:'SEO',full:'Search Engine Optimization',pron:'/ˌɛs iː ˈoʊ/',emoji:'🔍',ph:'S-E-O',phTip:'让搜索引擎更容易"找到"你',zh:'搜索引擎优化',def:'通过优化网页内容和结构，让网站在搜索结果中排名更靠前',story:'🏆 Google 搜索"学英语"，结果第一页就10个位置。SEO 就是争夺这些黄金位置的艺术——好的标题、关键词、页面速度、外部链接都影响排名。排在第一页和第二页的流量差距可以是10倍。',ex:'Good SEO can bring thousands of visitors to your website every day without paid ads.',exZh:'好的 SEO 每天可以为你的网站带来数千访客，无需付费广告。',rel:['Analytics','Content','Traffic','Keywords']},
{id:'analytics',term:'Analytics',full:'数据分析',pron:'/ˌænəˈlɪtɪks/',emoji:'📊',ph:'安-纳-利-提-克斯',phTip:'"分析数据"，用数字讲故事',zh:'数据分析',def:'收集、处理和解读用户行为数据，用于指导产品决策',story:'🔍 Analytics 就像给产品装上"摄像头"——记录用户在哪里点了什么、停留多久、从哪个页面离开。有了这些数据，你就能做数据驱动的决策，而不是靠感觉。Google Analytics、Amplitude、Mixpanel 都是常用的分析工具。',ex:'Analytics showed that 80% of users dropped off at the payment step.',exZh:'数据分析显示，80% 的用户在支付步骤流失。',rel:['Data','KPI','Conversion','Funnel']},
{id:'bouncerate',term:'Bounce Rate',full:'跳出率',pron:'/baʊns reɪt/',emoji:'🏃',ph:'班斯 雷特',phTip:'"弹开"的比率——进来就走',zh:'跳出率',def:'只浏览一个页面就离开网站的用户比例，高跳出率通常说明内容与用户期望不符',story:'🚪 100人推开门走进来，80人扫了一眼立刻转身离开，只有20人继续往里走——跳出率就是80%。电商网站跳出率高意味着广告吸引来的人和实际内容不匹配。不同类型的页面正常跳出率差异很大：博客文章可以接受80%，商品详情页超过60%就要警惕了。',ex:'Our blog has a high bounce rate because readers find the answer and immediately leave.',exZh:'我们博客的跳出率很高，因为读者找到答案后立刻就离开了。',rel:['Retention','Analytics','UX','Traffic']},
{id:'churn',term:'Churn Rate',full:'流失率',pron:'/tʃɜːrn reɪt/',emoji:'🕳️',ph:'切-恩 雷特',phTip:'"像牛奶分离一样"，用户从产品中"分离"出去',zh:'流失率',def:'在特定时间内停止使用产品的用户比例，留存率的反面',story:'🪣 你有100个付费用户，每月有5个取消订阅——月流失率5%。看起来不多？一年后只剩54个！复利效应让流失率变得非常危险。SaaS 公司通常要把月流失率控制在2%以下才能健康增长。',ex:'We reduced monthly churn from 8% to 3% by improving customer support.',exZh:'通过改善客户支持，我们将月流失率从 8% 降至 3%。',rel:['Retention','DAU','Subscription','LTV']},
{id:'nps',term:'NPS',full:'Net Promoter Score',pron:'/ˌɛn piː ˈɛs/',emoji:'❤️',ph:'N-P-S',phTip:'"净推荐值"，一道题测出用户有多爱你',zh:'净推荐值',def:'通过"你有多大可能把这个产品推荐给朋友？（0-10）"来量化用户忠诚度的指标',story:'💬 9-10分的人是推荐者（Promoters），7-8分是中立者，0-6分是批评者（Detractors）。NPS = 推荐者% - 批评者%。苹果的 NPS 超过70，是最高的之一；一般产品能达到30就很好了。这一道题浓缩了用户对整个产品体验的态度。',ex:'Our NPS jumped from 20 to 55 after we launched the new customer support system.',exZh:'推出新客户支持系统后，我们的 NPS 从 20 跃升到 55。',rel:['Retention','Satisfaction','Analytics','Customer']},
{id:'featureflag',term:'Feature Flag',full:'功能开关',pron:'/ˈfiːtʃər flæɡ/',emoji:'🚩',ph:'费-切 弗莱格',phTip:'"旗子"控制功能开关，想开就开想关就关',zh:'功能开关',def:'允许在不重新部署代码的情况下，动态开关特定功能的技术机制',story:'🚦 新功能开发好了，但还不确定效果——先只对10%的用户开启。发现问题？一键关掉，所有用户都退回旧版，不需要紧急发版。Feature Flag 就是这个"灯开关"，让你可以精细控制谁能看到什么功能，是做灰度测试的标配工具。',ex:'We use feature flags to roll out new features gradually to 10% of users first.',exZh:'我们用功能开关先向 10% 的用户逐步推出新功能。',rel:['A/B Test','Deploy','Rollout','Engineering']},
{id:'beta',term:'Beta',full:'Beta 测试',pron:'/ˈbiːtə/',emoji:'🧪',ph:'贝-塔',phTip:'希腊字母第二位，正式版之前的测试版',zh:'Beta 测试 / 公测',def:'向部分真实用户开放产品测试，在正式发布前发现问题',story:'🎮 游戏公司在正式发售前邀请玩家参与"内测"——这就是 Beta 测试。真实用户在真实环境中使用，能发现内部测试没发现的问题：某种特殊手机卡、某个地区网络慢、某类用户根本不理解某个功能。',ex:'We invited 1,000 users to join the beta program before the official launch.',exZh:'正式发布前，我们邀请了 1000 名用户参加 Beta 测试。',rel:['MVP','Testing','Launch','Feedback']},
{id:'milestone',term:'Milestone',full:'里程碑',pron:'/ˈmaɪlstəʊn/',emoji:'🏁',ph:'迈-尔-斯-通',phTip:'旅途中的"路边石碑"，标记重要节点',zh:'里程碑',def:'项目中具有重要意义的关键时间节点或阶段完成标志',story:'🛣️ 古代旅途中，每隔一里就立一块石头（里程碑）告诉旅人走了多远、还有多远。项目里的里程碑是"完成注册功能"、"上线Beta版"、"获得第1000个付费用户"——是整个团队对齐进度的锚点。',ex:'Reaching 1 million users was a major milestone for our team.',exZh:'达到 100 万用户是我们团队的一个重要里程碑。',rel:['Roadmap','Sprint','Goal','Planning']},
{id:'stakeholder',term:'Stakeholder',full:'利益相关者',pron:'/ˈsteɪkhəʊldər/',emoji:'🤝',ph:'斯-泰-克-侯-德',phTip:'"持有利益股份"的人，项目成败影响到的所有人',zh:'利益相关者',def:'对项目结果有利益关系或决策影响力的所有人',story:'🏢 一个产品决策——"把免费功能改成付费"——影响到谁？用户（可能流失）、销售（多一个卖点）、客服（面对更多投诉）、CEO（增加收入）、工程师（要开发付费墙）……这些都是 Stakeholder，重大决策前都要考虑他们的诉求。',ex:'We presented the roadmap to all key stakeholders before getting final approval.',exZh:'在获得最终批准之前，我们向所有关键利益相关者展示了路线图。',rel:['Management','Decision','Communication','Project']},
{id:'painpoint',term:'Pain Point',full:'痛点',pron:'/peɪn pɔɪnt/',emoji:'😣',ph:'佩因-波因特',phTip:'"痛"的"点"，用户最难受的那个问题',zh:'痛点',def:'用户在使用过程中感到不满、不便或困扰的具体问题',story:'😤 "每次找外卖菜单要翻好久""打车等了20分钟还没来""银行转账要填12个字段"——这些就是痛点。好产品的起点往往是精准击中一个痛点。找痛点最好的方法：直接问用户"你最烦什么"，然后认真听。',ex:'The app was built to solve the pain point of managing too many passwords.',exZh:'这款应用就是为了解决管理太多密码这个痛点而构建的。',rel:['UX','User Research','Problem','Value']}
]},

{id:2,emoji:'⚙️',color:'#3AAFA9',bg:'#E0F7F6',title:'开发与工程',sub:'Dev & Engineering',words:[
{id:'repo',term:'Repository',full:'代码仓库',pron:'/rɪˈpɒzɪtɔːri/',emoji:'📦',ph:'瑞-坡-兹-托-瑞',phTip:'"存放东西的地方"，代码的图书馆',zh:'代码仓库（Repo）',def:'存储项目所有代码、历史记录和版本的地方，常用 GitHub 管理',story:'📚 想象一个图书馆不仅存着书，还记录了每本书每次修改的历史——谁在第几页加了什么、删了什么、为什么改。Repository 就是这样的代码图书馆。"帮我看一下这个 repo"是开发者最常说的话之一。',ex:'Please push your code to the repository before submitting the pull request.',exZh:'请在提交 pull request 之前将代码推送到仓库。',rel:['Git','GitHub','Branch','Commit']},
{id:'deploy',term:'Deploy',full:'部署',pron:'/dɪˈplɔɪ/',emoji:'🚀',ph:'滴-普-洛伊',phTip:'像军队"部署"到前线，代码上线出征',zh:'部署',def:'把开发完成的代码发布到服务器，让真实用户能够访问和使用',story:'🏭 工厂里生产完了产品（代码写好了），装车运到商店上架（部署），顾客才能买（用户才能用）。没有部署，再好的代码也只在开发者电脑里。"我们今天下午部署"就是"今天下午更新上线"。',ex:'We deploy new updates every Friday afternoon after thorough testing.',exZh:'经过充分测试后，我们每周五下午部署新的更新。',rel:['Release','CI/CD','Server','GitHub']},
{id:'sdk',term:'SDK',full:'Software Development Kit',pron:'/ˌɛs diː ˈkeɪ/',emoji:'🧰',ph:'S-D-K',phTip:'"开发工具箱"，拿来就能用',zh:'软件开发工具包',def:'开发者用来构建特定平台或服务应用的工具、代码库和文档集合',story:'🧰 你要装修家里，不用自己去买锤子、锯子、螺丝刀——租一套工具箱（SDK）就能干活了。集成微信支付 SDK，开发者不用自己写支付协议，调用几个函数就搞定。SDK 是平台送给开发者的"豪华工具箱"。',ex:'We integrated the payment SDK to add Alipay and WeChat Pay in one day.',exZh:'我们集成了支付 SDK，一天内就加上了支付宝和微信支付。',rel:['API','Library','Framework','Plugin']},
{id:'framework',term:'Framework',full:'框架',pron:'/ˈfreɪmwɜːrk/',emoji:'🏗️',ph:'弗-雷姆-沃克',phTip:'"建筑框架"，房子的骨架搭好了，填充内容就行',zh:'框架',def:'提供基础结构、规则和工具的代码骨架，帮开发者更快构建应用',story:'🏠 造房子时先搭好钢筋框架，再砌砖填充。React、Vue 是前端框架，Django、Spring 是后端框架——它们把通用的问题（路由、状态管理、数据库连接）都解决好了，你只需要专注写自己的业务逻辑。',ex:'React is the most popular frontend framework for building modern web apps.',exZh:'React 是构建现代 Web 应用最流行的前端框架。',rel:['Library','SDK','React','Vue']},
{id:'git',term:'Git',full:'分布式版本控制系统',pron:'/ɡɪt/',emoji:'🌿',ph:'给特',phTip:'"代码时光机"，任意时刻都能回到过去',zh:'Git（版本控制工具）',def:'追踪代码修改历史的工具，支持多人协作，可回滚到任意历史版本',story:'⏰ 假设你写文章时每隔一小时自动保存一个版本，写坏了可以回到三小时前——这就是 Git 的核心能力。不同的是，Git 还能让多人同时修改同一份文件，自动合并各人的改动。"git commit"是开发者每天说最多的动词之一。',ex:'Use git commit to save your changes with a descriptive message.',exZh:'用 git commit 保存更改，并写上清晰的说明。',rel:['GitHub','Repository','Branch','Commit']},
{id:'debug',term:'Debug',full:'调试',pron:'/ˌdiːˈbʌɡ/',emoji:'🐛',ph:'迪-巴格',phTip:'"除虫"，找出并修复程序里的Bug',zh:'调试',def:'找出并修复程序中错误（Bug）的过程',story:'🪲 1940年代，一只飞蛾卡进计算机电路导致故障，工程师把它取出来贴在日志本上，写下"发现实际虫子（bug）"——Bug 和 Debug 的词源就在这里。现代调试是在代码里找逻辑错误，"我在 debug"就是"我在找哪行代码写错了"。',ex:'I spent three hours debugging why the login button wasn\'t responding.',exZh:'我花了三小时调试登录按钮为何没有响应。',rel:['Bug','Testing','Error','Fix']},
{id:'cicd',term:'CI/CD',full:'Continuous Integration / Continuous Deployment',pron:'/ˌsiː aɪ siː ˈdiː/',emoji:'🔄',ph:'СI/CD',phTip:'"持续"自动测试和部署，代码一提交就自动跑',zh:'持续集成/持续部署',def:'自动化地测试和部署代码的流程，让更新更快更安全地上线',story:'🏭 流水线工厂：原材料进来，自动检测质量（CI），合格的自动包装发货（CD）。代码推送后，CI/CD 流水线自动：运行所有测试、检查代码风格、构建产品、部署到服务器——全程无需人工操作，大大减少"手动发版翻车"的概率。',ex:'Our CI/CD pipeline automatically runs 500 tests before every deployment.',exZh:'我们的 CI/CD 流水线在每次部署前自动运行 500 个测试。',rel:['Deploy','Testing','Automation','DevOps']},
{id:'opensource',term:'Open Source',full:'开源',pron:'/ˈoʊpən sɔːrs/',emoji:'🌍',ph:'欧-彭-索斯',phTip:'"公开源码"，代码对所有人开放',zh:'开源',def:'源代码对所有人公开，任何人都可以查看、使用、修改和贡献',story:'📖 想象一家餐厅不仅卖菜，还把菜谱全都公开——任何人都能学、改、改良后再分享。Linux、Python、Android 都是开源的。开源社区是互联网最神奇的协作形式：全球数百万开发者共同维护，创造出许多最重要的技术基础设施。',ex:'VS Code is a free, open source code editor with millions of contributors.',exZh:'VS Code 是一个免费的开源代码编辑器，拥有数百万贡献者。',rel:['GitHub','License','Community','Fork']},
{id:'container',term:'Container',full:'容器',pron:'/kənˈteɪnər/',emoji:'📦',ph:'肯-太-纳',phTip:'"集装箱"技术，应用打包带走，到哪都能跑',zh:'容器（技术）',def:'把应用及其所有依赖打包在一起的轻量级虚拟化技术，环境一致、随处可运行',story:'🚢 集装箱发明前，不同形状的货物装卸极麻烦；集装箱统一了标准，换哪条船都能装。Docker 容器做同样的事：把应用和它需要的所有环境打包，在开发者电脑上能跑，在测试服务器上能跑，在生产服务器上也完全一样——解决了"在我机器上明明好用"的永恒难题。',ex:'Docker containers ensure the app runs identically on every developer\'s machine.',exZh:'Docker 容器确保应用在每台开发者机器上运行方式完全相同。',rel:['Docker','Kubernetes','Deploy','Microservices']},
{id:'refactor',term:'Refactor',full:'重构',pron:'/ˌriːˈfæktər/',emoji:'🔨',ph:'瑞-法-克特',phTip:'"重新整理"，功能不变，质量提升',zh:'重构',def:'在不改变程序功能的前提下，改善代码的内部结构和质量',story:'🏠 房子用了10年，管道开始老化，重新布线——住户感觉不到变化（功能没变），但房子更安全可靠（质量提升）。代码重构同理：函数名更清晰、逻辑更简单、去掉重复代码——用户感受不到，但下次改需求时开发速度快了一倍。',ex:'We spent a full sprint refactoring the payment module to improve reliability.',exZh:'我们花了整整一个 Sprint 重构支付模块，以提升可靠性。',rel:['Technical Debt','Clean Code','Optimization','Review']},
{id:'rest',term:'REST',full:'Representational State Transfer',pron:'/rɛst/',emoji:'🌐',ph:'雷斯特',phTip:'像"休息"一样简洁，API 设计的主流风格',zh:'REST（API设计风格）',def:'一种设计网络API的架构风格，通过HTTP方法（GET/POST/PUT/DELETE）操作资源',story:'📮 寄信、收信、改信、撕信——对信件的四种操作。REST API 把互联网上所有数据想象成"资源"，用四个动词操作：GET（取）、POST（创建）、PUT（修改）、DELETE（删）。URL 是资源地址，HTTP 方法是动作，组合起来就能表达任何操作。',ex:'Most modern APIs follow REST conventions for predictable and consistent behavior.',exZh:'大多数现代 API 遵循 REST 规范，以实现可预测和一致的行为。',rel:['API','HTTP','JSON','Endpoint']},
{id:'webhook',term:'Webhook',full:'网络钩子',pron:'/ˈwɛbhʊk/',emoji:'🪝',ph:'维伯-胡克',phTip:'"钩子"挂在那，事件发生时自动触发',zh:'Webhook',def:'当特定事件发生时，服务自动向你指定的URL发送通知的机制',story:'🔔 你不用一直盯着快递进度，而是留下手机号——快递到了自动打电话给你。Webhook 就是这个"到了叫我"机制。GitHub 代码合并时，自动通知 CI/CD 系统开始构建；支付成功时，自动通知你的服务器发货——这些都是 Webhook。',ex:'We set up a webhook to receive notifications whenever a new payment is made.',exZh:'我们设置了一个 Webhook，在每次新支付时自动接收通知。',rel:['API','Event','Integration','Automation']},
{id:'async',term:'Async',full:'Asynchronous（异步）',pron:'/ˈeɪsɪŋk/',emoji:'⚡',ph:'诶-新克',phTip:'"异步"，不用等上一件事完成就能干下一件',zh:'异步（Async）',def:'不需要等待上一个操作完成就可以继续执行后续代码的编程方式',story:'☕ 你走进咖啡馆点了一杯咖啡，不用站在柜台等5分钟——你先去找位子、打开电脑干活，咖啡好了叫你（回调）。同步是：点完等到拿到才能走。异步让程序不会"卡在等待"上，性能大幅提升。',ex:'The app uses async calls so the UI stays responsive while data is loading.',exZh:'应用使用异步调用，以便在数据加载时界面保持响应。',rel:['Callback','Promise','Thread','Performance']},
{id:'middleware',term:'Middleware',full:'中间件',pron:'/ˈmɪdəlweər/',emoji:'🔗',ph:'咪-德-尔-维尔',phTip:'"夹在中间"的软件层',zh:'中间件',def:'在请求到达目标处理逻辑前，对请求进行拦截和处理的软件层',story:'🏢 公司大门有保安（验证证件）、前台（登记信息）、电梯管理员（分配楼层）——你到达目的地前经过了三个"中间"环节。服务器的中间件做类似的事：身份验证、日志记录、数据格式转换、权限检查——都在请求真正被处理之前完成。',ex:'Authentication middleware checks every request for a valid token before processing.',exZh:'身份验证中间件在处理每个请求之前检查其是否有有效的 token。',rel:['Backend','API','Authentication','Request']},
{id:'ratelimiting',term:'Rate Limiting',full:'速率限制',pron:'/reɪt ˈlɪmɪtɪŋ/',emoji:'🚦',ph:'雷特-利-咪-亭',phTip:'"限速"，防止有人疯狂刷接口',zh:'速率限制',def:'限制用户在单位时间内能发出请求次数的机制，防止滥用和过载',story:'📱 某人发现API没有限制，写了个脚本每秒发送1000个请求——服务器直接崩了。Rate Limiting 就是门口的保安："每分钟最多100个请求，超了就等等"。免费用户每分钟60次，付费用户每分钟1000次——这也是商业模式的一部分。',ex:'Our free API tier has a rate limit of 100 requests per minute.',exZh:'我们的免费 API 版本有每分钟 100 次请求的速率限制。',rel:['API','Security','Quota','Performance']},
{id:'oauth',term:'OAuth',full:'Open Authorization',pron:'/ˈoʊˌɔːθ/',emoji:'🔑',ph:'欧-奥斯',phTip:'"用第三方账号登录"背后的标准协议',zh:'OAuth（开放授权）',def:'允许用户授权第三方应用访问其在另一平台账户信息的标准协议',story:'🔑 你用"微信登录"某个App，不需要把微信密码告诉那个App——微信发给它一张"授权卡"，说"这个用户允许你知道他的昵称和头像"。OAuth 就是这套"发授权卡"的标准流程，安全、通用、不暴露真实密码。',ex:'OAuth allows users to sign in with Google or Apple without creating a new password.',exZh:'OAuth 允许用户用 Google 或 Apple 账号登录，无需创建新密码。',rel:['Authentication','Authorization','API','Security']},
{id:'pullrequest',term:'Pull Request',full:'拉取请求',pron:'/pʊl rɪˈkwɛst/',emoji:'🔀',ph:'普-尔 瑞-奎斯特',phTip:'"请求把我的代码拉进主分支"',zh:'Pull Request（PR）',def:'开发者完成功能后，请求把代码合并进主分支的流程，通常需要代码审查',story:'📝 你写了一篇文章想加入百科全书，不能直接改——你提交申请（Pull Request），编辑审查（Code Review）：逻辑对不对、格式符不符合规范、有没有错别字。通过后才合并进正文。PR 是团队协作的核心流程，也是代码质量的守门员。',ex:'Please open a pull request and assign it to two reviewers before merging.',exZh:'请在合并之前提交 pull request 并指派两位审阅者。',rel:['Git','Repository','Code Review','Branch']},
{id:'branch',term:'Branch',full:'分支',pron:'/brɑːntʃ/',emoji:'🌿',ph:'布-兰奇',phTip:'像树枝一样分叉，互不干扰',zh:'分支',def:'从主代码线分叉出来的独立开发线，可以安全地开发新功能不影响主版本',story:'🌳 大树的主干是稳定运行的产品代码，要开发新功能就从主干长出一条新树枝（branch）——在这里随便折腾，不影响主干。功能做好了测试通过，再把这根树枝合并回主干。这是团队多人同时开发不打架的关键。',ex:'Always create a new branch for each feature to keep the main branch clean.',exZh:'每个功能都创建新分支，保持主分支的整洁。',rel:['Git','Merge','Pull Request','Repository']},
{id:'algorithm',term:'Algorithm',full:'算法',pron:'/ˈælɡərɪðəm/',emoji:'🧮',ph:'艾-哥-瑞-嗦姆',phTip:'"艾哥瑞嗦姆"，解决问题的步骤配方',zh:'算法',def:'解决特定问题的一系列明确步骤和规则',story:'🍳 菜谱就是算法：第一步洗菜，第二步切丝，第三步热锅，第四步下油……每步都明确，按顺序执行就能得到结果。搜索引擎排名算法、推荐算法、导航路径算法——都是"解决问题的配方"，只不过更复杂、更精妙。',ex:'Google\'s search algorithm considers hundreds of factors to rank web pages.',exZh:'谷歌的搜索算法考虑数百个因素来对网页进行排名。',rel:['Data Structure','Complexity','ML','Logic']},
{id:'scalability',term:'Scalability',full:'可扩展性',pron:'/ˌskeɪləˈbɪlɪti/',emoji:'📈',ph:'斯-凯-拉-比-利-提',phTip:'"能扩展"的能力，用户暴增也不崩',zh:'可扩展性',def:'系统在用户量或数据量增长时，通过增加资源保持性能的能力',story:'🏟️ 一个小饭馆只有10张桌子，某天来了1000人直接挤爆。有"可扩展性"的设计：高峰期能加桌子（横向扩展），或者换更大的厨房（纵向扩展）。Instagram 早期缺乏扩展性设计，用户暴增后服务器天天崩——这是创业公司的经典教训。',ex:'We re-architected the system to handle 100x more users without performance issues.',exZh:'我们重新设计了系统架构，能处理100倍用户量而不影响性能。',rel:['Load Balancer','Microservices','Cloud','Performance']},
{id:'microservices',term:'Microservices',full:'微服务',pron:'/ˈmaɪkrəʊˌsɜːvɪsɪz/',emoji:'🧩',ph:'迈-克-柔-瑟-维-西兹',phTip:'"微小的"多个服务，各自独立运行',zh:'微服务',def:'把一个大型应用拆分为多个小型独立服务，各自部署、扩展和维护',story:'🍱 大食堂（单体应用）：厨师、收银、配餐都在一个大房间，一个环节出问题全体停工。微服务像美食广场：中餐、日料、奶茶各自独立，一家关门不影响其他家。Netflix、Uber 都拆成了几百个微服务，能独立扩展最忙的那个模块。',ex:'Netflix uses hundreds of microservices that can be updated independently.',exZh:'Netflix 使用数百个微服务，每个都可以独立更新。',rel:['API','Container','Docker','Scalability']},
{id:'devops',term:'DevOps',full:'Development + Operations',pron:'/ˈdɛvɒps/',emoji:'♾️',ph:'戴-夫-奥普斯',phTip:'"开发"和"运维"合体，消除两者之间的墙',zh:'DevOps',def:'打通开发（Dev）和运维（Ops）的文化、工具和实践体系，实现更快更稳定的软件交付',story:'🤝 过去开发团队和运维团队互相"甩锅"——开发说"我代码没问题"，运维说"你代码在服务器上跑不了"。DevOps 文化消除这堵墙：开发者需要理解部署，运维需要理解代码，工具链打通，CI/CD 自动化——快速交付、快速恢复。',ex:'DevOps practices helped us reduce deployment time from days to minutes.',exZh:'DevOps 实践帮助我们将部署时间从几天缩短到几分钟。',rel:['CI/CD','Deploy','Automation','Culture']},
{id:'techdebt',term:'Technical Debt',full:'技术债务',pron:'/ˈtɛknɪkəl dɛt/',emoji:'💸',ph:'泰克-尼-课 戴特',phTip:'"借了技术的债"，早晚要还',zh:'技术债务',def:'为了快速完成而采用的不完美解决方案，长期积累后需要花更多时间"还债"',story:'💳 刷信用卡（技术债）解决了当下的资金问题，但利息一直在跑。代码里的临时方案、复制粘贴的重复逻辑、没有写的测试——这些都是技术债。短期能快速上线，但债积多了，加任何新功能都变得极慢，最终必须花大量时间"还债"（重构）。',ex:'Years of technical debt made adding a simple feature take three weeks.',exZh:'多年的技术债务使添加一个简单功能就花了三周时间。',rel:['Refactor','Clean Code','Maintenance','Architecture']},
{id:'endpoint',term:'Endpoint',full:'API 端点',pron:'/ˈɛndpɔɪnt/',emoji:'📍',ph:'恩德-波因特',phTip:'"终点站"，API 的具体访问地址',zh:'API 端点',def:'API 中一个特定功能对应的URL地址，客户端通过访问端点来调用该功能',story:'🏢 公司有很多部门，每个部门有自己的内线电话。API 就是公司，Endpoint 就是各部门的分机号："/users"是用户部门，"/orders"是订单部门，"/payments"是支付部门。你打不同的分机号，就能联系到对应的功能。',ex:'The endpoint GET /api/users returns a list of all registered users.',exZh:'端点 GET /api/users 返回所有注册用户的列表。',rel:['API','REST','URL','Request']},
{id:'dependency',term:'Dependency',full:'依赖',pron:'/dɪˈpɛndənsi/',emoji:'🔗',ph:'滴-彭-丹-西',phTip:'"依赖"别人才能运行',zh:'依赖',def:'软件项目需要借助的外部库、框架或服务，没有它就无法正常运行',story:'🍳 你做蛋炒饭，需要鸡蛋、大米、葱。这三样就是你食谱的"依赖"——少了任何一样就做不出来。软件的依赖是代码库（npm包、pip库），项目启动时必须先安装所有依赖。依赖太多有时候是问题：某个小依赖出漏洞，整个项目都要更新。',ex:'This project has over 200 dependencies listed in the package.json file.',exZh:'这个项目在 package.json 文件中列出了超过 200 个依赖。',rel:['npm','Library','Package','Framework']},
{id:'bug',term:'Bug',full:'程序错误',pron:'/bʌɡ/',emoji:'🐞',ph:'巴格',phTip:'字面意思就是虫子，最古老的技术术语之一',zh:'Bug（程序错误）',def:'导致程序行为与预期不符的错误或缺陷',story:'🪲 1947年，Grace Hopper 的团队在 Harvard Mark II 计算机里真的发现了一只飞蛾——机器故障的原因。他们把飞蛾贴进日志，写上"First actual case of bug being found"。Bug 这个词就这样成了"程序错误"的代名词，沿用至今。',ex:'A critical bug in the payment system caused incorrect charges for 500 users.',exZh:'支付系统中的一个严重 Bug 导致 500 名用户被错误收费。',rel:['Debug','Testing','Fix','QA']},
{id:'version',term:'Version Control',full:'版本控制',pron:'/ˈvɜːrʒən kənˈtroʊl/',emoji:'📋',ph:'佛-日-恩 肯-柔',phTip:'"给代码拍快照"，随时能回到任意历史版本',zh:'版本控制',def:'追踪文件变化历史、支持多人协作的系统，Git 是最主流的版本控制工具',story:'📸 每次你改了代码，版本控制系统就拍一张"快照"存档，记录谁改了什么、为什么改。三个月后，你突然发现引入了一个Bug——版本控制让你能回到三个月前的快照，找出问题所在。团队协作时，它还能自动合并不同人的修改。',ex:'Version control makes it possible to undo any change and trace who made it.',exZh:'版本控制使得撤销任何更改并追踪是谁做的成为可能。',rel:['Git','Repository','Branch','Commit']}
]},
{id:3,emoji:'🤖',color:'#FF9F43',bg:'#FFF3E0',title:'AI 基础',sub:'AI Fundamentals',words:[
{id:'ai',term:'AI',full:'人工智能',pron:'/ˌeɪ ˈaɪ/',emoji:'🤖',ph:'诶-爱',phTip:'"Artificial Intelligence"缩写，让机器像人一样"思考"',zh:'人工智能',def:'让计算机系统能够执行通常需要人类智能才能完成的任务的技术',story:'🧠 人类花了数万年进化出智能，AI 试图用代码和数据在几十年内复制这一过程。从下棋的 AlphaGo，到写代码的 Copilot，到对话的 ChatGPT——AI 已经悄悄嵌入你每天使用的每一个产品。它不是科幻，是现实。',ex:'AI is transforming industries from healthcare to finance and creative work.',exZh:'AI 正在改变从医疗到金融再到创意工作的各个行业。',rel:['Machine Learning','Model','LLM','Algorithm']},
{id:'ml',term:'Machine Learning',full:'机器学习',pron:'/məˈʃiːn ˈlɜːrnɪŋ/',emoji:'📚',ph:'么-勋 乐-宁',phTip:'"机器"自己从数据中"学习"规律',zh:'机器学习',def:'让计算机通过大量数据自动学习规律，而无需人工编写每一条规则',story:'🐟 教孩子认鱼：传统编程是写规则"有鳞的、鳍的是鱼"；机器学习是给他看10万张鱼的图片，让他自己总结规律。ML 算法从数据里发现模式——垃圾邮件过滤、人脸识别、推荐算法，背后都是它。',ex:'Machine learning models can detect cancer from medical scans with high accuracy.',exZh:'机器学习模型能以高准确率从医学扫描图中检测癌症。',rel:['Deep Learning','Training','Dataset','AI']},
{id:'dl',term:'Deep Learning',full:'深度学习',pron:'/diːp ˈlɜːrnɪŋ/',emoji:'🌊',ph:'滴普 乐-宁',phTip:'"深层"神经网络的学习方式',zh:'深度学习',def:'使用多层神经网络进行学习的机器学习分支，擅长处理图像、语音、文本等复杂数据',story:'🏔️ 普通ML是爬小山，Deep Learning是攀珠穆朗玛——层数越多，能处理的复杂度越高。识别猫脸：第一层识别边缘，第二层识别形状，第三层识别耳朵眼睛，最后一层说"是猫！"。这种逐层抽象的能力让AI突破了很多过去做不到的任务。',ex:'Deep learning powers voice assistants, self-driving cars, and image generation.',exZh:'深度学习驱动着语音助手、自动驾驶汽车和图像生成。',rel:['Neural Network','Machine Learning','Model','GPU']},
{id:'nn',term:'Neural Network',full:'神经网络',pron:'/ˈnjʊərəl ˈnɛtwɜːrk/',emoji:'🕸️',ph:'纽-热 内特-沃克',phTip:'模仿大脑神经元的数学网络结构',zh:'神经网络',def:'模仿生物神经元连接方式构建的计算网络，是深度学习的核心结构',story:'🧬 你的大脑有860亿个神经元，通过突触相连。AI 的神经网络是它的数学版：每个"神经元"接收输入、做计算、传输信号给下一层。虽然远比生物大脑简单，但足以让机器学会说话、看图、写诗、下棋。',ex:'The neural network learned to recognize handwritten digits with 99% accuracy.',exZh:'该神经网络以99%的准确率学会了识别手写数字。',rel:['Deep Learning','Layer','Weights','Activation']},
{id:'model',term:'Model',full:'模型',pron:'/ˈmɒdəl/',emoji:'🗿',ph:'莫-抖',phTip:'训练出来的AI"大脑"，装着所有学到的知识',zh:'模型（AI模型）',def:'经过训练后能够对新数据进行预测或生成内容的数学结构，是AI的核心产出物',story:'📦 模型就是AI的"成品大脑"。你用大量数据训练它，调整数百亿参数，最终得到一个能对新问题给出答案的东西。GPT-4、Claude、Gemini——这些都是模型。训练要花几千万美元，但训练好之后，每次推理（运行）只需几分钱。',ex:'OpenAI released a new model that outperforms all previous versions on benchmarks.',exZh:'OpenAI 发布了一个在基准测试上超越所有以往版本的新模型。',rel:['Training','Inference','LLM','Parameter']},
{id:'training',term:'Training',full:'训练',pron:'/ˈtreɪnɪŋ/',emoji:'🏋️',ph:'垂-宁',phTip:'让AI"健身"，反复喂数据直到学会',zh:'训练（模型训练）',def:'向AI模型反复输入大量数据，通过调整内部参数使其逐渐提升预测准确率的过程',story:'🏋️ AI训练和人类练肌肉一样：反复举铁（看数据）→ 肌肉撕裂（出错）→ 修复（调整参数）→ 变更强。训练GPT-4据说用了超过25000块GPU跑了好几个月，耗电量堪比一座小城市。训练完成的模型才能上线服务用户。',ex:'Training the model on a trillion tokens of text took three months and cost millions.',exZh:'在万亿token的文本上训练模型花了三个月，耗资数百万美元。',rel:['Dataset','Epoch','Loss Function','GPU']},
{id:'dataset',term:'Dataset',full:'数据集',pron:'/ˈdeɪtəsɛt/',emoji:'🗃️',ph:'戴-特-赛特',phTip:'AI的"教科书"，训练用的全部数据',zh:'数据集',def:'用于训练、验证或测试AI模型的结构化数据集合',story:'📚 没有数据，AI什么都不是。ImageNet 有1400万张标注图片，让深度学习革命成为可能。Common Crawl 包含数百TB的网页文本，是大语言模型的主食。数据集的质量和规模，直接决定AI能力的上限。"垃圾进，垃圾出"——数据比算法更重要。',ex:'The model was trained on a dataset of 500 billion tokens scraped from the web.',exZh:'该模型在从网络抓取的5000亿token数据集上训练。',rel:['Training','Data Quality','Benchmark','Annotation']},
{id:'token',term:'Token',full:'词元/令牌',pron:'/ˈtoʊkən/',emoji:'🪙',ph:'托-肯',phTip:'"硬币"，AI处理文本的最小单位',zh:'Token（词元）',def:'AI语言模型处理文本的最小单位，可以是一个词、半个词或一个字符',story:'✂️ AI不是按字母或单词读文本，而是按Token。"hello"是1个token，"unhappiness"可能拆成3个（"un"+"happi"+"ness"）。中文通常每个字是1个token。ChatGPT收费就是按token计算——输入+输出token总数决定账单。Context Window就是能同时处理的最大token数量。',ex:'"ChatGPT" is two tokens: "Chat" and "GPT". Longer texts cost more tokens.',exZh:'"ChatGPT"是两个token："Chat"和"GPT"。更长的文本消耗更多token。',rel:['LLM','Context Window','Tokenization','Prompt']},
{id:'prompt',term:'Prompt',full:'提示词',pron:'/prɒmpt/',emoji:'💬',ph:'普罗姆普特',phTip:'给AI的"指令/问题"，输出质量的关键',zh:'Prompt（提示词）',def:'用户输入给AI模型的文本指令或问题，是AI生成输出的起点',story:'🎭 你对话剧演员说"演一个悲剧角色"——这就是prompt。你对AI说"用莎士比亚风格写一封失恋信"——这也是prompt。Prompt的质量直接决定AI输出的质量：模糊的问题得到模糊的答案，清晰有上下文的指令得到精准的结果。这催生了一整个职业：Prompt Engineer。',ex:'A well-crafted prompt can dramatically improve the quality of AI-generated content.',exZh:'精心设计的提示词可以显著提升AI生成内容的质量。',rel:['LLM','System Prompt','Prompt Engineering','Context']},
{id:'llm',term:'LLM',full:'大型语言模型',pron:'/ˌɛl ɛl ˈɛm/',emoji:'🧬',ph:'艾-艾-艾姆',phTip:'"Large Language Model"，当代AI的核心技术',zh:'大型语言模型',def:'在海量文本数据上训练、参数量巨大、能理解和生成自然语言的AI模型',story:'🌊 LLM是本次AI浪潮的核心。GPT、Claude、Gemini、Llama——都是LLM。它们通过预测"下一个词"的任务，在无数文本上训练，意外地学会了推理、编码、翻译、创作。参数量从GPT-1的1.17亿，到GPT-4估计超过1万亿，规模越大能力越强（但也更贵）。',ex:'LLMs like GPT-4 and Claude can write code, summarize documents, and answer complex questions.',exZh:'GPT-4和Claude等LLM能够编写代码、总结文档并回答复杂问题。',rel:['Transformer','Token','Prompt','Foundation Model']},
{id:'inference',term:'Inference',full:'推理/推断',pron:'/ˈɪnfərəns/',emoji:'⚡',ph:'因-弗-伦斯',phTip:'训练好的模型"跑起来"回答问题的过程',zh:'推理（AI推理）',def:'使用已训练完成的AI模型对新输入进行处理并生成输出的过程',story:'🏭 训练是"建工厂"，推理是"开工生产"。你每次问ChatGPT一个问题，就是一次推理：模型接收你的prompt，经过数百层神经网络计算，吐出一个回答。推理比训练便宜得多，但全球每天数亿次推理请求，累计耗电量也极为惊人。',ex:'Inference on large models requires powerful GPUs even though it\'s cheaper than training.',exZh:'即使比训练便宜，在大型模型上进行推理也需要强大的GPU。',rel:['Model','Training','GPU','Latency']},
{id:'param',term:'Parameter',full:'参数',pron:'/pəˈræmɪtər/',emoji:'🔢',ph:'帕-让-米-特',phTip:'AI模型里储存"知识"的数字，越多越聪明（通常）',zh:'参数（模型参数）',def:'神经网络中可学习的数值，训练过程中不断调整，最终编码了模型学到的所有知识',story:'💾 模型参数是AI的"记忆格子"。GPT-3有1750亿个参数，每个都是一个浮点数，共同编码了模型从海量文本中学到的所有知识和规律。更多参数≈更大记忆容量≈通常更强能力，但也意味着更大存储空间和更慢速度。"几百亿参数"是现在描述模型规模的标准方式。',ex:'GPT-3 has 175 billion parameters, each fine-tuned during training to encode knowledge.',exZh:'GPT-3拥有1750亿个参数，每个都在训练中被精调以编码知识。',rel:['Weights','Model','Training','Scale']},
{id:'hallucination',term:'Hallucination',full:'幻觉',pron:'/həˌluːsɪˈneɪʃən/',emoji:'👻',ph:'哈-路-西-内-讯',phTip:'AI自信地"胡说八道"，像产生幻觉一样',zh:'幻觉（AI幻觉）',def:'AI语言模型以自信的口吻生成看似合理但实际错误或虚假信息的现象',story:'🎭 问ChatGPT某位教授的论文——它可能煞有介事地编出五篇不存在的论文，连DOI都给你。这就是幻觉：模型不会说"我不知道"，而是用统计规律"合理编造"看起来正确的答案。AI律师曾引用幻觉出的虚假判例提交法庭，法官大怒。用AI时永远要验证关键信息。',ex:'The AI hallucinated three academic papers that don\'t actually exist, complete with fake citations.',exZh:'AI幻觉出了三篇实际上不存在的学术论文，还附上了虚假引用。',rel:['LLM','Grounding','RAG','Reliability']},
{id:'nlp',term:'NLP',full:'自然语言处理',pron:'/ˌɛn ɛl ˈpiː/',emoji:'💬',ph:'恩-艾-皮',phTip:'"Natural Language Processing"，让机器理解人类语言',zh:'自然语言处理',def:'让计算机能够理解、解析和生成人类自然语言（文字和语音）的AI分支',story:'🗣️ 机器语言是0和1，人类语言充满歧义、情感和上下文。"苹果很好吃"和"苹果股价下跌"——同一个词，截然不同的含义。NLP就是教会机器区分这种差异的学科。从翻译到语音识别到情感分析到ChatGPT——都是NLP的应用。LLM的崛起让NLP进入了新纪元。',ex:'NLP techniques allow chatbots to understand customer intent and respond appropriately.',exZh:'NLP技术使聊天机器人能够理解客户意图并做出适当回应。',rel:['LLM','Tokenization','Language Model','Text Analysis']},
{id:'cv',term:'Computer Vision',full:'计算机视觉',pron:'/kəmˈpjuːtər ˈvɪʒən/',emoji:'👁️',ph:'肯-皮-特 维-澹',phTip:'让机器"看懂"图像和视频',zh:'计算机视觉',def:'让计算机从图像或视频中提取信息、识别内容的AI技术',story:'📸 你扫一眼就知道照片里是猫还是狗，是朋友还是陌生人。计算机视觉教会机器做同样的事——只不过用像素值和卷积神经网络。工厂质检、自动驾驶、人脸解锁、医学影像诊断、以图搜图——都是CV的战场。',ex:'Computer vision systems can detect manufacturing defects that human eyes might miss.',exZh:'计算机视觉系统能检测到人眼可能遗漏的制造缺陷。',rel:['Deep Learning','Image Recognition','CNN','AI']},
{id:'genai',term:'Generative AI',full:'生成式AI',pron:'/ˌdʒɛnərətɪv eɪ aɪ/',emoji:'✨',ph:'杰-内-若-提夫 诶爱',phTip:'"生成"内容的AI，不只是分析，还能创作',zh:'生成式AI',def:'能够生成新内容（文本、图像、音频、视频、代码等）而不只是分类或预测的AI系统',story:'🎨 AI 从"判断"进化到了"创作"。过去的AI：这张图是猫还是狗？现在的生成式AI：给我画一只穿宇航服的猫。ChatGPT写文章、Midjourney画图、Sora生成视频、GitHub Copilot写代码——这一波"生成式AI革命"正在重塑创意行业。',ex:'Generative AI tools can create marketing copy, images, and videos in seconds.',exZh:'生成式AI工具可以在几秒钟内创建营销文案、图像和视频。',rel:['LLM','Diffusion Model','Foundation Model','Creative AI']},
{id:'foundation',term:'Foundation Model',full:'基础模型',pron:'/faʊnˈdeɪʃən ˈmɒdəl/',emoji:'🏛️',ph:'芳-得-讯 莫-抖',phTip:'超大预训练模型，是各种AI应用的"地基"',zh:'基础模型',def:'在海量通用数据上预训练、可通过微调适配各种下游任务的大规模AI模型',story:'🏗️ 盖楼不用每次从零挖地基。Foundation Model就是地基：Anthropic、OpenAI、Google花几亿美元预训练一个超大模型，其他人在上面盖自己的楼（微调出医疗AI、法律AI、客服AI……）。GPT-4、Claude、Gemini都是Foundation Model，是整个AI应用生态的基础设施。',ex:'Companies fine-tune foundation models to build specialized AI for their specific use cases.',exZh:'公司对基础模型进行微调，为其特定用例构建专用AI。',rel:['Pre-training','Fine-tuning','LLM','Transfer Learning']},
{id:'transformer',term:'Transformer',full:'Transformer 架构',pron:'/trænsˈfɔːrmər/',emoji:'⚙️',ph:'垂-斯-霍-么',phTip:'2017年横空出世的神经网络架构，改变了AI世界',zh:'Transformer',def:'2017年Google提出的神经网络架构，基于注意力机制，是现代LLM的核心结构',story:'📄 2017年Google发了一篇论文《Attention Is All You Need》，从此改变了AI历史。Transformer用"注意力机制"代替了之前的循环神经网络，能更好地理解长文本的全局关系。GPT、BERT、Claude、Gemini……所有现代LLM都建立在Transformer之上。T in ChatGPT stands for Transformer。',ex:'The Transformer architecture introduced in 2017 became the foundation of all modern LLMs.',exZh:'2017年引入的Transformer架构成为了所有现代LLM的基础。',rel:['Attention Mechanism','LLM','BERT','GPT']},
{id:'tokenization',term:'Tokenization',full:'分词/词元化',pron:'/ˌtoʊkənɪˈzeɪʃən/',emoji:'✂️',ph:'托-肯-耐-泽-讯',phTip:'把文本切成AI能处理的"小块"',zh:'Tokenization（分词）',def:'将原始文本切分为模型可处理的最小单元（token）的过程',story:'🍕 比萨不是整块塞进嘴，要切片。Tokenization就是把文本切片：把"I love NLP"切成["I", " love", " NLP"]，把中文"深度学习"切成["深","度","学","习"]（或["深度","学习"]，取决于分词方式）。不同的Tokenizer切法不同，影响token数量，进而影响费用和上下文长度。',ex:'Different tokenizers split the same text into different numbers of tokens, affecting cost.',exZh:'不同的分词器将相同文本切分成不同数量的token，影响费用。',rel:['Token','LLM','Vocabulary','BPE']},
{id:'overfit',term:'Overfitting',full:'过拟合',pron:'/ˌoʊvərˈfɪtɪŋ/',emoji:'📝',ph:'欧-唯-菲-听',phTip:'死记硬背考试题，换题就不会了',zh:'过拟合',def:'模型在训练数据上表现极好，但在新数据上表现很差，说明它"死记"而非"理解"',story:'📖 有学生把历年高考题全背下来，但换个题型就傻眼——这就是过拟合。AI模型过拟合：把训练集的每个样本都"记住"了，包括噪声和异常值，导致在真实数据上一塌糊涂。解决方法：更多数据、正则化、Dropout……让模型学规律而非死记答案。',ex:'The model overfit the training data and failed to generalize to real-world examples.',exZh:'该模型对训练数据过拟合，无法泛化到真实世界的样本。',rel:['Underfitting','Regularization','Training','Validation']},
{id:'gd',term:'Gradient Descent',full:'梯度下降',pron:'/ˈɡreɪdiənt dɪˈsɛnt/',emoji:'⛷️',ph:'格雷-第-恩特 滴-森特',phTip:'AI"下山找最低点"的优化方法',zh:'梯度下降',def:'通过计算损失函数的梯度并沿着梯度反方向调整参数，使模型错误率逐渐降低的优化算法',story:'⛰️ 想象你在山顶，蒙眼找山谷（最低点=最低误差）。每次感受脚下坡度（梯度），往最陡的下坡方向迈一步。反复迭代，最终到达山谷。这就是梯度下降——AI训练的核心优化算法。步子太大会错过山谷，太小永远到不了——这是"学习率"需要调的原因。',ex:'Gradient descent updates model weights thousands of times per training step.',exZh:'梯度下降在每个训练步骤中更新模型权重数千次。',rel:['Loss Function','Learning Rate','Backpropagation','Optimization']},
{id:'pretrain',term:'Pre-training',full:'预训练',pron:'/priːˈtreɪnɪŋ/',emoji:'🎒',ph:'普瑞-垂-宁',phTip:'先大量"通识教育"，再专科培训',zh:'预训练',def:'在大规模通用数据集上训练模型，使其获得通用知识和能力，为后续微调做准备',story:'🎓 大学通识教育（数学、语文、历史都学）= 预训练。读完通识，再选专业深造 = 微调。GPT用数千亿网页文本做预训练，学会语言规律和大量世界知识，这才是它什么都会聊的原因。预训练成本极高，微调相对便宜——所以商业模式是：大公司做预训练，小公司做微调。',ex:'Pre-training on internet-scale text gives LLMs broad knowledge before task-specific fine-tuning.',exZh:'在互联网规模文本上的预训练使LLM在特定任务微调前就具备广泛知识。',rel:['Fine-tuning','Foundation Model','Transfer Learning','Self-supervised']},
{id:'transfer',term:'Transfer Learning',full:'迁移学习',pron:'/ˈtrænsɜːr ˈlɜːrnɪŋ/',emoji:'🔄',ph:'垂斯-弗 乐-宁',phTip:'把学会的技能"迁移"到新任务上',zh:'迁移学习',def:'将在一个任务上训练好的模型知识应用到另一个相关任务上，大幅减少所需数据和计算资源',story:'🏊 游泳好手学冲浪——不用从零学平衡感和水感，已有技能迁移过来。AI迁移学习同理：ImageNet上训练的视觉模型，迁移到医学影像检测，只需少量医学图片微调，就能超过从头训练的专用模型。这让小团队也能用上顶级AI能力。',ex:'Transfer learning lets startups build powerful AI using only thousands of examples, not billions.',exZh:'迁移学习让初创公司只需数千个样本而非数十亿个就能构建强大AI。',rel:['Pre-training','Fine-tuning','Foundation Model','Domain Adaptation']},
{id:'supervised',term:'Supervised Learning',full:'监督学习',pron:'/ˈsuːpərvɪzd ˈlɜːrnɪŋ/',emoji:'👨‍🏫',ph:'苏-泼-瓦伊兹德 乐-宁',phTip:'有"标准答案"的学习方式',zh:'监督学习',def:'使用带有正确标签的训练数据来训练模型，让模型学会从输入预测正确输出',story:'📝 老师给你1000道题，每道都附答案——你对答案改错，反复练习。这是监督学习：给AI大量"输入→正确输出"的配对数据（猫的图片→标签"猫"），让它学会规律。垃圾邮件识别、房价预测、医学诊断——大多数实用ML任务都用监督学习。代价：需要大量人工标注数据。',ex:'Supervised learning requires thousands of labeled examples to train an accurate model.',exZh:'监督学习需要数千个标注样本来训练出准确的模型。',rel:['Unsupervised Learning','Reinforcement Learning','Label','Annotation']},
{id:'rl',term:'Reinforcement Learning',full:'强化学习',pron:'/ˌriːɪnˈfɔːrsmənт ˈlɜːrnɪŋ/',emoji:'🎮',ph:'瑞-因-佛-斯-门特 乐-宁',phTip:'像玩游戏，靠"奖励和惩罚"学习',zh:'强化学习',def:'AI通过与环境交互，依据奖励信号不断试错来学习最优策略的方法',story:'🕹️ 你不教小孩怎么走路，只给他奖励（没摔倒）和惩罚（摔了）——他自己摸索出走路策略。强化学习同理：AlphaGo靠RL下棋，没人教它招式，只有胜负奖励。RLHF（人类反馈强化学习）让ChatGPT学会"符合人类偏好"的回答方式。',ex:'Reinforcement learning allowed AlphaGo to surpass human performance through self-play.',exZh:'强化学习使AlphaGo通过自我对弈超越了人类水平。',rel:['RLHF','Reward Model','Policy','Agent']},
{id:'loss',term:'Loss Function',full:'损失函数',pron:'/lɒs ˈfʌŋkʃən/',emoji:'📉',ph:'洛斯 放-可-讯',phTip:'衡量AI答错了多少的"评分标准"',zh:'损失函数',def:'衡量模型预测结果与真实答案之间差距的数学函数，训练时通过最小化损失来优化模型',story:'🎯 射箭训练：教练不只说"射了"，还量"偏了多少厘米"——这个距离就是Loss。AI训练时，每次预测后计算损失（答案和正确答案的差距），然后用梯度下降把损失往最小优化。损失越小，模型越准。训练曲线上Loss不断下降，是模型"在学习"的直接证明。',ex:'The training loss decreased from 2.4 to 0.3 over 100,000 training steps.',exZh:'训练损失在10万个训练步骤中从2.4降至0.3。',rel:['Gradient Descent','Training','Optimization','Evaluation']},
{id:'benchmark',term:'Benchmark',full:'基准测试',pron:'/ˈbɛntʃmɑːrk/',emoji:'🏆',ph:'本奇-马克',phTip:'AI界的"统一考试"，用来比较不同模型的能力',zh:'基准测试',def:'用标准化数据集和任务评估和比较AI模型能力的测试体系',story:'🏅 你怎么知道GPT-4比GPT-3强？用Benchmark！MMLU测通识知识，HumanEval测编程，GSM8K测数学，HELM综合评估——这些是AI界的"高考"。各家大模型发布时都会晒Benchmark成绩单。但Benchmark也有问题：模型可能"刷题"（在测试集上过拟合），高分不等于真实能力强。',ex:'The new model achieved state-of-the-art results on five major AI benchmarks.',exZh:'该新模型在五个主要AI基准测试上取得了最先进的成绩。',rel:['Evaluation','Dataset','MMLU','Leaderboard']},
{id:'attention',term:'Attention Mechanism',full:'注意力机制',pron:'/əˈtɛnʃən ˈmɛkənɪzəm/',emoji:'🔍',ph:'阿-腾-讯 迈-肯-尼-姆',phTip:'让AI"选择性关注"最重要的词',zh:'注意力机制',def:'使模型在处理每个词时能够动态关注输入序列中其他相关词的机制，是Transformer的核心',story:'👁️ 读"银行倒闭了，股价暴跌"——你理解"银行"时自然联系到"倒闭"和"股价"，忽略无关词。注意力机制让AI做同样的事：计算每对词之间的相关性权重，理解长文本中的依赖关系。这就是为什么Transformer能理解"苹果很好吃，因为它很甜"中"它"指的是"苹果"。',ex:'The attention mechanism allows the model to connect "it" to "the cat" across a long sentence.',exZh:'注意力机制使模型能够在长句子中将"它"与"那只猫"联系起来。',rel:['Transformer','Self-attention','Context Window','LLM']},
{id:'epoch',term:'Epoch',full:'训练轮次',pron:'/ˈiːpɒk/',emoji:'🔁',ph:'伊-坡克',phTip:'把所有训练数据"过一遍"叫一个Epoch',zh:'Epoch（训练轮次）',def:'AI训练中将完整训练数据集遍历一次的过程，通常需要多个Epoch才能完成训练',story:'📖 把一本书从头到尾读一遍 = 1个Epoch。AI训练通常需要读数遍（多个Epoch）才能学好。Epoch太少：没学够；Epoch太多：死记硬背（过拟合）。实践中要监控验证集Loss，在最合适的Epoch停下来——早停（Early Stopping）。',ex:'Training for 10 epochs with early stopping prevented the model from overfitting.',exZh:'训练10个epoch并配合早停防止了模型过拟合。',rel:['Training','Overfitting','Batch','Iteration']},
{id:'weights',term:'Weights',full:'权重',pron:'/weɪts/',emoji:'⚖️',ph:'唯-茨',phTip:'神经网络里存储"知识"的数字',zh:'权重',def:'神经网络连接中的可学习参数，决定信号传递的强弱，训练过程中不断调整',story:'🎛️ 调音台上的推子——调高（权重大）这个信号，调低（权重小）那个信号，最终混出最好的音效。神经网络的权重决定每个神经元的信号有多强。训练就是自动调这几十亿个推子，让输出尽可能接近正确答案。权重保存下来，就是"模型文件"。',ex:'Loading a pre-trained model means loading billions of pre-optimized weight values.',exZh:'加载预训练模型意味着加载数十亿个预先优化的权重值。',rel:['Parameter','Training','Gradient Descent','Model']}
]},
{id:4,emoji:'🚀',color:'#9B59B6',bg:'#F5EEF8',title:'AI 进阶',sub:'AI Advanced',words:[
{id:'agent',term:'Agent',full:'AI智能体',pron:'/ˈeɪdʒənt/',emoji:'🕵️',ph:'诶-剑特',phTip:'"代理人"，能自主行动、完成任务的AI',zh:'AI Agent（智能体）',def:'能够感知环境、自主规划并执行多步骤任务的AI系统，不只回答问题，而是主动完成工作',story:'🤖 问ChatGPT问题，它回答——这是助手。让Agent订机票，它自己搜航班、对比价格、填写表单、完成预订——这是Agent。Agent的关键能力：使用工具（搜索、执行代码、调用API）、多步规划、自主决策。2024年是"Agent元年"，各大科技公司都在押注这个方向。',ex:'The AI agent autonomously searched the web, analyzed results, and wrote a research report.',exZh:'AI智能体自主搜索网络、分析结果并撰写了研究报告。',rel:['Tool Use','Multi-agent','Autonomous','Orchestration']},
{id:'rag',term:'RAG',full:'检索增强生成',pron:'/ræɡ/',emoji:'📖',ph:'瑞格',phTip:'"Retrieval-Augmented Generation"，给AI接上实时知识库',zh:'RAG（检索增强生成）',def:'让AI在生成回答前先从知识库中检索相关信息，结合检索结果再生成答案的技术',story:'📚 LLM的知识是训练时冻结的——问它今天的新闻，它不知道。RAG是解法：用户提问→先从实时数据库检索相关文档→把文档塞给LLM→LLM基于这些"参考资料"回答。你公司的客服Bot读自家产品文档，就是RAG。既能利用LLM的推理能力，又能访问最新知识。',ex:'RAG allows chatbots to answer questions about your company\'s internal documents accurately.',exZh:'RAG使聊天机器人能够准确回答关于公司内部文档的问题。',rel:['Vector Database','Embedding','Hallucination','Retrieval']},
{id:'embedding',term:'Embedding',full:'向量嵌入',pron:'/ɪmˈbɛdɪŋ/',emoji:'🗺️',ph:'因-贝-丁',phTip:'把文字变成数字坐标，相似的词"住"在附近',zh:'向量嵌入',def:'将文本、图像等数据转换为高维数值向量的技术，使语义相似的内容在向量空间中距离更近',story:'🌍 把全球城市放到地图上——北京和上海在亚洲，靠在一起；纽约和洛杉矶在美洲，也靠在一起。Embedding就是为词语画这样一张"意义地图"："猫"和"狗"在向量空间里距离很近（都是宠物），和"量子物理"距离很远。这让AI能做语义搜索：找意思相近的，不只是字面匹配。',ex:'Semantic search uses embeddings to find documents similar in meaning, not just keywords.',exZh:'语义搜索使用向量嵌入找到意义相似的文档，而不只是关键词匹配。',rel:['Vector Database','Semantic Search','RAG','Similarity']},
{id:'finetune',term:'Fine-tuning',full:'微调',pron:'/faɪn ˈtuːnɪŋ/',emoji:'🎛️',ph:'法因-图宁',phTip:'在大模型基础上"精调"，专攻特定领域',zh:'微调',def:'在预训练好的基础模型上，使用特定领域数据进行进一步训练，使模型更好地适应特定任务',story:'🎻 世界级小提琴手（预训练模型）转行拉中国民乐——不用从头学音乐，只需针对性练几个月民乐技巧（微调）。企业拿GPT微调出医学助手、法律助手、客服机器人——数据少、成本低，但效果显著。Fine-tuning让每个团队都能拥有自己的"专属AI"。',ex:'We fine-tuned the base model on medical records to create a specialized diagnostic assistant.',exZh:'我们在医疗记录上对基础模型进行微调，创建了专业诊断助手。',rel:['Pre-training','Transfer Learning','LoRA','RLHF']},
{id:'context',term:'Context Window',full:'上下文窗口',pron:'/ˈkɒntɛkst ˈwɪndəʊ/',emoji:'🪟',ph:'肯-文斯特 温-多',phTip:'AI一次能"看到"多少文字的窗口大小',zh:'上下文窗口',def:'AI模型在单次对话中能够处理的最大文本量（以token计），决定模型能记住多少上下文',story:'📖 你和朋友聊了3小时，但他只能记住最近10分钟说的话——这就是Context Window。早期GPT只有4k token（约3000字），现在Claude能处理200k token（约15万字，整本小说）。窗口越大，AI越能理解长文档、记住长对话。但大窗口意味着更多计算，更贵。',ex:'Claude\'s 200k context window lets it analyze an entire novel in one session.',exZh:'Claude的20万token上下文窗口让它能在一次对话中分析整本小说。',rel:['Token','LLM','Memory','Attention']},
{id:'multimodal',term:'Multimodal',full:'多模态',pron:'/ˌmʌltiˈmoʊdəl/',emoji:'👁️‍🗨️',ph:'马-提-莫-抖',phTip:'同时理解文字、图像、声音等多种"模态"',zh:'多模态',def:'能够处理和生成多种类型数据（文本、图像、音频、视频等）的AI系统',story:'🦅 人类用五感认识世界——眼耳鼻舌身。多模态AI在做同样的事：GPT-4V能看图理解，Gemini能处理视频，Claude能分析图表。你拍一张菜单照片让AI翻译，或者上传报表截图让AI分析数据——这都是多模态在工作。未来的AI一定是多模态的。',ex:'The multimodal model analyzed the chart image and explained the revenue trends in detail.',exZh:'多模态模型分析了图表图片并详细解释了收入趋势。',rel:['Vision','Audio','Foundation Model','GPT-4V']},
{id:'alignment',term:'Alignment',full:'对齐',pron:'/əˈlaɪnmənt/',emoji:'🧭',ph:'阿-来-门特',phTip:'让AI的目标和行为"对齐"人类价值观',zh:'对齐（AI对齐）',def:'确保AI系统的目标、行为和价值观与人类意图和价值观保持一致的研究领域',story:'🎯 给AI设定目标"让用户开心"——如果没有对齐，AI可能学会给用户注射多巴胺（让人上瘾）而非真正帮助他们。AI对齐研究的核心问题：如何确保超级智能AI的行为符合人类利益，而非因为优化错误目标而造成伤害？这是Anthropic成立的核心使命。',ex:'AI alignment research aims to ensure that powerful AI systems pursue goals that benefit humanity.',exZh:'AI对齐研究旨在确保强大的AI系统追求有益于人类的目标。',rel:['AI Safety','RLHF','Constitutional AI','Values']},
{id:'mcp',term:'MCP',full:'模型上下文协议',pron:'/ˌɛm siː ˈpiː/',emoji:'🔌',ph:'艾姆-西-皮',phTip:'"Model Context Protocol"，AI连接外部工具的标准插头',zh:'MCP（模型上下文协议）',def:'Anthropic提出的开放协议，让AI模型能够标准化地连接和使用外部工具、数据源和服务',story:'🔌 USB发明之前，每个设备都要单独的接口——乱套。USB统一了标准，万物皆可插。MCP就是AI工具连接的"USB标准"：无论是数据库、日历、代码编辑器还是任何外部服务，只要接入MCP，AI就能调用。2024年底发布，2025年已成行业标准。',ex:'With MCP, Claude can connect to your company\'s database and calendar in one workflow.',exZh:'通过MCP，Claude能在一个工作流中连接公司数据库和日历。',rel:['Tool Use','Agent','API','Integration']},
{id:'rlhf',term:'RLHF',full:'基于人类反馈的强化学习',pron:'/ˌɑːr ɛl eɪtʃ ˈɛf/',emoji:'👍',ph:'阿-艾-艾-爱-奇-艾弗',phTip:'让真人给AI打分，AI从人类偏好中学习',zh:'RLHF',def:'通过收集人类对AI输出的偏好反馈来训练奖励模型，再用强化学习优化AI行为的技术',story:'👨‍⚖️ AI生成两个答案，人类评分员选哪个更好——重复几十万次，AI就学会了"人类更喜欢什么样的回答"。这就是RLHF，ChatGPT从冰冷的文字预测进化为"会聊天的AI"的关键技术。RLHF让AI学会了礼貌、有帮助、安全——以及人类价值观中更微妙的东西。',ex:'RLHF transformed ChatGPT from a raw language model into a helpful, harmless assistant.',exZh:'RLHF将ChatGPT从原始语言模型转变为有帮助且无害的助手。',rel:['Reinforcement Learning','Alignment','Reward Model','Fine-tuning']},
{id:'zeroshot',term:'Zero-shot',full:'零样本学习',pron:'/ˈzɪərəʊ ʃɒt/',emoji:'🎯',ph:'子-柔 肖特',phTip:'没见过的任务，AI直接就会——零示例',zh:'Zero-shot（零样本）',def:'AI模型在没有见过任何该任务示例的情况下，仅凭指令就能完成任务的能力',story:'🪄 你告诉一个天才学生"把这段文字翻译成罗马尼亚语"——他从没学过罗马尼亚语，但凭借语言天赋和逻辑推理，给了你个大致靠谱的翻译。大型LLM的Zero-shot能力惊人：没训练过的任务，凭借通用语言理解能力就能完成。这是大模型区别于小模型的核心优势之一。',ex:'GPT-4 can classify text in languages it never explicitly trained on using zero-shot prompting.',exZh:'GPT-4可以使用零样本提示对从未明确训练过的语言文本进行分类。',rel:['Few-shot','In-context Learning','Prompt','LLM']},
{id:'fewshot',term:'Few-shot',full:'少样本学习',pron:'/fjuː ʃɒt/',emoji:'🔫',ph:'佛-肖特',phTip:'给AI看几个例子，它就懂了——少示例',zh:'Few-shot（少样本）',def:'在Prompt中提供少量示例（通常2-10个），引导AI理解任务格式和要求的提示技术',story:'📋 告诉AI："苹果→水果，玫瑰→花卉，金毛→？" AI回答"犬类"——这就是few-shot：你给了几个例子，AI理解了规律。Few-shot比zero-shot更稳定：当任务格式不明显时，几个示例胜过千言万语的描述。这也是Prompt Engineering的核心技巧之一。',ex:'Providing three few-shot examples dramatically improved the model\'s formatting accuracy.',exZh:'提供三个少样本示例显著提升了模型的格式准确率。',rel:['Zero-shot','Prompt Engineering','In-context Learning','Prompt']},
{id:'cot',term:'Chain of Thought',full:'思维链',pron:'/tʃeɪn əv θɔːt/',emoji:'⛓️',ph:'切-恩 额夫 冒特',phTip:'让AI"一步一步想"，而不是直接跳答案',zh:'思维链（CoT）',def:'通过要求AI逐步展示推理过程来提升复杂问题解决能力的提示技术',story:'🧩 直接问AI"198×47=？"可能出错。但让它"一步一步计算"：198×40=7920，198×7=1386，7920+1386=9306——正确率大幅提升。思维链就是让AI"展示做题过程"而非"直接写答案"。对数学、逻辑、多步骤问题效果显著，有时准确率提升超过50%。',ex:'"Let\'s think step by step" prompting can double accuracy on complex math problems.',exZh:'"让我们一步一步思考"提示方式可以将复杂数学问题的准确率翻倍。',rel:['Prompt Engineering','Reasoning','Zero-shot','Few-shot']},
{id:'vectordb',term:'Vector Database',full:'向量数据库',pron:'/ˈvɛktər ˈdeɪtəbeɪs/',emoji:'🗄️',ph:'唯-克-特 戴-特-贝斯',phTip:'专门存和搜索"向量"的数据库，AI的"长期记忆"',zh:'向量数据库',def:'专门存储和检索高维向量数据的数据库，支持基于语义相似度的高效搜索',story:'📚 普通数据库：找"苹果"只能精确匹配"苹果"。向量数据库：把"苹果"转成数字坐标（向量），搜索时能找到意思相近的"iPhone"、"水果"、"乔布斯"。这是RAG的关键组件：把知识库存成向量，用户提问时找出最相关的文档片段喂给LLM。Pinecone、Weaviate、Chroma是主流选择。',ex:'The vector database retrieved the three most relevant documents to answer the user\'s question.',exZh:'向量数据库检索出三个最相关的文档来回答用户的问题。',rel:['Embedding','RAG','Semantic Search','Database']},
{id:'pe',term:'Prompt Engineering',full:'提示工程',pron:'/prɒmpt ˌɛndʒɪˈnɪərɪŋ/',emoji:'🔧',ph:'普罗姆普特 恩-基-尼-瑞',phTip:'设计高质量Prompt的技巧与艺术',zh:'提示工程',def:'通过优化输入给AI的提示词（Prompt）设计，最大化AI输出质量的技能和方法论',story:'🗝️ 同一个问题，不同问法得到截然不同的答案。"写篇文章" vs "你是资深科技记者，为《连线》杂志写一篇800字的深度报道，主题是AI对制造业的影响，读者是企业高管，用第一人称，结尾给出三条行动建议"——哪个效果好不言而喻。Prompt Engineering就是掌握这门"与AI沟通"的艺术。',ex:'Good prompt engineering can turn a mediocre AI response into an expert-level output.',exZh:'好的提示工程能将平庸的AI回复转变为专家级输出。',rel:['System Prompt','Few-shot','Chain of Thought','LLM']},
{id:'sysprompt',term:'System Prompt',full:'系统提示词',pron:'/ˈsɪstəm prɒmpt/',emoji:'⚙️',ph:'西斯-腾 普罗姆普特',phTip:'给AI设定"角色和规则"的幕后指令',zh:'系统提示词',def:'在对话开始前由开发者设置的隐藏指令，定义AI的角色、行为规范和约束条件',story:'🎭 你和ChatGPT聊天，它表现得有礼貌、有边界——这是因为OpenAI在背后设置了System Prompt，规定了它的角色和行为准则。企业用System Prompt把通用LLM变成专属客服："你是XX公司的客服助手，只回答产品相关问题，使用友好专业的语气……"。用户看不到System Prompt，但它控制着AI的一切行为。',ex:'The system prompt instructs the AI to always respond in formal English and cite its sources.',exZh:'系统提示词指示AI始终用正式英语回应并引用来源。',rel:['Prompt','Prompt Engineering','LLM','Context']},
{id:'temperature',term:'Temperature',full:'温度（采样参数）',pron:'/ˈtɛmprɪtʃər/',emoji:'🌡️',ph:'腾-普-瑞-切',phTip:'控制AI"创意度"和"随机性"的旋钮',zh:'Temperature（温度）',def:'控制AI语言模型输出随机性的参数，值越高输出越多样和创意，值越低越确定和保守',story:'🎲 Temperature=0：AI每次给同样答案（像个精确的计算器）。Temperature=1：AI发散思维，每次回答都不同（像个创意作家）。Temperature=2：AI开始胡说八道（"醉酒"状态）。写代码用低温度（要准确），写诗用高温度（要创意）。这个旋钮调节AI的"个性"。',ex:'Set temperature to 0 for consistent code generation and 0.9 for creative writing.',exZh:'代码生成时将temperature设为0以保持一致性，创意写作时设为0.9。',rel:['Sampling','Top-p','Inference','Generation']},
{id:'tooluse',term:'Tool Use',full:'工具调用',pron:'/tuːl juːz/',emoji:'🔨',ph:'图 尤兹',phTip:'给AI装上"手"，让它能执行真实操作',zh:'工具调用',def:'AI模型能够调用外部工具（搜索引擎、计算器、数据库、API等）来增强自身能力的特性',story:'🦾 裸LLM是个博学但手无寸铁的学者——知道很多但做不了事。有了Tool Use：需要最新信息→调用搜索；需要精确计算→调用计算器；需要发邮件→调用邮件API。Claude和GPT-4的Function Calling就是Tool Use。这是Agent能力的核心基础——让AI从"说"变成"做"。',ex:'The AI used tool calling to search the web and retrieve the current stock price.',exZh:'AI使用工具调用搜索网络并获取当前股价。',rel:['Agent','Function Calling','MCP','API']},
{id:'funcall',term:'Function Calling',full:'函数调用',pron:'/ˈfʌŋkʃən ˈkɔːlɪŋ/',emoji:'📞',ph:'放-可-讯 卡-灵',phTip:'AI能精确"调用"外部函数并处理返回结果',zh:'函数调用',def:'AI模型识别用户意图后，以结构化格式调用预定义函数并处理返回结果的能力',story:'💻 用户说"帮我查一下北京天气"——LLM识别出需要调用天气API，生成结构化调用请求：{function: "get_weather", args: {city: "Beijing"}}，API返回数据，LLM再用自然语言回答用户。Function Calling让LLM从"聊天机器人"升级为"能干实事的AI助手"。',ex:'The model used function calling to query the database and return structured results.',exZh:'模型使用函数调用查询数据库并返回结构化结果。',rel:['Tool Use','Agent','API','MCP']},
{id:'grounding',term:'Grounding',full:'事实接地',pron:'/ˈɡraʊndɪŋ/',emoji:'⚓',ph:'古朗-丁',phTip:'把AI的回答"锚定"在真实信息上，防止乱编',zh:'Grounding（事实接地）',def:'将AI生成的内容与可验证的真实数据或文档相连接，减少幻觉、提升可信度的技术',story:'⚓ 没有Grounding的AI是飘在空中的热气球——看起来很高，但可能完全脱离现实。Grounding就是那根绳子：让AI的回答基于具体文档、数据库或搜索结果，而非凭空生成。"根据以下文档回答..."这句话就是最简单的Grounding。企业AI系统的核心设计原则之一。',ex:'Grounding the chatbot on verified documents reduced hallucinations by 80%.',exZh:'将聊天机器人接地到已验证文档上，将幻觉减少了80%。',rel:['RAG','Hallucination','Retrieval','Citation']},
{id:'multiagent',term:'Multi-agent',full:'多智能体',pron:'/ˌmʌlti ˈeɪdʒənt/',emoji:'👥',ph:'马-提 诶-剑特',phTip:'多个AI Agent分工协作，完成复杂任务',zh:'多智能体（Multi-agent）',def:'多个AI Agent协同工作、相互通信，共同完成单一Agent难以独立完成的复杂任务的系统',story:'🏭 一个大厂的产品团队：产品经理、设计师、工程师、测试各司其职，协同完成一款产品。Multi-agent系统同理：一个Agent负责搜索，一个负责分析，一个负责写报告，一个负责质检——共同产出高质量结果。这是现在最前沿的AI工程方向之一。',ex:'The multi-agent system used three specialized agents to research, write, and fact-check the report.',exZh:'多智能体系统使用三个专业Agent来研究、撰写和核实报告。',rel:['Agent','Orchestration','Tool Use','Autonomous']},
